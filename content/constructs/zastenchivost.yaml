slug: zastenchivost
title: Застенчивость и социальная тревожность
seoTitle: 'Застенчивость и социальная тревожность: в чём разница'
description: Чем застенчивость отличается от интроверсии и от страха оценки, почему избегание закрепляет тревогу и какие шаги
  действительно её ослабляют.
intro: 'Застенчивость — это напряжение в начале контакта: скованность с незнакомыми людьми, которая отступает, когда обстановка
  становится знакомой. Её постоянно смешивают с интроверсией и с социальной тревожностью, хотя это три разные вещи: интроверту
  просто хватает меньшего количества общения, а социальная тревожность — устойчивый страх оценки, из-за которого человек отказывается
  от ситуаций и теряет возможности.'
sections:
- heading: Три разные вещи, которые постоянно путают
  body: 'Интроверсия — про количество общения, а не про страх: людей такого склада одиночество восстанавливает, а не тяготит,
    и компания нужна им реже, чем другим. Застенчивость — про первые минуты: неловкость при знакомстве, тишина за общим столом,
    ощущение собственной неуклюжести, которое проходит, когда человек осваивается. Социальная тревожность — про устойчивый
    страх оценки: провал предчувствуется заранее, а ситуации, где могут посмотреть и осудить, обходятся стороной. Разница
    видна не по силе волнения, а по последствиям: застенчивость притормаживает, тревога забирает выступления, знакомства и
    повышения. И главное, что удерживает страх на месте, — избегание: пропущенная ситуация не даёт проверить опасение на опыте,
    поэтому прогноз «я опозорюсь» остаётся неопровергнутым.'
- heading: Откуда берётся
  body: 'Стартовая точка задаётся темпераментом: часть детей с младенчества дольше присматривается к незнакомому, и во взрослой
    жизни это чаще выглядит как сдержанность в начале контакта. Дальше накладывается опыт — насмешка при всех, разбор ошибок
    на публике, семья или класс, где промах обсуждали громче, чем сделанное. Третий слой — сам механизм избегания: отказ от
    ситуации приносит мгновенное облегчение, и это облегчение запоминается как удачное решение, поэтому в следующий раз отказаться
    легче. Заодно не набирается практика, разговоры даются тяжелее, и трудность подтверждает исходное «у меня не получается».
    Круг замыкается: чем меньше опыта, тем страшнее, а чем страшнее — тем меньше опыта.'
- heading: Что с этим делать
  body: 'Работает не успокоение перед выходом, а накопление опыта, который спорит со страхом. Составьте лестницу ситуаций
    от слегка неприятных до трудных — спросить время у прохожего, задать вопрос на планёрке, позвонить вместо переписки —
    и двигайтесь снизу, повторяя каждую ступень, пока она не станет будничной. Второе — внимание: при тревоге оно разворачивается
    внутрь, на свой голос, покрасневшие щёки и картинку себя со стороны, поэтому разговор проходит мимо, а в памяти остаётся
    только эта картинка; переводите внимание наружу, на собеседника и содержание разговора. Третье — отказ от подпорок вроде
    заготовленных фраз, телефона в руках и бокала «для смелости»: с ними встреча вроде бы проходит, но опыт не засчитывается,
    потому что успех приписывается подпорке. Четвёртое — не устраивать вечером разбор полётов: пересматривание сцены по кругу
    дописывает провалы, которых не было. Всё это — рабочие элементы когнитивно-поведенческой терапии, у которой по социальной
    тревоге лучшая доказательная база.'
- heading: Когда имеет смысл поговорить со специалистом
  body: 'Ориентир простой: избегание держится месяцами и уже мешает работе, учёбе или отношениям — отказ от проектов с выступлениями,
    несданный зачёт, знакомства, которые не случились. Другие поводы — алкоголь как способ выдержать общение, дрожь и тошнота
    за несколько дней до встречи, откладывание визита к врачу из-за необходимости говорить с человеком за стойкой. С этим
    работают, и обычно счёт идёт на месяцы, а не на годы: постепенная экспозиция вместе с разбором прогнозов даёт устойчивый
    результат у большинства обратившихся. Тест на сайте — самоотчёт и ориентир: он показывает, насколько сильно страх оценки
    и избегание влияют на жизнь, но диагноз по нему не ставится.'
faq:
- q: Застенчивость остаётся на всю жизнь?
  a: 'Темперамент задаёт стартовую точку, а не потолок. Реакция на новых людей заметно смягчается с опытом: то, что повторяется
    каждую неделю, перестаёт быть событием. Лёгкая скованность в первые минуты может сохраниться, и она почти никому не мешает,
    пока не превращается в отказ от контакта.'
- q: Помогает ли бокал перед встречей?
  a: На один вечер — да, и в этом ловушка. Успех записывается на счёт алкоголя, а не собственных сил, поэтому страх в следующий
    раз тот же, а привычка крепче. Плюс доза со временем растёт, и общение без неё становится ещё труднее.
- q: Можно ли просто заставить себя больше общаться?
  a: Количество само по себе помогает слабо. Прыжок сразу в самую страшную ситуацию чаще заканчивается подтверждением опасений,
    чем победой, — работает постепенность и повторение одной ступени до привыкания. И следить надо не за силой волнения, а
    за тем, куда направлено внимание и не вернулись ли подпорки.
- q: Что показывает тест?
  a: 'Насколько описания про страх оценки и избегание совпадают с устройством обычной недели: где приходится отказываться
    и чего это лишает. Это самоотчёт — он даёт язык для разговора о проблеме и подсказку, есть ли смысл идти дальше. Заключение
    делает специалист на очной встрече, а не шкала.'
