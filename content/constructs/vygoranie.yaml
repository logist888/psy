slug: vygoranie
title: Выгорание
seoTitle: 'Выгорание: признаки, стадии и что с этим делать'
description: Что такое выгорание, чем оно отличается от усталости и депрессии, как понять, что оно у вас, и с чего начинать
  восстановление.
intro: 'Выгорание — это состояние истощения, которое развивается из хронического рабочего стресса, с которым не удалось справиться.
  Всемирная организация здравоохранения относит его к факторам, влияющим на здоровье, но не считает болезнью: это не диагноз,
  а описание того, что происходит с человеком на работе.'
sections:
- heading: Как выглядит выгорание
  body: 'Классическое описание включает три составляющие. Первая — истощение: сил не остаётся даже после выходных, и сон перестаёт
    восстанавливать. Вторая — отстранённость: работа и люди в ней начинают раздражать, появляется цинизм, желание свести общение
    к минимуму. Третья — ощущение бессмысленности: кажется, что усилия ни на что не влияют, а собственные достижения не считаются
    достижениями. Обычно они появляются именно в таком порядке, но не обязательно.'
- heading: Чем выгорание отличается от усталости
  body: 'Усталость проходит после отдыха, выгорание — нет. Если после отпуска вы возвращаетесь в то же состояние через неделю,
    дело не в количестве отдыха. Разница ещё и в отношении: уставший человек хочет отдохнуть и вернуться, выгоревший не хочет
    возвращаться вовсе.'
- heading: Чем выгорание отличается от депрессии
  body: 'Выгорание привязано к работе: за её пределами интерес к жизни обычно сохраняется. При депрессии тускнеет всё, включая
    то, что раньше радовало, и добавляются нарушения сна и аппетита, чувство вины, мысли о бессмысленности жизни. Различить
    их по опроснику нельзя — это делает специалист. Если сомневаетесь, исходите из того, что разговор со специалистом полезен
    в обоих случаях.'
- heading: Почему «взять себя в руки» не работает
  body: 'Выгорание вырастает не из слабости, а из длительного несоответствия между тем, что от вас требуется, и тем, чем вы
    располагаете: временем, влиянием, признанием, смыслом. Пока это несоответствие сохраняется, любые техники самомотивации
    только ускоряют истощение. Поэтому восстановление начинается с изменения условий, а не с попыток работать усерднее.'
- heading: С чего начинать
  body: 'Сон и границы рабочего дня — первое, без чего остальное не работает. Затем — разделение того, на что вы влияете,
    и того, на что нет: выгорание сильнее растёт из хронического бессилия, чем из объёма задач. И третье — вернуть в неделю
    хотя бы одно занятие, которое вы делаете не ради результата. Если истощение держится дольше трёх месяцев или к нему добавились
    нарушения сна и аппетита, стоит обратиться к специалисту.'
faq:
- q: Выгорание — это диагноз?
  a: Нет. В международной классификации болезней выгорание описано как фактор, влияющий на состояние здоровья, но не как заболевание.
    Диагнозом может оказаться то, что за ним скрывается, — например, депрессия или тревожное расстройство.
- q: Можно ли выгореть, если работа нравится?
  a: Да, и это частый случай. Люди, вовлечённые в дело, чаще перерабатывают и труднее замечают истощение, потому что усталость
    долго объясняется увлечённостью.
- q: Поможет ли отпуск?
  a: 'Отпуск помогает при усталости и почти не помогает при выгорании: без изменения условий состояние возвращается за одну-две
    недели. Отпуск полезен как пауза, чтобы принять решения, а не как лечение.'
- q: Сколько восстанавливаются после выгорания?
  a: 'Единого срока нет, и он зависит от того, насколько удаётся изменить сами условия работы. Универсальное правило одно:
    чем раньше замечено, тем быстрее проходит.'
