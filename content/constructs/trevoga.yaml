slug: trevoga
title: Тревога и напряжение
seoTitle: 'Тревожность: откуда берётся, как проявляется и что помогает'
description: Чем тревога отличается от страха, почему она держится в теле, что усиливает её физиологически и когда стоит обращаться
  за помощью.
intro: 'Тревога — это реакция на угрозу, которой ещё нет. В отличие от страха, у которого есть конкретный предмет, тревога
  направлена в будущее: организм готовится к тому, что может случиться. Это нормальный механизм, и проблемой он становится
  тогда, когда включается слишком часто, слишком сильно или не выключается вовсе.'
sections:
- heading: Как тревога проявляется
  body: 'У тревоги три уровня. Мысли: прокручивание разговоров, ожидание плохого, невозможность переключиться. Тело: напряжение
    в плечах и челюсти, учащённое сердцебиение, нехватка воздуха, ком в горле, дрожь. Поведение: избегание, откладывание,
    бесконечные проверки и перестраховка. Обычно человек замечает один уровень и не связывает с ним остальные — например,
    ходит к кардиологу с сердцебиением.'
- heading: Почему тревога держится в теле
  body: 'Тревожная реакция запускает физиологическую подготовку к действию: мышцы напрягаются, дыхание учащается, кровь перераспределяется.
    Если действия не происходит, напряжение остаётся. Поэтому работать с сильной тревогой через уговоры себя обычно бесполезно:
    сначала нужно снять телесную составляющую, и только потом ум становится способен слушать доводы.'
- heading: Что усиливает тревогу физиологически
  body: 'Недосып, кофеин, алкоголь и отсутствие движения повышают уровень тревоги независимо от того, что происходит в жизни.
    Алкоголь особенно коварен: он снижает тревогу вечером и заметно повышает её на следующий день. Прежде чем искать психологические
    причины, стоит проверить эти четыре.'
- heading: Что делать прямо сейчас
  body: 'При остром приступе работает дыхание с удлинённым выдохом: вдох на четыре счёта, выдох на шесть-восемь, две-три минуты.
    Это не отвлечение, а физиологическое торможение реакции. При постоянной фоновой тревоге помогает противоположное — не
    подавлять её, а отвести ей время: пятнадцать минут в день, отведённые на беспокойство, работают лучше, чем попытки не
    думать.'
- heading: Когда обращаться к специалисту
  body: 'Если тревога держится больше месяца, мешает спать, работать или общаться, или если вы начали избегать обычных дел
    из-за неё. Тревожные состояния хорошо поддаются работе, и чем раньше начать, тем короче путь. Отдельно: если тревога сопровождается
    физическими симптомами, имеет смысл сначала исключить телесные причины у врача — например, нарушения работы щитовидной
    железы дают очень похожую картину.'
faq:
- q: Чем тревога отличается от тревожного расстройства?
  a: Степенью и последствиями. Тревога — нормальная реакция, знакомая каждому. О расстройстве говорят, когда тревога непропорциональна
    ситуации, держится месяцами и мешает жить. Границу определяет специалист, а не опросник.
- q: Может ли тревога быть от физической причины?
  a: Да. Нарушения работы щитовидной железы, дефицит железа, некоторые лекарства и отмена алкоголя дают состояния, неотличимые
    от тревожных. Поэтому при выраженной телесной симптоматике разумно начать с врача.
- q: Помогают ли дыхательные техники?
  a: 'При острой тревоге — да, они снижают физиологическую активацию за минуты. При хронической тревоге они дают временное
    облегчение, но не убирают причину: там нужна регулярная работа, чаще всего со специалистом.'
- q: Тревожность — это черта характера?
  a: 'Отчасти: склонность к тревоге частично наследуется и остаётся довольно устойчивой. Но уровень тревоги в конкретный период
    жизни меняется сильно, и именно с ним можно работать.'
