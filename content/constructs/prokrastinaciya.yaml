slug: prokrastinaciya
title: Прокрастинация
seoTitle: 'Прокрастинация: почему откладываем и что с этим работает'
description: Почему прокрастинация — это не лень и не проблема тайм-менеджмента, какие эмоции за ней стоят и какие приёмы
  действительно помогают начать.
intro: 'Прокрастинация — это добровольное откладывание дела, несмотря на понимание, что промедление сделает хуже. Ключевое
  слово здесь «несмотря»: человек знает, хочет и всё равно не начинает. Именно поэтому советы про планирование почти не помогают
  — проблема не в расписании.'
sections:
- heading: Это не лень
  body: 'Лень — это когда не хочется и всё равно. Прокрастинация — когда хочется, надо, и от неначинания становится плохо.
    Прокрастинирующий человек обычно занят: он моет посуду, отвечает на письма, наводит порядок — то есть делает что угодно,
    кроме главного. Это не дефицит энергии, а её перенаправление.'
- heading: За откладыванием стоит эмоция
  body: 'Дело, которое откладывается, почти всегда вызывает неприятное чувство: тревогу («не справлюсь»), скуку, стыд или
    бессилие. Откладывание мгновенно снимает это чувство — и потому закрепляется, как любое поведение с быстрым облегчением.
    Дальше добавляется вина за само откладывание, она делает следующий подход тяжелее, и круг замыкается.'
- heading: Почему планировщики не спасают
  body: Ещё один список задач не меняет эмоцию, которая мешает начать. Более того, составление плана само по себе даёт приятное
    ощущение продвижения — и становится очередной формой откладывания. Работает не улучшение плана, а уменьшение сопротивления
    на входе.
- heading: Что действительно помогает
  body: 'Уменьшить первый шаг до нелепо маленького: не «написать отчёт», а «открыть документ и напечатать заголовок». Разрешить
    себе сделать плохо в первом подходе — перфекционизм и прокрастинация связаны напрямую, потому что пока не начал, не провалился.
    И назвать чувство, которое возникает перед делом: тревога, скука или стыд требуют разных ответов, а «соберись» не отвечает
    ни на один.'
- heading: Когда дело не в прокрастинации
  body: Если откладывается всё, включая мелочи и приятное, если пропал интерес и нарушился сон — это уже не про регуляцию,
    и тайм-менеджмент тут бесполезен. Похожую картину дают выгорание, депрессия и СДВГ. Устойчивое откладывание месяцами —
    повод поговорить со специалистом, а не купить ещё один курс продуктивности.
faq:
- q: Прокрастинация — это диагноз?
  a: Нет, это описание поведения. Но она бывает проявлением состояний, у которых диагноз есть, — например, депрессии, тревожных
    расстройств или СДВГ.
- q: Правда ли, что некоторые лучше работают под дедлайн?
  a: 'Ощущение продуктивности в последний момент реально, но обычно это адреналин, а не эффективность: качество страдает,
    а цена — хронический стресс. Устойчивой работоспособности этот режим не даёт.'
- q: Помогает ли метод «помидора»?
  a: 'Часто да, и именно потому, что уменьшает вход: 25 минут — обозримо, а значит, менее страшно. Это работает как снижение
    сопротивления, а не как управление временем.'
- q: Как отличить прокрастинацию от отдыха?
  a: 'По тому, что происходит внутри. Отдых восстанавливает, после него легче. Прокрастинация не восстанавливает: человек
    не работает и не отдыхает, а тревожится над недоделанным.'
