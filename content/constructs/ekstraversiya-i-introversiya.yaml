slug: ekstraversiya-i-introversiya
title: Экстраверсия и интроверсия
seoTitle: 'Экстраверсия и интроверсия: чем различаются и как устроены'
description: Интроверт — не то же самое, что стеснительный человек. Чем экстраверсия отличается от общительности, откуда берётся
  разница и что с ней делать.
intro: 'Экстраверсия и интроверсия — про то, сколько внешней стимуляции комфортно переносить и откуда берутся силы. Экстраверту
  оживление в компании добавляет энергии, интроверту то же самое количество общения её расходует, даже если разговор приятный.
  Это шкала, а не два ящика: большинство людей располагается ближе к середине, чем к краям.'
sections:
- heading: Интроверсия — это не стеснительность
  body: 'Стеснительность и социальная тревога — про страх оценки: общения хочется, но страшно сказать что-то не то. Интроверсия
    — про ёмкость: контакт с людьми расходует ресурс быстрее, чем восполняет, независимо от того, страшно или нет. Поэтому
    существует интроверт, который спокойно ведёт переговоры и выступает перед залом, а потом два дня не хочет никого видеть,
    — и экстраверт, который отчаянно тянется к людям и при этом мучительно боится их суждения. Путаница берётся из внешнего
    сходства: и тот и другой могут отказаться от вечеринки, но по разным причинам и с совершенно разными чувствами по дороге
    домой.'
- heading: Откуда берётся разница
  body: 'Различия видны рано: младенцы по-разному реагируют на новизну, шум и незнакомые лица, и эта реакция довольно устойчиво
    предсказывает взрослый профиль. Объяснения крутятся вокруг чувствительности к стимуляции и к вознаграждению: интровертам
    хватает меньшего уровня внешнего шума, чтобы дойти до предела комфорта, а экстраверты сильнее откликаются на новизну и
    одобрение, поэтому тянутся к ним чаще. Отсюда бытовое: одному фоновая музыка помогает сосредоточиться, другому мешает
    даже разговор за стеной. Опыт добавляет навыки — начинать разговор, держаться в компании, — но не двигает сам порог: уверенный
    оратор-интроверт после выступления всё равно уходит восстанавливаться в тишину.'
- heading: Что с этим делать
  body: 'Сначала стоит отделить, что именно мешает. Если общения хочется, но страшно, помогает тренировка контактов малыми
    шагами: короткие разговоры, где задача не понравиться, а побыть в ситуации достаточно долго, чтобы тревога спала сама,
    — на этом построена доказательная работа с социальной тревогой. Если общения не хочется, потому что оно выматывает, нужна
    не смелость, а расписание: паузы между встречами, заранее оговорённое право уйти через час, свободный вечер после большого
    мероприятия. Отдельная вещь — временно вести себя нехарактерно ради важного дела: интроверт может отработать неделю сплошных
    презентаций, экстраверт — месяц одиночной аналитики, но за это приходится платить восстановлением, и его лучше планировать
    заранее, а не когда сил уже нет. И стоит проговаривать свой режим вслух: молчание на встрече читают как несогласие, а
    ранний уход с праздника — как обиду.'
- heading: Когда имеет смысл поговорить со специалистом
  body: 'Сама по себе интроверсия — не то, что чинят. Разговор с психологом полезен, когда дело уже не в предпочтении, а в
    избегании: приглашения отклоняются не потому, что не хочется, а потому, что заранее прокручиваются сценарии провала, звонки
    откладываются днями, а после любого общения вы часами разбираете, что и как сказали. Второй признак — сужение жизни: круг
    общения незаметно сжался до одного-двух человек или до переписки, и это ощущается как потеря, а не как выбор. Бывает и
    обратное: одиночество переносится настолько тяжело, что подходит любая компания и любые отношения, лишь бы не оставаться
    наедине с собой. С социальной тревогой хорошо работает когнитивно-поведенческая терапия, и заметная разница обычно появляется
    за несколько месяцев.'
faq:
- q: Бывает ли человек и экстравертом, и интровертом сразу?
  a: Это самый частый вариант. Экстраверсия — непрерывная шкала, и большинство результатов приходится на середину, где слово
    «амбиверт» просто описывает положение между полюсами. Выраженные края встречаются гораздо реже, чем кажется по популярным
    описаниям типов.
- q: Меняется ли это с возрастом?
  a: 'Немного и медленно. К среднему возрасту у многих слегка снижается тяга к шумной социальной активности и растёт устойчивость
    — это общий возрастной сдвиг, а не смена типа. Резкие перемены чаще говорят не о личности, а об обстоятельствах: переезд,
    выгорание, новая работа, потеря близкого человека.'
- q: Правда ли, что интроверты хуже в работе с людьми?
  a: 'Нет. В продажах и руководстве лучшие результаты по имеющимся данным показывают не самые общительные, а те, кто ближе
    к середине шкалы: очень высокая экстраверсия мешает слушать и уступать. Интроверты часто сильнее в переговорах один на
    один, в подготовке и в работе с деталями.'
- q: Что вообще показывает тест на экстраверсию?
  a: Ваши собственные ответы о привычках и предпочтениях на сегодня — это самоотчёт и ориентир, а не диагноз. Результат полезен
    тем, что показывает направление склонности и место расхождения с тем, как вы себя представляете. Если он сильно спорит
    с ощущением себя, проверьте, не отвечали ли вы про рабочую роль вместо жизни в целом.
