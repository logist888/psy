slug: samoocenka
title: Самооценка
seoTitle: 'Самооценка: что это, откуда берётся низкая и как её поднять'
description: Чем самооценка отличается от уверенности, почему она не поднимается похвалой и что на неё влияет на самом деле.
intro: 'Самооценка — это устойчивое отношение к себе: насколько человек считает себя достойным уважения и принятия. Она не
  равна уверенности в своих силах: можно быть отличным специалистом, точно знать свою компетентность и при этом относиться
  к себе плохо.'
sections:
- heading: Откуда берётся низкая самооценка
  body: Чаще всего — из усвоенного взгляда на себя чужими глазами. Ребёнок, которого регулярно сравнивали не в его пользу,
    вырастает во взрослого, который делает это сам, уже без посторонней помощи. Второй источник — длительный опыт неудач в
    значимой сфере. Третий — среда, в которой обесценивание является нормой общения.
- heading: Почему похвала не помогает
  body: 'При низкой самооценке память избирательна: провалы запоминаются, успехи объясняются обстоятельствами или удачей.
    Похвала попадает в тот же фильтр — её обесценивают («он просто вежливый») или она вызывает неловкость. Поэтому внешнее
    признание почти не меняет отношения к себе, пока не меняется сам способ истолкования фактов.'
- heading: Что действительно работает
  body: 'Три вещи с накопленными доказательствами. Первое — фиксация фактов: письменный список сделанного за неделю обходит
    избирательную память. Второе — смена точки сравнения: не с другими, а с собой полгода назад, потому что о себе вы знаете
    всё, а о других только внешнюю сторону. Третье — самосострадание: отношение к себе так, как вы отнеслись бы к другу в
    той же ситуации. Последнее звучит мягко, но именно оно надёжнее прочего связано с устойчивостью самооценки.'
- heading: Когда идти к специалисту
  body: Если отношение к себе мешает строить отношения, браться за работу или принимать решения; если появляются мысли о собственной
    ненужности. Самооценка хорошо поддаётся работе, потому что меняется не набор фактов о вас, а способ их читать, — а это
    ровно то, с чем работает психотерапия.
faq:
- q: Чем самооценка отличается от уверенности в себе?
  a: 'Самооценка — про отношение к себе как к человеку. Уверенность — про оценку своих способностей в конкретном деле. Они
    связаны, но не совпадают: можно быть уверенным профессионалом с низкой самооценкой.'
- q: Бывает ли самооценка завышенной?
  a: 'Демонстративно высокая самооценка нередко оказывается защитой хрупкой: её выдаёт болезненная реакция на критику. Устойчивая
    самооценка не требует подтверждений и спокойно переносит несогласие.'
- q: Можно ли поднять самооценку самому?
  a: Отчасти да — регулярная фиксация фактов и работа с внутренней критикой дают результат. Но если убеждение о собственной
    негодности сформировалось рано и держится годами, самостоятельно его обычно не сдвинуть.
