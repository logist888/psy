slug: bezrassudstvo
version: 1.0.0
title: Тест на безрассудство
seoTitle: Тест на безрассудство онлайн — бесплатно, 10 вопросов
description: >-
  Тест из 10 утверждений о том, как вы принимаете решения: сразу и на импульсе или после паузы, проверки деталей и
  взвешивания вариантов.
category: personality
ctaCluster: self
minutes: 3
passport:
  measures: Шкала показывает, насколько человек склонен действовать сразу, не просчитывая последствия.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт
    «безрассудство». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.72 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: безрассудство
    high: решаете быстро, на импульсе, доверяя порыву
    low: берёте паузу и просчитываете варианты заранее
    bands:
      - from: 0
        label: невысокое безрассудство
        text: >-
          Вы почти не принимаете решений сгоряча: сначала пауза, проверка деталей, только потом действие. Это заметно
          снижает число дорогих ошибок. Иногда возможность успевает уйти, пока вы её изучаете, поэтому полезно заранее
          решить, какие решения вообще не заслуживают долгого анализа.
      - from: 40
        label: умеренное безрассудство
        text: >-
          В привычных ситуациях вы действуете быстро, а в крупных берёте паузу. Импульс у вас есть, но он редко
          перевешивает расчёт. Сложнее всего распознать, к какому типу относится ситуация прямо сейчас.
      - from: 70
        label: выраженное безрассудство
        text: >-
          Вы легко срываетесь с места и начинаете, пока другие ещё обсуждают. Скорость даёт преимущество там, где
          промедление стоит дороже ошибки. Расплата — решения, о которых через день хочется передумать, поэтому важна
          привычка ставить между импульсом и действием хотя бы короткую паузу.
questions:
  - id: q1
    text: Бросаюсь в дело, не подумав.
    scales:
      - scale: total
  - id: q2
    text: Действую сгоряча.
    scales:
      - scale: total
  - id: q3
    text: Люблю действовать по настроению.
    scales:
      - scale: total
  - id: q4
    text: Принимаю поспешные решения.
    scales:
      - scale: total
  - id: q5
    text: Предпочитаю отложить решение до утра.
    scales:
      - scale: total
        reverse: true
  - id: q6
    text: Дважды думаю, прежде чем что-то сделать.
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Подстраховываюсь заранее.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Замечаю мелочи.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Взвешиваю всё, прежде чем начать.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Изучаю все варианты.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Введите правило суммы и срока: всё дороже выбранной вами цифры или дольше месяца ждёт до утра — тогда пауза не
    требует силы воли каждый раз.
  - >-
    Перед импульсивным шагом запишите одну строчку: как я пойму через неделю, что это была ошибка. Часто охлаждает уже
    сама формулировка.
  - >-
    Оставьте себе легальную зону импульса — бюджет, вечер или проект, где можно решать мгновенно. Когда порыву есть куда
    деться, он реже прорывается в важном.
