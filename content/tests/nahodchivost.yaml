slug: nahodchivost
version: 1.0.0
title: Тест на находчивость
seoTitle: Тест на находчивость онлайн — бесплатно, 10 вопросов
description: >-
  Оценивает, насколько уверенно вы справляетесь со сложными задачами и не теряетесь под давлением. 10 вопросов, около 3
  минут. Это самоотчёт, а не диагностика.
category: personality
ctaCluster: self
minutes: 3
passport:
  measures: Шкала показывает, насколько уверенно вы беретесь за сложные задачи и держитесь, когда что-то идёт не по плану.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт
    «находчивость». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.83 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: находчивость
    high: уверенно решает сложное и доводит до результата
    low: теряется перед трудностями и ждёт чужого хода
    bands:
      - from: 0
        label: низкая
        text: >-
          Перед сложной задачей вы легко теряетесь: хочется подождать, посоветоваться, отдать решение тому, кто
          увереннее. Осторожность бережёт от лишних ошибок и заставляет готовиться тщательнее многих. Цена — навык
          решать растёт только на практике, а её мало, если каждый раз ждать.
      - from: 40
        label: средняя
        text: >-
          В знакомом деле вы держитесь уверенно, в незнакомом сначала теряете темп, а потом собираетесь. Решения
          принимаете, хоть и не мгновенно. Ритм устойчивый; риск — привыкнуть выбирать задачи по плечу и никогда не
          проверять свой потолок.
      - from: 70
        label: высокая
        text: >-
          Сложное вас скорее заводит: вы разбираете задачу, находите ход и доводите до результата. Люди рядом привыкают,
          что вы вытащите. Цена — на вас сгружают чужие проблемы, а просить помощи самому становится почти неловко.
questions:
  - id: q1
    text: Справляюсь со сложными задачами.
    scales:
      - scale: total
  - id: q2
    text: Смотрю проблемам в лицо.
    scales:
      - scale: total
  - id: q3
    text: Умею многое.
    scales:
      - scale: total
  - id: q4
    text: Формулирую мысли ясно.
    scales:
      - scale: total
  - id: q5
    text: Довожу дела до результата.
    scales:
      - scale: total
  - id: q6
    text: Жду, пока кто-то пойдёт первым.
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Опускаю руки при первой неудаче.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Теряюсь, когда на меня давят.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Не могу принять решение.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Впадаю в панику из-за мелочей.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - 'Ведите список задач, которые вы уже вытащили: под давлением память подсовывает провалы, а не решения.'
  - >-
    В сложной задаче разрешите себе заведомо неидеальный первый ход — ясность обычно появляется от движения, а не до
    него.
  - >-
    Когда к вам приходят с чужой проблемой, начинайте с вопроса «что ты уже попробовал?»: это возвращает задачу
    владельцу и бережёт ваш ресурс.
