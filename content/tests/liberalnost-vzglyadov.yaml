slug: liberalnost-vzglyadov
version: 1.0.0
title: Тест на либеральность взглядов
seoTitle: Тест на либеральность взглядов онлайн — бесплатно, 10 вопросов
description: >-
  Шкала IPIP из 10 утверждений: насколько вы склонны пересматривать традиции и общественные нормы или опираться на них.
  Занимает около 2 минут.
category: values
ctaCluster: self
minutes: 3
passport:
  measures: Насколько человек склонен подвергать сомнению традиции, авторитет и устоявшиеся нормы или опираться на них.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт «либеральность
    взглядов». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.86 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: либеральность взглядов
    high: готов пересматривать нормы и допускать разные правды
    low: опирается на традицию, порядок и твёрдые правила
    bands:
      - from: 0
        label: низкая
        text: >-
          Вы опираетесь на традицию, порядок и понятные правила — они дают предсказуемость и общий язык между людьми.
          Такой взгляд ценит преемственность, но труднее замечает случаи, где правило перестало работать. Это позиция по
          ценностям, а не показатель ума или доброты.
      - from: 40
        label: умеренная
        text: >-
          В одних вопросах вы держитесь традиционного взгляда, в других допускаете пересмотр — многое зависит от темы и
          обстоятельств. Это делает вас гибким собеседником, хотя однозначно занять сторону бывает сложнее. Часто именно
          из такой позиции удаётся слышать оба лагеря.
      - from: 70
        label: высокая
        text: >-
          Вы склонны сомневаться в устоявшихся нормах и допускать разные способы жить и думать. Это помогает замечать
          несправедливость и поддерживать изменения, но иногда обесценивает то, что стабильно работает. Как и
          противоположный полюс, это ценностный выбор, а не мера правоты.
questions:
  - id: q1
    text: Обычно голосую за либеральных политиков.
    scales:
      - scale: total
  - id: q2
    text: Считаю, что нет абсолютно правильного и неправильного.
    scales:
      - scale: total
  - id: q3
    text: Считаю, что преступникам нужнее помощь, чем наказание.
    scales:
      - scale: total
  - id: q4
    text: Верю, что истинная религия только одна.
    scales:
      - scale: total
        reverse: true
  - id: q5
    text: Обычно голосую за консервативных политиков.
    scales:
      - scale: total
        reverse: true
  - id: q6
    text: Считаю, что на поддержку деятелей искусства уходит слишком много денег налогоплательщиков.
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Считаю, что законы нужно исполнять строго.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Считаю, что с преступниками у нас обходятся слишком мягко.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Считаю, что с преступностью надо бороться жёстко.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Люблю вставать, когда играет гимн.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Раз в месяц прочитайте сильный текст с противоположной позицией целиком и не для спора: цель — пересказать чужой
    аргумент так, чтобы автор согласился.
  - >-
    Разделяйте ценность и способ: люди чаще расходятся не в целях (безопасность, справедливость), а в средствах — а спор
    о средствах ведётся спокойнее.
  - >-
    Проверьте, не подбираете ли вы источники под готовый вывод: раз в неделю специально ищите данные, которые могли бы
    вас переубедить.
