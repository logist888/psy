crisis: []
selfHelp:
- 'Уменьшите первый шаг до нелепо маленького: не «написать отчёт», а «открыть документ и написать заголовок». Прокрастинация
  почти всегда про запуск, а не про весь объём.'
- 'Отделите откладывание от лени. Лень — это когда не хочется и всё равно. Прокрастинация — когда хочется, надо, и всё равно
  не начинается: это про регуляцию эмоций, а не про характер.'
- Заметьте, какое чувство появляется перед делом, которое вы откладываете. Чаще всего это тревога, скука или стыд — и работать
  нужно именно с ним, а не с очередным планировщиком.
- 'Если откладывание держится месяцами и захватывает всё, включая мелочи, стоит проверить, нет ли за ним выгорания или сниженного
  настроения: тогда тайм-менеджмент не поможет.'
