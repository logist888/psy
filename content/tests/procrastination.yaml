slug: procrastination
version: 1.0.0
title: Тест на прокрастинацию
seoTitle: Тест на прокрастинацию онлайн — бесплатно, без регистрации
description: 'Насколько сильно вы откладываете дела и что за этим стоит: перфекционизм, сложность запуска или проблемы с оценкой
  времени. 16 утверждений, около 4 минут.'
category: wellbeing
ctaCluster: burnout
minutes: 4
passport:
  measures: 'Выраженность откладывания дел и три его частых механизма: трудность начала, страх сделать плохо и недооценка
    необходимого времени.'
  origin: Собственная разработка проекта на основе исследований прокрастинации как проблемы саморегуляции, а не лени.
  rightsBasis: own_work
  rightsNote: Формулировки принадлежат проекту.
  reliability: Опросник новый и независимой психометрической проверки не проходил.
  limitations: 'Прокрастинация — симптом, а не причина. За устойчивым откладыванием часто стоит другое: тревога, выгорание,
    депрессия, СДВГ или просто нелюбимая работа. Опросник эти причины не различает.'
instruction: Вспомните последний месяц — работу, учёбу и бытовые дела.
options:
- text: Почти никогда
  value: 0
- text: Иногда
  value: 1
- text: Часто
  value: 2
- text: Почти всегда
  value: 3
scales:
- id: total
  name: Общий уровень откладывания
  high: дела систематически уходят на последний момент
  low: дела делаются вовремя
  bands:
  - from: 0
    label: низкий
    text: Вы делаете дела вовремя. Откладывание случается, но не управляет вашим расписанием.
  - from: 40
    label: заметный
    text: Откладывание стало привычным способом обращения с задачами и уже стоит вам нервов, хотя дела в итоге делаются.
  - from: 70
    label: высокий
    text: 'Откладывание всерьёз мешает: сроки горят, растёт чувство вины, а вина делает следующий запуск ещё тяжелее. Это
      замкнутый круг, и разорвать его усилием воли обычно не выходит.'
- id: start
  name: Трудность начала
  high: самое тяжёлое — начать
  low: начать легко
  bands:
  - from: 0
    label: низкая
    text: Начать для вас не проблема.
  - from: 40
    label: заметная
    text: 'Самое тяжёлое — первые пять минут: как только начали, дело идёт.'
  - from: 70
    label: высокая
    text: Запуск даётся очень тяжело. Здесь помогает не мотивация, а уменьшение первого шага до смешного размера.
- id: perfect
  name: Страх сделать плохо
  high: откладывание из-за высоких требований к себе
  low: спокойное отношение к качеству
  bands:
  - from: 0
    label: низкий
    text: Требования к себе не мешают начинать.
  - from: 40
    label: заметный
    text: Вы иногда откладываете, потому что не уверены, что сделаете достаточно хорошо.
  - from: 70
    label: высокий
    text: 'За откладыванием стоит перфекционизм: пока не начал — не провалился. Работать нужно не с расписанием, а с планкой.'
