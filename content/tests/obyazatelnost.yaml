slug: obyazatelnost
version: 1.0.0
title: Тест на обязательность
seoTitle: Тест на обязательность онлайн — бесплатно, 10 вопросов
description: >-
  Онлайн-тест на обязательность по шкале IPIP: 10 утверждений о том, как вы держите слово и относитесь к правилам. Около
  3 минут, ответы — ваша самооценка.
category: personality
ctaCluster: self
minutes: 3
passport:
  measures: Шкала измеряет, насколько человек держит слово, соблюдает договорённости и следует правилам.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт
    «обязательность». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.71 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: обязательность
    high: держите слово и следуете договорённостям
    low: относитесь к правилам и обещаниям гибко
    bands:
      - from: 0
        label: низкая
        text: >-
          Правила для вас скорее ориентир, чем закон, а обещания даются легче, чем выполняются. Такая гибкость выручает
          там, где инструкции устарели, а действовать нужно по ситуации. Цена — люди могут перестать закладывать вас в
          свои планы, и вслух об этом говорят редко.
      - from: 40
        label: средняя
        text: >-
          Вы обычно делаете то, о чём договорились, но не превращаете каждое слово в клятву. Если что-то не выходит,
          чаще предупреждаете заранее. Правила соблюдаете, пока видите в них смысл, и это довольно устойчивая позиция.
      - from: 70
        label: высокая
        text: >-
          На ваше слово можно опереться: сказали — сделали, и договорённости для вас имеют вес. Такому человеку доверяют
          важное, и это заслуженно. Обратная сторона — трудно выйти из обещания, которое давно потеряло смысл, и легко
          нагрузиться чужими обязанностями.
questions:
  - id: q1
    text: Стараюсь соблюдать правила.
    scales:
      - scale: total
  - id: q2
    text: Держу обещания.
    scales:
      - scale: total
  - id: q3
    text: Оплачиваю счета вовремя.
    scales:
      - scale: total
  - id: q4
    text: Говорю правду.
    scales:
      - scale: total
  - id: q5
    text: Прислушиваюсь к своей совести.
    scales:
      - scale: total
  - id: q6
    text: Нарушаю правила.
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Не выполняю обещанного.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Перекладываю свои обязанности на других.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Делаю наперекор тому, о чём просят.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Искажаю факты в свою пользу.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Прежде чем сказать «да», назовите срок вслух. Если срок не находится, значит это не обещание, а вежливость, — так и
    сформулируйте.
  - >-
    Отменять договорённость нормально, если сделать это заранее и один раз. Раннее «не смогу» обходится намного дешевле
    позднего молчания.
  - >-
    Раз в квартал пересматривайте взятые обязательства и вычёркивайте те, что держатся только на инерции. Верность
    отжившей договорённости — это не то же самое, что надёжность.
