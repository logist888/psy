slug: sentimentalnost
version: 1.0.0
title: Тест на сентиментальность
seoTitle: Тест на сентиментальность онлайн — бесплатно, 10 вопросов
description: >-
  Легко ли вас растрогать и сильно ли вы отзываетесь на чужие переживания? Самоотчётная шкала из 10 вопросов о душевной
  мягкости и слезливости.
category: personality
ctaCluster: self
minutes: 3
passport:
  measures: Шкала показывает, насколько легко вас трогают фильмы, истории и чужие чувства и насколько открыто вы это проявляете.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт
    «сентиментальность и эмоциональная отзывчивость». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.80 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: сентиментальность и эмоциональная отзывчивость
    high: мягкость, отзывчивость, лёгкость слёз
    low: эмоциональная сдержанность и ровность
    bands:
      - from: 0
        label: низкая сентиментальность
        text: >-
          Трогательные сцены и чужие драмы оставляют вас довольно спокойным. Вы редко плачете и не склонны показывать
          чувства без веской причины. В кризисе рядом с вами обычно спокойнее, чем рядом с теми, кого захлёстывает.
      - from: 40
        label: умеренная сентиментальность
        text: >-
          Вас можно растрогать, но вы не растворяетесь в чужих переживаниях. Сочувствуете и при этом сохраняете ясную
          голову. Такой режим удобен и для близких, и для вас самих.
      - from: 70
        label: высокая сентиментальность
        text: >-
          Вы легко растрогаетесь — от фильма, песни или чужой беды — и переживаете чужое почти как своё. Люди чувствуют
          вашу теплоту и идут к вам за поддержкой. Плата за это — усталость от чужих историй, если их много подряд.
questions:
  - id: q1
    text: Имею мягкое сердце.
    scales:
      - scale: total
  - id: q2
    text: Плачу на фильмах.
    scales:
      - scale: total
  - id: q3
    text: Переживаю чужие несчастья как свои.
    scales:
      - scale: total
  - id: q4
    text: Плачу легко.
    scales:
      - scale: total
  - id: q5
    text: Растрогаюсь до слёз от любой мелочи.
    scales:
      - scale: total
  - id: q6
    text: Сочувствую чужим переживаниям.
    scales:
      - scale: total
  - id: q7
    text: Страдаю от чужого горя.
    scales:
      - scale: total
  - id: q8
    text: Остаюсь равнодушным к чувствам других.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Не бываю мягким.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Проявляю эмоции редко.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Отделяйте сочувствие от слияния вопросом «чьё это чувство сейчас». Помогать проще из позиции рядом, чем изнутри
    чужого горя.
  - >-
    Если новости и чужие драмы выбивают надолго, дозируйте не эмоции, а вход: время в лентах, число тяжёлых разговоров
    за день.
  - >-
    Сдержанность — не чёрствость. Если чувства проявляются скупо, заменяйте их словами и действиями: близким важно
    услышать и увидеть, а не угадать.
