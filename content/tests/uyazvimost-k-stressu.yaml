slug: uyazvimost-k-stressu
version: 1.0.0
title: Тест на уязвимость к стрессу
seoTitle: Тест на уязвимость к стрессу — бесплатно, 10 вопросов
description: >-
  Шкала уязвимости к стрессу IPIP: 10 утверждений о панике, перегрузке и способности собраться под давлением. Занимает
  2–3 минуты, результат — сразу.
category: wellbeing
ctaCluster: anxiety
minutes: 3
passport:
  measures: Насколько легко давление и стресс выбивают вас из строя и как быстро вы восстанавливаетесь.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт «Уязвимость к
    стрессу». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.82 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: Уязвимость к стрессу
    high: в стрессе теряетесь, накрывает паникой
    low: под давлением собираетесь и действуете
    bands:
      - from: 0
        label: низкая
        text: >-
          Под давлением вы собираетесь, а не рассыпаетесь: решения принимаются, эмоции не перехватывают руль. Неудачи
          выбивают ненадолго. Единственный риск — не заметить, что ресурс всё-таки заканчивается.
      - from: 40
        label: средняя
        text: >-
          В обычном темпе вы справляетесь, но когда всё наваливается разом, приходит перегруз и решения даются труднее.
          После передышки способность действовать возвращается. Так реагирует большинство людей.
      - from: 70
        label: высокая
        text: >-
          В стрессе легко накрывает паникой, мысли путаются, а выбор даётся тяжело. Это состояние сильно зависит от сна,
          нагрузки и наличия поддержки — то есть оно подвижно. Навыки совладания тренируются, а высокая чувствительность
          к стрессу часто соседствует с хорошей чуткостью к людям.
questions:
  - id: q1
    text: Легко впадаю в панику.
    scales:
      - scale: total
  - id: q2
    text: Теряюсь, когда всё наваливается разом.
    scales:
      - scale: total
  - id: q3
    text: Чувствую, что не справляюсь с тем, что происходит.
    scales:
      - scale: total
  - id: q4
    text: Не могу принять решение.
    scales:
      - scale: total
  - id: q5
    text: Тону в собственных эмоциях.
    scales:
      - scale: total
  - id: q6
    text: Сохраняю спокойствие, когда на меня давят.
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Справляюсь со сложными задачами.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Знаю, как справляться с трудностями.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Быстро прихожу в себя после неудач.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Держусь спокойно даже в самой напряжённой обстановке.
    scales:
      - scale: total
        reverse: true
crisis:
  - question: q3
    minValue: 4
  - question: q5
    minValue: 4
selfHelp:
  - >-
    В момент перегруза сузьте горизонт до одного действия на ближайшие десять минут и произнесите его вслух. Паника
    питается масштабом, а не сложностью.
  - >-
    Заранее составьте список опор: три человека, кому можно написать, и три вещи, которые вас стабилизируют. В стрессе
    придумать это невозможно, а прочитать готовое — легко.
  - >-
    Если ощущение «не справляюсь» стало фоном и мешает работать или спать, стоит обсудить это с психологом: навыки
    совладания со стрессом осваиваются довольно быстро.
