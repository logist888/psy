slug: zhizneradostnost
version: 1.0.0
title: Тест на жизнерадостность
seoTitle: Тест на жизнерадостность онлайн — бесплатно, 10 вопросов
description: >-
  Шкала IPIP из 10 утверждений о том, насколько легко вам радоваться, смеяться и делиться настроением с другими.
  Занимает около 2 минут.
category: personality
ctaCluster: self
minutes: 3
passport:
  measures: Насколько часто человек переживает радость, смеётся и заражает хорошим настроением окружающих.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт
    «жизнерадостность». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.81 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: жизнерадостность
    high: легко радуется и заражает настроением других
    low: сдержан в проявлении радости
    bands:
      - from: 0
        label: сдержанная
        text: >-
          Вы не склонны бурно выражать радость и редко смеётесь по мелочам — это не значит, что вам плохо, просто
          эмоциональный фон у вас ровнее. Такой стиль читается как серьёзность и надёжность, но окружающим бывает трудно
          понять, довольны вы или нет. Помогает просто проговаривать вслух то, что вам понравилось.
      - from: 40
        label: умеренная
        text: >-
          Вы умеете радоваться и шутить, но не держите это фоном постоянно. Настроение скорее следует за
          обстоятельствами, чем задаёт их. Вариант гибкий: вы уместны и на празднике, и в тяжёлом разговоре.
      - from: 70
        label: высокая
        text: >-
          Радость у вас включается быстро и заметна другим — рядом с вами легче. Обратная сторона: привычка держать
          лёгкий тон мешает вам самим признавать усталость и грусть, а близким — приходить к вам с тяжёлым. Иногда стоит
          разрешать себе не быть в хорошем настроении.
questions:
  - id: q1
    text: Излучаю радость.
    scales:
      - scale: total
  - id: q2
    text: Много веселюсь.
    scales:
      - scale: total
  - id: q3
    text: Радуюсь по-детски открыто.
    scales:
      - scale: total
  - id: q4
    text: Иду по жизни со смехом.
    scales:
      - scale: total
  - id: q5
    text: Люблю жизнь.
    scales:
      - scale: total
  - id: q6
    text: Смотрю на светлую сторону жизни.
    scales:
      - scale: total
  - id: q7
    text: Смеюсь громко, в голос.
    scales:
      - scale: total
  - id: q8
    text: Умею развеселить друзей.
    scales:
      - scale: total
  - id: q9
    text: Редко нахожу что-то смешным.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Редко шучу и дурачусь.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Записывайте перед сном три конкретных приятных момента дня — именно конкретных («кофе на балконе в 8:40»), общие
    формулировки почти не работают.
  - >-
    Если радость даётся тяжело, начните с тела: дневной свет, сон и 20 минут быстрой ходьбы меняют фон настроения
    сильнее, чем попытки настроиться усилием воли.
  - >-
    Прежде чем подбодрить человека, спросите: «тебе сейчас нужна поддержка или решение?» — бодрый тон в неподходящий
    момент закрывает разговор.
