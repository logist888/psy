slug: ekstraversiya
version: 1.0.0
title: Тест на экстраверсию
seoTitle: Тест на экстраверсию онлайн — бесплатно, 20 вопросов
description: >-
  20 утверждений о том, как вы чувствуете себя среди людей и легко ли начинаете разговор. Занимает около 5 минут. Это
  самоотчёт для размышления, а не диагностика.
category: personality
ctaCluster: self
minutes: 5
passport:
  measures: Шкала показывает, насколько вас тянет к людям и насколько свободно вы чувствуете себя в общении.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт
    «экстраверсия». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.91 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: экстраверсия
    high: общительность, лёгкость в контакте, тяга к людям
    low: сдержанность, узкий круг общения, потребность в тишине
    bands:
      - from: 0
        label: низкая
        text: >-
          Судя по ответам, вы предпочитаете небольшой круг общения и чаще слушаете, чем говорите. Обычно это даёт умение
          сосредоточиться, замечать в разговоре детали и общаться по-настоящему близко с немногими людьми. Цена —
          знакомства завязываются медленнее, а в шумной компании вы устаёте раньше других. Иногда сдержанность принимают
          за холодность, хотя дело совсем в другом. Если это мешает, помогает не «становиться общительнее», а заранее
          выбирать формат встреч, который вам по силам.
      - from: 40
        label: средняя
        text: >-
          Резкого перекоса нет: вам бывает хорошо и в компании, и наедине с собой. Обычно такие люди легко переключаются
          между режимами — могут поддержать общий разговор, а могут спокойно провести вечер в тишине. Обратная сторона —
          в очень шумной среде вы можете чувствовать себя менее заметным, чем яркие собеседники, а в долгом одиночестве
          начинаете скучать по людям. Полезно замечать, что именно вас наполняет, а что опустошает, и планировать неделю
          с учётом этого.
      - from: 70
        label: высокая
        text: >-
          Ответы говорят о том, что общение вас скорее заряжает: вы легко начинаете разговор, свободно чувствуете себя в
          новой компании и умеете поднять другим настроение. Это помогает быстро заводить связи, договариваться и вести
          за собой в неформальных ситуациях. Цена — соблазн заполнить общением всё время, усталость от собственной
          активности и риск не заметить, что кому-то рядом сейчас нужна тишина. Решения при этом иногда принимаются
          вслух и слишком быстро. Стоит оставлять в расписании часы без людей — не как наказание, а как способ
          восстановиться.
questions:
  - id: q1
    text: В компании людей чувствую себя спокойно
    scales:
      - scale: total
  - id: q2
    text: Легко завожу друзей
    scales:
      - scale: total
  - id: q3
    text: Хорошо ориентируюсь в общении с людьми
    scales:
      - scale: total
  - id: q4
    text: В компании я — душа вечеринки
    scales:
      - scale: total
  - id: q5
    text: Умею увлечь людей
    scales:
      - scale: total
  - id: q6
    text: Первым начинаю разговор
    scales:
      - scale: total
  - id: q7
    text: Быстро сближаюсь с новыми людьми
    scales:
      - scale: total
  - id: q8
    text: На вечеринках общаюсь со многими разными людьми
    scales:
      - scale: total
  - id: q9
    text: Не против оказаться в центре внимания
    scales:
      - scale: total
  - id: q10
    text: Поднимаю людям настроение
    scales:
      - scale: total
  - id: q11
    text: Мне обычно нечего сказать
    scales:
      - scale: total
        reverse: true
  - id: q12
    text: Держусь в стороне
    scales:
      - scale: total
        reverse: true
  - id: q13
    text: Моя жизнь кажется мне довольно скучной
    scales:
      - scale: total
        reverse: true
  - id: q14
    text: Не люблю привлекать к себе внимание
    scales:
      - scale: total
        reverse: true
  - id: q15
    text: Мало говорю
    scales:
      - scale: total
        reverse: true
  - id: q16
    text: Избегаю общения с людьми
    scales:
      - scale: total
        reverse: true
  - id: q17
    text: Со мной трудно сблизиться
    scales:
      - scale: total
        reverse: true
  - id: q18
    text: Отдаляюсь от людей
    scales:
      - scale: total
        reverse: true
  - id: q19
    text: Мне трудно первым подойти к человеку
    scales:
      - scale: total
        reverse: true
  - id: q20
    text: Держу людей на расстоянии
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Напишите на этой неделе одному человеку, с которым давно не общались: короткое сообщение и предложение созвониться
    на 15 минут.
  - >-
    Перед встречей или мероприятием заготовьте два вопроса, которые можно задать любому собеседнику, — так проще не
    зависнуть на первой минуте.
  - >-
    Неделю отмечайте в заметках, после каких встреч был подъём, а после каких — усталость; в конце недели уберите из
    планов одно событие из второго списка.
