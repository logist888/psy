slug: socialnaya-trevozhnost
version: 1.0.0
title: Тест на социальную тревожность
seoTitle: Тест на социальную тревожность онлайн — бесплатно, 10 вопросов
description: >-
  Показывает, насколько напряжённо вы чувствуете себя среди малознакомых людей и легко ли делаете первый шаг. 10
  вопросов, около 3 минут. Это самоотчёт, а не диагностика.
category: personality
ctaCluster: self
minutes: 3
passport:
  measures: Шкала показывает, насколько сильное напряжение вы испытываете рядом с малознакомыми людьми и в новых ситуациях.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт «социальная
    тревожность». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.86 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: социальная тревожность
    high: напряжение и скованность среди малознакомых людей
    low: спокойствие в новых компаниях, лёгкий первый шаг
    bands:
      - from: 0
        label: низкая
        text: >-
          Незнакомые компании вас почти не напрягают: заговорить первым, спросить дорогу, влиться в разговор — обычное
          бытовое дело. Вы осваиваетесь там, где другие ещё присматриваются. Обратная сторона — можно не заметить, что
          кому-то рядом неуютно, и не оставить паузу для тех, кто входит в разговор медленнее.
      - from: 40
        label: средняя
        text: >-
          Многое зависит от обстановки: с понятными людьми вы легки, в новой компании сначала осматриваетесь. Первые
          минуты бывают напряжёнными, дальше становится проще. Такой режим экономит силы, но иногда вы пропускаете
          момент, когда стоило подойти и заговорить.
      - from: 70
        label: высокая
        text: >-
          Рядом с малознакомыми людьми вы напрягаетесь: тянет замолчать, отойти, отложить звонок. Зато с близкими вы
          разговорчивы и хорошо считываете чужое настроение — напряжение делает внимательным к деталям. Цена в том, что
          круг общения сужается сам собой; если это заметно мешает работе и отношениям, есть смысл обсудить это со
          специалистом.
questions:
  - id: q1
    text: Часто чувствую себя неуютно среди людей.
    scales:
      - scale: total
  - id: q2
    text: Стесняюсь подойти к незнакомым людям.
    scales:
      - scale: total
  - id: q3
    text: Расслабляюсь только в компании друзей.
    scales:
      - scale: total
  - id: q4
    text: Молчу рядом с незнакомыми людьми.
    scales:
      - scale: total
  - id: q5
    text: Тревожусь перед новыми знакомствами.
    scales:
      - scale: total
  - id: q6
    text: Чувствую себя среди людей легко.
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Общаюсь на вечеринках с самыми разными людьми.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Не теряюсь в трудных ситуациях общения.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Веду себя с людьми непринуждённо.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Чувствую себя уверенно в незнакомой обстановке.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Перед встречей заготовьте два вопроса, которые вам самому интересно задать: в роли спрашивающего напряжения меньше,
    чем в роли оцениваемого.
  - Приходите на 10 минут раньше остальных — войти в пустую комнату проще, чем в уже сложившийся круг людей.
  - >-
    Записывайте после события не «как я выглядел», а факты: кто заговорил сам, кто улыбнулся. Память склонна
    переписывать такие эпизоды в худшую сторону, записи возвращают пропорции.
