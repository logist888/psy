slug: terpimost
version: 1.0.0
title: Тест на терпимость к другим людям
seoTitle: Тест на терпимость онлайн — бесплатно, 12 вопросов
description: >-
  Тест из 12 утверждений о том, насколько легко вы принимаете людей с другими взглядами и привычками и как реагируете на
  чужие ошибки и промахи.
category: personality
ctaCluster: self
minutes: 3
passport:
  measures: Шкала оценивает, насколько спокойно человек относится к людям, которые думают и живут иначе.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт «терпимость».
    Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.72 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: терпимость
    high: принимаете различия и редко судите людей
    low: остро реагируете на чужие промахи и легко раздражаетесь
    bands:
      - from: 0
        label: невысокая терпимость
        text: >-
          Вы быстро замечаете чужие промахи и не скрываете, когда что-то вам не нравится. Такая прямота помогает держать
          границы и не терпеть то, что вас действительно не устраивает. Обратная сторона — люди с другим укладом могут
          показаться вам странными раньше, чем вы успеете их узнать.
      - from: 40
        label: средняя терпимость
        text: >-
          Многое вы принимаете спокойно, но в отдельных темах у вас есть чёткая позиция, и уступать вы не готовы.
          Терпение чаще зависит от усталости и от того, насколько вам близок человек. В спорных ситуациях вы способны и
          услышать другого, и настоять на своём.
      - from: 70
        label: высокая терпимость
        text: >-
          Вам легко даётся мысль, что у каждого своя правда, и чужие странности редко выводят вас из себя. Люди обычно
          чувствуют себя рядом с вами свободно и рассказывают больше, чем другим. Стоит следить, чтобы принятие не
          превращалось в согласие с тем, что неудобно вам самим.
questions:
  - id: q1
    text: Принимаю людей такими, какие они есть.
    scales:
      - scale: total
  - id: q2
    text: Уважаю других людей.
    scales:
      - scale: total
  - id: q3
    text: Сочувствую бездомным.
    scales:
      - scale: total
  - id: q4
    text: Считаю, что у большинства вопросов есть много сторон.
    scales:
      - scale: total
  - id: q5
    text: Верю, что у людей хорошие намерения.
    scales:
      - scale: total
  - id: q6
    text: Могу многое стерпеть от других.
    scales:
      - scale: total
  - id: q7
    text: Не умею проигрывать.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Раздражаюсь по любому поводу.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Указываю другим, как им жить.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Отношусь к людям свысока.
    scales:
      - scale: total
        reverse: true
  - id: q11
    text: Сужу о людях слишком быстро.
    scales:
      - scale: total
        reverse: true
  - id: q12
    text: Злюсь на чужие ошибки.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Когда чужой поступок злит, назовите про себя три причины, по которым нормальный человек мог так поступить, —
    раздражение обычно спадает уже на второй.
  - >-
    Отделяйте терпимость к человеку от согласия с его действиями: можно спокойно сказать «мне так не подходит» и не
    переходить к оценке личности.
  - >-
    Заметьте, в какие часы вы придираетесь чаще: у большинства нетерпимость растёт при недосыпе и голоде, и такие
    разговоры лучше переносить.
