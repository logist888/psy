slug: trevozhnost
version: 1.0.0
title: Тест на тревожность
seoTitle: Тест на тревожность онлайн — бесплатно, 10 вопросов
description: >-
  Шкала тревожности IPIP: 10 утверждений о беспокойстве, напряжении и ожидании плохого. Занимает 2–3 минуты, результат с
  расшифровкой — сразу после прохождения.
category: personality
ctaCluster: self
minutes: 3
passport:
  measures: Насколько часто вы испытываете беспокойство, внутреннее напряжение и ожидание, что случится плохое.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт «Тревожность».
    Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.83 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: Тревожность
    high: часто тревожитесь и ждёте плохого
    low: редко волнуетесь и быстро успокаиваетесь
    bands:
      - from: 0
        label: низкая
        text: >-
          Вы редко тревожитесь: неопределённость и неприятные новости выбивают вас ненадолго. Обычно вы засыпаете без
          прокручивания разговоров в голове и спокойно относитесь к тому, что уже произошло. Обратная сторона — можно
          недооценить реальный риск, потому что тревога не подаёт сигнал.
      - from: 40
        label: средняя
        text: >-
          Тревога появляется в понятных ситуациях — перед важным разговором, дедлайном, поездкой — и уходит, когда всё
          решается. Иногда мысли крутятся дольше, чем хотелось бы, но это не мешает жить обычной жизнью. Такой уровень
          встречается чаще всего.
      - from: 70
        label: высокая
        text: >-
          Вы часто прокручиваете плохие сценарии, а тело держится в напряжении даже без явного повода. Это не диагноз и
          не свойство характера навсегда: уровень тревоги заметно меняется, когда налаживается сон и появляются навыки
          работы с ней. Многие люди с похожими результатами живут насыщенно — просто им нужно больше опор.
questions:
  - id: q1
    text: Беспокоюсь по разным поводам.
    scales:
      - scale: total
  - id: q2
    text: Боюсь, что случится худшее.
    scales:
      - scale: total
  - id: q3
    text: Боюсь многих вещей.
    scales:
      - scale: total
  - id: q4
    text: Легко впадаю в стресс.
    scales:
      - scale: total
  - id: q5
    text: Зацикливаюсь на своих проблемах.
    scales:
      - scale: total
  - id: q6
    text: Сохраняю спокойствие, что бы ни происходило.
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Чувствую себя расслабленно бóльшую часть времени.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Не выбиваюсь из колеи из-за происходящего вокруг.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Не переживаю о том, что уже случилось.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Приспосабливаюсь к новому без труда.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Заведите время для тревоги: 15 минут в день, когда вы выписываете все беспокойства на бумагу. В остальное время,
    когда мысль возвращается, помечайте её и откладывайте до этого окна.
  - >-
    Делите тревоги на две колонки: «могу повлиять» и «не могу». Для первой пишите один конкретный шаг на ближайшие
    сутки, вторую перечитывайте вслух — произнесённое вслух пугает меньше, чем прокрученное в голове.
  - >-
    Если тревога держится большую часть дней несколько недель подряд, мешает спать, работать или общаться — стоит
    обсудить это с психологом или врачом. Это не про слабость: с таким состоянием эффективно работают.
