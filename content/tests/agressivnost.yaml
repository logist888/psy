slug: agressivnost
version: 1.0.0
title: Тест на агрессивность
seoTitle: Тест на агрессивность онлайн — бесплатно, 10 вопросов
description: >-
  Держите ли вы обиду и отвечаете ли резкостью на резкость? Самоотчётная шкала из 10 вопросов об обычной житейской
  агрессивности — без диагнозов и оценок.
category: personality
ctaCluster: self
minutes: 3
passport:
  measures: Шкала показывает, насколько вы склонны отвечать на задевающее резкостью, помнить обиды и добиваться своего напором.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт «агрессивность
    как черта характера». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.77 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: агрессивность
    high: напор, резкость, память на обиды
    low: миролюбие, лёгкость прощения
    bands:
      - from: 0
        label: низкая агрессивность
        text: >-
          Вы редко злитесь, легко отпускаете обиды и почти не отвечаете резкостью. Конфликт вы предпочитаете погасить, а
          не выиграть. Стоит проверять, не остаётся ли при этом невысказанным то, что вам действительно важно.
      - from: 40
        label: умеренная агрессивность
        text: >-
          Задеть вас можно, и тогда вы отвечаете, но без долгого счёта обид. Свои границы обозначаете, а мириться
          умеете. Это обычный для большинства людей диапазон.
      - from: 70
        label: заметная агрессивность
        text: >-
          Вы отвечаете на выпад быстро и по существу, помните, кто как поступил, и умеете держать напор в споре. Такая
          прямота помогает отстаивать своё и не даёт ездить на себе. Полезно следить, чтобы острое слово не било
          сильнее, чем вы задумывали.
questions:
  - id: q1
    text: Отвечаю обидчику тем же.
    scales:
      - scale: total
  - id: q2
    text: Держу обиду.
    scales:
      - scale: total
  - id: q3
    text: Поступаю из мести.
    scales:
      - scale: total
  - id: q4
    text: Жульничаю, чтобы добиться своего.
    scales:
      - scale: total
  - id: q5
    text: Бываю резок на язык.
    scales:
      - scale: total
  - id: q6
    text: Не возьму чужого.
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Злюсь нечасто.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Стараюсь прощать и забывать.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Раздражаюсь редко.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Жалуюсь редко.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    В момент злости отделяйте требование от оценки человека: «сделай так» вместо «ты всегда». Требование обсуждают,
    оценку запоминают надолго.
  - >-
    Обиды удобно разбирать списком: что произошло, что я хочу дальше, что от этого зависит. Пункты без ответа на второй
    вопрос обычно можно отпускать.
  - >-
    Если резкость проявляется редко, тренируйте её в мелочах — вернуть остывшее блюдо, попросить перезвонить. Умение
    возражать по пустякам страхует в крупном.
