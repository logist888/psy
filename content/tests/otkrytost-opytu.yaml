slug: otkrytost-opytu
version: 1.0.0
title: Тест на открытость опыту
seoTitle: Тест на открытость опыту онлайн — бесплатно, 20 вопросов
description: >-
  Шкала открытости опыту: 20 утверждений, около 5 минут. Показывает, насколько вас тянет к новым идеям, искусству и
  размышлениям и насколько важна опора на проверенное. Это самоотчёт, а не диагностика.
category: personality
ctaCluster: self
minutes: 5
passport:
  measures: >-
    Шкала показывает, насколько вас притягивают новые идеи, искусство, язык и непривычный опыт — в отличие от опоры на
    конкретное и проверенное.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт «открытость
    опыту». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.89 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: открытость опыту
    high: интерес к идеям, искусству и непривычному
    low: опора на конкретное, практичное и проверенное
    bands:
      - from: 0
        label: низкая
        text: >-
          Ответы говорят о практичном складе: отвлечённые разговоры и поиск скрытых смыслов вас не увлекают, а ценность
          вещи вы оцениваете по тому, работает она или нет. Сильная сторона — вы не тратите время на красивые, но пустые
          идеи и уверенно держитесь решений, которые уже давали результат. Цена — новое иногда отсеивается раньше, чем
          вы успели его рассмотреть, и часть возможностей проходит мимо. В компании, где любят порассуждать, вам бывает
          скучно, а им кажется, что вы закрыты. Помогает простое правило: прежде чем отказаться от непривычного,
          попробовать его один раз.
      - from: 40
        label: средняя
        text: >-
          Картина смешанная: новое вас увлекает, но не всё подряд, и вы не пойдёте за идеей только потому, что она
          необычная. Обычно это удобная позиция — вам понятны и люди, которые любят теоретизировать, и те, кому нужен
          конкретный результат. Слабое место середины в том, что интерес легко откладывается: «потом почитаю»,
          «как-нибудь схожу». Стоит посмотреть, в каких областях вы открыты по-настоящему — часто это одна-две темы, а
          остальное вас просто не касается. Там, где интерес живой, его есть смысл кормить.
      - from: 70
        label: высокая
        text: >-
          Ответы говорят о выраженном интересе к идеям, языку, искусству и необычному опыту: вам нравится думать,
          спорить, воображать и находить в вещах второй слой. Это питает творчество и помогает быстро схватывать
          незнакомое. Цена — распыление: идей набирается больше, чем доведённых до конца дел, а рутина, на которой всё
          держится, кажется скучной. Иногда собеседникам с вами тяжело: разговор уходит на высоту, где им нечем дышать.
          Полезно из десяти интересных замыслов выбирать один и доводить его до конца.
questions:
  - id: q1
    text: Считаю, что искусство важно.
    scales:
      - scale: total
  - id: q2
    text: У меня живое воображение.
    scales:
      - scale: total
  - id: q3
    text: Чаще голосую за кандидатов либеральных взглядов.
    scales:
      - scale: total
  - id: q4
    text: Умею вывести разговор на более глубокий уровень.
    scales:
      - scale: total
  - id: q5
    text: Люблю слушать новые идеи.
    scales:
      - scale: total
  - id: q6
    text: Люблю размышлять.
    scales:
      - scale: total
  - id: q7
    text: Умею красиво выразить мысль.
    scales:
      - scale: total
  - id: q8
    text: Люблю дать волю фантазии.
    scales:
      - scale: total
  - id: q9
    text: Загораюсь от новых идей.
    scales:
      - scale: total
  - id: q10
    text: У меня богатый словарный запас.
    scales:
      - scale: total
  - id: q11
    text: Абстрактные идеи мне неинтересны.
    scales:
      - scale: total
        reverse: true
  - id: q12
    text: Не люблю искусство.
    scales:
      - scale: total
        reverse: true
  - id: q13
    text: Избегаю разговоров о философии.
    scales:
      - scale: total
        reverse: true
  - id: q14
    text: Не получаю удовольствия от походов в художественные музеи.
    scales:
      - scale: total
        reverse: true
  - id: q15
    text: Чаще голосую за кандидатов консервативных взглядов.
    scales:
      - scale: total
        reverse: true
  - id: q16
    text: Не люблю стихи.
    scales:
      - scale: total
        reverse: true
  - id: q17
    text: Редко ищу в вещах глубокий смысл.
    scales:
      - scale: total
        reverse: true
  - id: q18
    text: Считаю, что на поддержку художников уходит слишком много бюджетных денег.
    scales:
      - scale: total
        reverse: true
  - id: q19
    text: Мне неинтересны теоретические споры.
    scales:
      - scale: total
        reverse: true
  - id: q20
    text: С трудом понимаю абстрактные идеи.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Выберите на этой неделе один формат, мимо которого обычно проходите: незнакомый жанр музыки, документальный фильм,
    выставка рядом с домом. Одного раза хватит, чтобы понять, ваше это или нет.
  - >-
    Из всех идей, которые придут за неделю, отметьте одну и сделайте по ней первый маленький шаг: набросать план,
    написать страницу, позвонить нужному человеку. Идея становится опытом только на этом шаге.
  - >-
    Поговорите с человеком, чьи взгляды на что-то важное не совпадают с вашими, и поставьте задачей не переспорить, а
    понять, из чего сложилась его позиция.
