slug: dobrozhelatelnost
version: 1.0.0
title: Тест на доброжелательность
seoTitle: Тест на доброжелательность онлайн — бесплатно, 20 вопросов
description: >-
  20 утверждений о том, как вы относитесь к людям: доверяете ли, прощаете ли, готовы ли уступить. Занимает около 5
  минут. Это самоотчёт, а не диагностика.
category: personality
ctaCluster: self
minutes: 5
passport:
  measures: >-
    Шкала показывает, насколько вы склонны доверять людям, идти навстречу и сглаживать острые углы, а не спорить и
    держать дистанцию.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт
    «доброжелательность». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.85 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: доброжелательность
    high: доверие, уступчивость, мягкость в общении
    low: прямота, настороженность, готовность спорить
    bands:
      - from: 0
        label: низкая
        text: >-
          По ответам вы скорее прямолинейны и не спешите верить людям на слово. Сильная сторона — вы говорите то, что
          думаете, замечаете чужую игру и умеете отстоять свои интересы там, где другие уступают. Цена — резкость легко
          ранит, а постоянная настороженность утомляет и мешает сближаться. Люди могут держаться на дистанции, даже
          когда по сути вы правы. Часто помогает не смягчать позицию, а менять форму: то же самое, сказанное без укола,
          слышат гораздо лучше.
      - from: 40
        label: средняя
        text: >-
          Вы сочетаете доброжелательность с трезвостью: обычно готовы пойти навстречу, но не всякому и не всегда. Такой
          баланс позволяет и сохранять отношения, и не соглашаться с тем, что вам не подходит. Обратная сторона — иногда
          трудно понять, где сейчас уступить, а где настоять, и выбор даётся с колебанием. Полезно заранее знать свои
          несколько «нельзя» — тогда в спорной ситуации не придётся решать всё с нуля.
      - from: 70
        label: высокая
        text: >-
          Ответы говорят о заметной мягкости и доверии к людям: вы склонны видеть в них хорошее, сочувствовать и
          сглаживать конфликты. Рядом с вами спокойно, с вами легко договориться, и напряжение в компании часто гаснет
          само. Цена — свои интересы регулярно оказываются в конце очереди, а недовольство копится и не проговаривается.
          Есть и риск поверить тому, кто этого не заслуживает. Стоит потренироваться говорить «мне это не подходит» без
          длинных объяснений — доброжелательность от этого никуда не денется.
