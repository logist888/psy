crisis: []
selfHelp:
  - >-
    Один раз за неделю скажите «мне это не подходит» без объяснений и извинений — начните с мелочи вроде выбора кафе или
    времени созвона.
  - >-
    Если держите на кого-то обиду дольше недели, сформулируйте её в одном предложении и решите: сказать вслух или
    отпустить, но не оставлять как есть.
  - >-
    В ближайшем споре сначала перескажите своими словами позицию собеседника и только потом возражайте — это меняет тон
    разговора сильнее, чем аргументы.
