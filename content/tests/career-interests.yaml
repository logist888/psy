crisis: []
selfHelp:
- 'Смотрите на две-три верхние шкалы вместе, а не на одну. Интересные профессии обычно живут на стыке: например, «исследовательский
  плюс социальный» — это преподавание и клиническая работа, а «исследовательский плюс организованный» — аналитика.'
- 'Проверьте гипотезу до того, как менять жизнь. Поговорите с двумя-тремя людьми из интересующей сферы о том, как выглядит
  их обычная неделя: интерес к предмету и интерес к ежедневной работе — разные вещи.'
- Не путайте интерес со способностью и с деньгами. Тест говорит только о притяжении; проверить остальное можно лишь опытом
  и разговором с теми, кто уже внутри профессии.
