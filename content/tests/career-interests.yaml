slug: career-interests
version: 1.0.0
title: 'Тест на профориентацию: профиль интересов'
seoTitle: Тест на профориентацию онлайн — какая профессия подходит
description: 'Шесть типов профессиональных интересов по модели Холланда: к чему вас тянет — к вещам, данным, людям, идеям,
  влиянию или порядку. 24 утверждения, около 5 минут.'
category: career
ctaCluster: career
minutes: 5
passport:
  measures: 'Профиль профессиональных интересов по шести типам модели Холланда (RIASEC): реалистичный, исследовательский,
    артистичный, социальный, предприимчивый и конвенциональный.'
  origin: Собственная реализация модели RIASEC для этого проекта, по смыслу близкая к открытому инструменту O*NET Interest
    Profiler Министерства труда США. Пункты сформулированы заново на русском.
  rightsBasis: own_work
  rightsNote: Формулировки принадлежат проекту. Модель RIASEC как научная концепция не охраняется; проприетарный опросник
    Self-Directed Search издательства PAR не использовался.
  reliability: 'Опросник новый и независимой проверки не проходил. Сама модель RIASEC подтверждена десятилетиями исследований,
    а интересы — относительно устойчивая характеристика: они меняются медленнее, чем настроение или самооценка.'
  limitations: Интересы — это про «что нравится», а не про «что получится». Тест не измеряет способности, не учитывает рынок
    труда, зарплаты и ваши обстоятельства. Он не выдаёт готовый ответ «кем работать», а сужает поле поиска.
instruction: Оценивайте, насколько вам нравится такая деятельность, независимо от того, умеете вы это или нет и сколько за
  это платят.
options:
- text: Совсем не нравится
  value: 0
- text: Скорее не нравится
  value: 1
- text: Скорее нравится
  value: 2
- text: Очень нравится
  value: 3
scales:
- id: r
  name: Практический (Realistic)
  high: работа руками, техника, движение
  low: интерес к другому
  bands:
  - from: 0
    label: низкий
    text: Работа с техникой и физический труд вас не привлекают.
  - from: 40
    label: средний
    text: Практическая работа вам подходит, но не как единственное занятие.
  - from: 65
    label: высокий
    text: 'Вас тянет к осязаемому результату: техника, инструменты, ремонт, работа на воздухе, спорт.'
- id: i
  name: Исследовательский (Investigative)
  high: анализ, наука, разбирательство в сложном
  low: интерес к другому
  bands:
  - from: 0
    label: низкий
    text: Долгий анализ и исследовательская работа вас не увлекают.
  - from: 40
    label: средний
    text: Вам интересно разбираться, когда есть практический смысл.
  - from: 65
    label: высокий
    text: 'Вам нравится докапываться до сути: данные, закономерности, гипотезы, сложные задачи без готового ответа.'
- id: a
  name: Творческий (Artistic)
  high: создание нового, самовыражение
  low: интерес к другому
  bands:
  - from: 0
    label: низкий
    text: Свободное творчество вас привлекает мало.
  - from: 40
    label: средний
    text: Творческие задачи вам интересны в умеренном объёме.
  - from: 65
    label: высокий
    text: Вам нужно пространство для самовыражения и нестандартных решений; жёсткие рамки душат.
- id: s
  name: Социальный (Social)
  high: помощь, обучение, работа с людьми
  low: интерес к другому
  bands:
  - from: 0
    label: низкий
    text: Постоянная работа с людьми вас не привлекает.
  - from: 40
    label: средний
    text: Работа с людьми вам подходит, если это не весь рабочий день.
  - from: 65
    label: высокий
    text: 'Вам важно быть полезным конкретным людям: учить, лечить, поддерживать, разбираться в их ситуациях.'
- id: e
  name: Предприимчивый (Enterprising)
  high: влияние, переговоры, ответственность за результат
  low: интерес к другому
  bands:
  - from: 0
    label: низкий
    text: Продажи, переговоры и руководство вас не привлекают.
  - from: 40
    label: средний
    text: Организаторские задачи вам подходят в умеренном объёме.
  - from: 65
    label: высокий
    text: Вам нравится вести за собой, договариваться и отвечать за результат целиком.
- id: c
  name: Организованный (Conventional)
  high: порядок, системность, точность
  low: интерес к другому
  bands:
  - from: 0
    label: низкий
    text: Рутинная работа с данными и документами вас тяготит.
  - from: 40
    label: средний
    text: Упорядоченная работа вам подходит, но нужна и вариативность.
  - from: 65
    label: высокий
    text: Вам комфортно там, где есть система, точность и понятные правила.
