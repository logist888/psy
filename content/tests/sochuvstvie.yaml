slug: sochuvstvie
version: 1.0.0
title: Тест на сочувствие
seoTitle: Тест на сочувствие онлайн — бесплатно, 10 вопросов
description: >-
  Онлайн-тест на сочувствие по шкале IPIP: 10 утверждений о том, насколько вас трогает чужая беда и как вы на неё
  откликаетесь. Около 3 минут, это самоотчёт.
category: relationships
ctaCluster: relationships
minutes: 3
passport:
  measures: Шкала измеряет, насколько человека трогает положение других и насколько он склонен откликаться на чужую беду.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт «сочувствие».
    Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.75 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: сочувствие
    high: остро чувствуете чужую боль и не проходите мимо
    low: смотрите на чужие трудности трезво и держите дистанцию
    bands:
      - from: 0
        label: низкое
        text: >-
          На чужие трудности вы смотрите скорее трезво, чем чувственно, и считаете, что человек в основном отвечает за
          себя сам. Это делает вас устойчивым там, где другие теряются от эмоций. Цена — близким иногда нужно не
          решение, а чтобы их просто пожалели, и такой сигнал легко пропустить.
      - from: 40
        label: среднее
        text: >-
          Вы откликаетесь на чужую беду, но не тонете в ней. Обычно получается и посочувствовать, и сохранить
          способность помочь делом. Насколько сильно вас затрагивает история, во многом зависит от того, насколько
          человек вам близок.
      - from: 70
        label: высокое
        text: >-
          Чужая боль отзывается в вас почти как своя, и мимо несправедливости вы не проходите. Люди это чувствуют и
          часто идут к вам с тяжёлым. Обратная сторона — новостей и чужих историй легко набрать больше, чем выдерживают
          ваши силы.
questions:
  - id: q1
    text: Сочувствую бездомным.
    scales:
      - scale: total
  - id: q2
    text: Сочувствую тем, кому живётся хуже, чем мне.
    scales:
      - scale: total
  - id: q3
    text: Ценю сотрудничество больше, чем соперничество.
    scales:
      - scale: total
  - id: q4
    text: Тяжело переживаю чужое горе.
    scales:
      - scale: total
  - id: q5
    text: Не интересуюсь чужими проблемами.
    scales:
      - scale: total
        reverse: true
  - id: q6
    text: Недолюбливаю мягкосердечных людей.
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Верю в принцип «око за око».
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Стараюсь не думать о тех, кто нуждается.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Считаю, что каждый должен выкарабкиваться сам.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Терпеть не могу слабых людей.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Когда чужая история выбивает из колеи, спросите себя: могу ли я что-то сделать в ближайшие сутки? Если да — сделайте
    одно небольшое действие, если нет — это сигнал закрыть ленту.
  - >-
    Сочувствие лучше держится на регулярном малом, чем на редком героическом: небольшой ежемесячный взнос или час
    волонтёрства истощают куда меньше, чем спонтанные порывы.
  - >-
    Если чужие эмоции вас почти не задевают, попробуйте начинать ответ с одной фразы признания: «да, это правда
    неприятно». Часто ждут именно её, а не плана действий.
