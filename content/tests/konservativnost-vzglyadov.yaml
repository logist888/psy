slug: konservativnost-vzglyadov
version: 1.0.0
title: Тест на консервативность взглядов
seoTitle: Тест на консервативность онлайн — бесплатно, 9 вопросов
description: >-
  Тест из 9 утверждений о ваших взглядах: насколько важны для вас традиции, устойчивые правила и представление о единых
  для всех истинах.
category: personality
ctaCluster: self
minutes: 2
passport:
  measures: Шкала показывает, насколько человек опирается на традиции и постоянные правила, а не на меняющиеся нормы.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт
    «консервативность взглядов». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.71 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: консервативность взглядов
    high: цените традиции, порядок и ясные правила
    low: открыты переменам и относительности норм
    bands:
      - from: 0
        label: невысокая консервативность
        text: >-
          Вы легко допускаете, что правил на все случаи не существует, и охотно пересматриваете привычное. Вам проще
          принять новые нормы и людей с непривычным укладом. Минус — иногда не хватает опоры, когда решить, что
          правильно, нужно быстро.
      - from: 40
        label: умеренная консервативность
        text: >-
          Часть традиций для вас важна, часть выглядит формальностью. Вы соотносите новое с прежним опытом, но не
          считаете старое верным только из-за возраста. Позиция гибкая, хотя в спорах её нередко принимают за
          уклончивость.
      - from: 70
        label: высокая консервативность
        text: >-
          У вас есть ясная система ориентиров, и вы не готовы менять её под настроение времени. Это даёт устойчивость и
          делает вас опорой для окружающих. Стоит время от времени проверять, какие правила действительно работают, а
          какие держатся по привычке.
questions:
  - id: q1
    text: Верю, что истинная религия только одна.
    scales:
      - scale: total
  - id: q2
    text: Верю, что есть истины, общие для всех.
    scales:
      - scale: total
  - id: q3
    text: Голосую за консервативных политиков.
    scales:
      - scale: total
  - id: q4
    text: Считаю, что детей нужно воспитывать в строгости.
    scales:
      - scale: total
  - id: q5
    text: Жертвую собой ради других.
    scales:
      - scale: total
  - id: q6
    text: Считаю традиции важными.
    scales:
      - scale: total
  - id: q7
    text: Считаю, что нет абсолютно правильного и неправильного.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Голосую за либеральных политиков.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Не люблю фильмы с голливудским хеппи-эндом.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Для каждой важной традиции спросите, какую задачу она когда-то решала. Часть правил после этого хочется сохранить
    осознанно, а часть — отпустить без сожаления.
  - >-
    В спорах о ценностях просите собеседника описать конкретный случай, а не позицию: на уровне случаев расхождений
    обычно меньше, чем на уровне лозунгов.
  - >-
    Раз в год меняйте что-то заведомо неважное в укладе — маршрут, блюдо, порядок дел. Это тренирует переносимость
    перемен без риска для главного.
