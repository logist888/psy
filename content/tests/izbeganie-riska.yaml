slug: izbeganie-riska
version: 1.0.0
title: Тест на избегание риска
seoTitle: Тест на избегание риска онлайн — бесплатно, 10 вопросов
description: >-
  Что вам ближе — безопасность или азарт? Самоотчётная шкала из 10 вопросов о том, как вы ведёте себя рядом с риском,
  опасностью и неопределённостью.
category: personality
ctaCluster: self
minutes: 3
passport:
  measures: Шкала показывает, насколько вы склонны обходить стороной физический и денежный риск ради предсказуемости.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт «избегание
    риска и опасности». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.80 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: избегание риска и опасности
    high: осторожность, выбор надёжных вариантов
    low: азарт, готовность рискнуть
    bands:
      - from: 0
        label: низкое избегание риска
        text: >-
          Риск вас скорее притягивает, чем пугает: вы легко соглашаетесь на авантюры и спокойно живёте в
          неопределённости. Новое вы пробуете раньше, чем успеваете просчитать. Обратная сторона — цена ошибки иногда
          оказывается выше, чем виделось на входе.
      - from: 40
        label: умеренное избегание риска
        text: >-
          Вы прикидываете, где риск оправдан, а где нет. В знакомых ситуациях действуете смело, в незнакомых
          притормаживаете и собираете информацию. Такой баланс позволяет пробовать новое, не теряя опоры.
      - from: 70
        label: выраженное избегание риска
        text: >-
          Предсказуемость для вас ценнее острых ощущений. Вы заранее просчитываете последствия, избегаете авантюр и
          редко попадаете в истории из-за одного порыва. Иногда мимо проходят возможности, которые требовали быстрого
          «да».
questions:
  - id: q1
    text: Не стану прыгать с тарзанкой или летать на дельтаплане.
    scales:
      - scale: total
  - id: q2
    text: Не стану вкладывать деньги в рискованные проекты.
    scales:
      - scale: total
  - id: q3
    text: Избегаю опасных ситуаций.
    scales:
      - scale: total
  - id: q4
    text: Ищу опасности.
    scales:
      - scale: total
        reverse: true
  - id: q5
    text: Соглашусь попробовать что угодно хотя бы раз.
    scales:
      - scale: total
        reverse: true
  - id: q6
    text: Делаю опасные вещи.
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Люблю действовать безрассудно.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Ищу приключений.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Иду на риск.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Совершаю безумные поступки.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Ведите список рискованных решений, о которых вы не жалеете. Он корректирует прогноз опасности точнее, чем уговоры
    «не бойся».
  - >-
    Перед отказом спрашивайте себя не «опасно ли это», а «обратимо ли это». Необратимые риски стоит обходить всегда,
    обратимые — почти никогда.
  - >-
    Если тянет к риску, назначайте предел заранее — сумму, время, высоту — и записывайте его до начала, а не решайте по
    ощущению в моменте.
