slug: loneliness
version: 1.0.0
title: Тест на одиночество
seoTitle: Тест на одиночество онлайн — бесплатно и анонимно
description: Одиночество — это не про количество людей вокруг, а про качество связи. 14 утверждений, около 3 минут.
category: relationships
ctaCluster: relationships
minutes: 3
passport:
  measures: 'Субъективное переживание одиночества в двух проявлениях: ощущение отсутствия близости и ощущение оторванности
    от круга общения.'
  origin: Собственная разработка проекта на основе представления об одиночестве как расхождении между желаемыми и имеющимися
    связями.
  rightsBasis: own_work
  rightsNote: Формулировки принадлежат проекту.
  reliability: Опросник новый и независимой проверки не проходил.
  limitations: Одиночество — состояние, а не диагноз, и оно бывает нормальной реакцией на переезд, расставание или смену работы.
    Устойчивое одиночество часто сопровождает сниженное настроение и социальную тревогу, но опросник их не различает.
instruction: Вспомните последние несколько недель.
options:
- text: Никогда
  value: 0
- text: Редко
  value: 1
- text: Часто
  value: 2
- text: Почти всегда
  value: 3
scales:
- id: intimacy
  name: Нехватка близости
  high: не хватает человека, который по-настоящему понимает
  low: есть люди, с которыми можно быть настоящим
  bands:
  - from: 0
    label: низкая
    text: У вас есть люди, с которыми можно быть собой.
  - from: 40
    label: заметная
    text: Близкий контакт есть, но его не хватает или он не такой глубокий, как хотелось бы.
  - from: 70
    label: высокая
    text: Вам не хватает человека, перед которым можно не держать лицо. Это самая болезненная форма одиночества — она не лечится
      увеличением числа контактов.
- id: belonging
  name: Оторванность от круга
  high: ощущение, что вы вне общего круга
  low: чувство принадлежности
  bands:
  - from: 0
    label: низкая
    text: Вы чувствуете себя частью своего круга.
  - from: 40
    label: заметная
    text: Вы бываете среди людей, но иногда ощущаете себя посторонним.
  - from: 70
    label: высокая
    text: Даже в компании вы чувствуете себя чужим. Дело не в количестве людей, а в отсутствии ощущения «мы».
