selfHelp:
- 'Одиночество почти не лечится увеличением числа контактов. Работает другое: одна связь, в которую вкладываются регулярно
  — созвон раз в неделю с одним и тем же человеком даёт больше, чем десяток новых знакомств.'
- Заметьте механизм избегания. При долгом одиночестве люди начинают ожидать отвержения и первыми отказываются от встреч —
  а потом объясняют это тем, что никому не нужны. Если узнали себя, попробуйте принять ближайшее приглашение, не раздумывая.
- Ищите людей вокруг общего дела, а не общения. Совместная регулярная деятельность — курс, спорт, волонтёрство — создаёт близость
  надёжнее, чем попытки «найти друзей».
- 'Если одиночество держится месяцами и появляется ощущение, что вы никому не нужны, стоит обсудить это со специалистом: длительное
  одиночество и сниженное настроение усиливают друг друга.'
