slug: samonablyudenie
version: 1.0.0
title: Тест на самонаблюдение
seoTitle: Тест на самонаблюдение онлайн — бесплатно, 8 вопросов
description: >-
  Тест из 8 утверждений о том, насколько вам близко уединение и привычка разбираться в собственных мыслях, мотивах и
  реакциях.
category: personality
ctaCluster: self
minutes: 2
passport:
  measures: Шкала показывает, насколько человек склонен размышлять о себе и ценить время наедине с собой.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт
    «самонаблюдение». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.71 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: самонаблюдение
    high: любите уединение и подолгу разбираетесь в себе
    low: предпочитаете действие и компанию долгим размышлениям
    bands:
      - from: 0
        label: невысокое самонаблюдение
        text: >-
          Вы редко копаетесь в мотивах: проще сделать и посмотреть, что выйдет. Рядом с людьми вам обычно легче, чем
          наедине с собой. Это экономит силы, но причина собственного раздражения или усталости иногда остаётся
          незамеченной.
      - from: 40
        label: среднее самонаблюдение
        text: >-
          Вы способны и побыть в одиночестве, и не застревать в размышлениях. Разбор себя чаще включается по поводу:
          после ссоры или неожиданного для вас решения. Такой баланс удобен, если не откладывать разговор с собой до
          момента, когда всё уже накопилось.
      - from: 70
        label: выраженное самонаблюдение
        text: >-
          Вам комфортно наедине с собой, и внутренняя жизнь для вас не менее реальна, чем внешняя. Вы хорошо понимаете
          свои реакции и редко удивляетесь собственным поступкам. Риск — заменить размышлением действие, поэтому полезно
          ставить срок, после которого вопрос переходит в план.
questions:
  - id: q1
    text: Провожу время в размышлениях.
    scales:
      - scale: total
  - id: q2
    text: Люблю проводить время наедине с собой.
    scales:
      - scale: total
  - id: q3
    text: Живу в своём собственном мире.
    scales:
      - scale: total
  - id: q4
    text: Ценю личное пространство.
    scales:
      - scale: total
  - id: q5
    text: Не смущаюсь есть в одиночестве.
    scales:
      - scale: total
  - id: q6
    text: Делаю всё в своём темпе.
    scales:
      - scale: total
  - id: q7
    text: Не выношу одиночества.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Не люблю копаться в мыслях.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Разделяйте разбор и пережёвывание: если за десять минут мыслей не появилось ни одного нового факта или шага, это
    второй режим, и его лучше прервать движением.
  - >-
    Записывайте выводы о себе одной фразой с датой. Через месяц видно, какие повторяются: это и есть устойчивые мотивы,
    а не сиюминутные объяснения.
  - >-
    Ставьте одиночество в календарь заранее, а не по остаточному принципу: запланированный час снимает больше
    напряжения, чем случайно освободившийся вечер.
