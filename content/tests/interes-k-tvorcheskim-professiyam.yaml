crisis: []
selfHelp:
  - >-
    Выделите на этой неделе два раза по часу на любое создание своими руками: рисунок, текст, короткое видео,
    музыкальный набросок — без цели кому-то показать результат.
  - >-
    Сходите на выставку, открытую репетицию, концерт или спектакль и обратите внимание, тянет ли вас смотреть или
    всё-таки делать самому.
  - >-
    Найдите разовый мастер-класс по любому направлению, которое вы отметили в тесте: гончарное дело, скетчинг, вокал,
    писательство, — и запишитесь на ближайший.
