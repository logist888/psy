slug: interes-k-tvorcheskim-professiyam
version: 1.0.0
title: Тест на интерес к творческим профессиям
seoTitle: Тест на интерес к творческим профессиям — бесплатно, 14 вопросов
description: >-
  Бесплатный тест из 14 вопросов о том, насколько вас притягивают творческие профессии: рисунок, музыка, тексты, сцена и
  дизайн. Без регистрации, результат сразу.
category: career
ctaCluster: career
minutes: 4
passport:
  measures: >-
    Шкала показывает, насколько вам интересны занятия, где нужно придумывать и создавать своё: рисовать, писать, играть,
    петь, оформлять и проектировать.
  origin: >-
    Шкала опросника профессиональных интересов ORVIS (Oregon Vocational Interest Scales; Pozzebon, Visser, Ashton, Lee &
    Goldberg, 2010) из международного пула пунктов IPIP, измеряющая конструкт «интерес к творческим профессиям». Русский
    перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    Ни коэффициент надёжности англоязычного оригинала, ни проверка русского перевода не опубликованы — относитесь к
    результату как к поводу подумать, а не к измерению.
  limitations: >-
    Шкала показывает интерес, а не способности и не пригодность к профессии: нравится — не то же самое, что получается.
    Нормы российской выборки не собраны, вы видите процент от максимума шкалы, а не сравнение с другими людьми, поэтому
    читайте результат как повод присмотреться к направлению, а не как рекомендацию по выбору работы.
instruction: >-
  Оценивайте, насколько вам нравится такая деятельность, независимо от того, умеете вы это или нет и сколько за это
  платят.
options:
  - text: Совсем не нравится
    value: 0
  - text: Скорее не нравится
    value: 1
  - text: Скорее нравится
    value: 2
  - text: Очень нравится
    value: 3
scales:
  - id: total
    name: интерес к творческим профессиям
    high: тянет придумывать и создавать своё
    low: творческие занятия не притягивают
    bands:
      - from: 0
        label: низкий
        text: >-
          Занятия, где нужно сочинять, рисовать, играть на сцене или оформлять пространство, вас скорее не зовут.
          Возможно, вы с интересом смотрите на чужие работы, но сами браться за них не хотите. Это не признак недостатка
          воображения: низкий балл говорит лишь о том, что интереса к такому виду деятельности мало. Интерес и
          способности — разные вещи: человек может отлично рисовать и при этом не тянуться к рисованию. Творческая жилка
          в работе вполне может проявляться иначе — в решениях, идеях, подходах, а не в искусстве.
      - from: 40
        label: средний
        text: >-
          Творчество вам интересно, но не поглощает целиком. Скорее всего, вы с удовольствием возьмётесь за оформление,
          текст или музыку, когда есть повод, но каждый день этим заниматься не рвётесь. Средний балл часто встречается
          у тех, кому творчество нужно как часть дела, а не как всё дело: дизайн в проекте, тексты в работе, музыка для
          себя. Стоит помнить, что нравится и получается — разные вещи, и одно не выводится из другого. Посмотрите,
          какие именно пункты вы оценили высоко: там и прячется ваш формат.
      - from: 70
        label: высокий
        text: >-
          Вас тянет создавать своё — образы, тексты, музыку, роли, вещи, интерьеры. Творческая работа для вас скорее
          источник энергии, чем нагрузка. Это повод присмотреться к направлениям, связанным с искусством, дизайном,
          сценой и текстом, но не обещание, что именно такая профессия вам подойдёт. Высокий интерес не заменяет
          мастерства: нравится и получается — разные вещи, и путь от увлечения до уровня, за который платят, обычно
          долгий. Полезно дать интересу регулярное место в неделе и посмотреть, что вырастет.
