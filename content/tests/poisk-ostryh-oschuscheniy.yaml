slug: poisk-ostryh-oschuscheniy
version: 1.0.0
title: Тест на поиск острых ощущений
seoTitle: Тест на поиск острых ощущений онлайн — бесплатно, 10 вопросов
description: >-
  Шкала IPIP из 10 утверждений: насколько вас тянет к риску, скорости и ярким впечатлениям и как вы переносите спокойный
  ритм. Занимает около 2 минут.
category: personality
ctaCluster: self
minutes: 3
passport:
  measures: Насколько сильно человека тянет к сильным впечатлениям, риску, шуму и высокому темпу жизни.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт «поиск острых
    ощущений». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.78 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: поиск острых ощущений
    high: тянет к риску, скорости и новым впечатлениям
    low: предпочитает спокойный и предсказуемый ритм
    bands:
      - from: 0
        label: низкий
        text: >-
          Вам комфортнее там, где спокойно и предсказуемо: шум, толпа и резкие повороты скорее утомляют, чем заряжают.
          Вы реже влипаете в истории из-за импульсивного решения, но иногда упускаете возможность, которая требовала
          быстрого «да». Если жизнь кажется пресной, дело чаще в нехватке новизны, а не в вашем темпераменте.
      - from: 40
        label: умеренный
        text: >-
          Вы умеете и разогнаться, и притормозить: рискуете, когда игра стоит свеч, и спокойно пропускаете сомнительную
          авантюру. Такой баланс удобен окружающим, хотя вы сами иногда не понимаете, чего хотите — тишины или движения.
          Полезно замечать, в какие периоды вас тянет в разные стороны.
      - from: 70
        label: высокий
        text: >-
          Вам нужен высокий темп и доза адреналина: рутина быстро приедается, а новые впечатления возвращают вкус к
          жизни. Это даёт смелость и лёгкость на подъём, но цена — импульсивные решения и привычка недооценивать риск.
          Многое зависит от того, куда направлена эта энергия.
questions:
  - id: q1
    text: Люблю острые ощущения.
    scales:
      - scale: total
  - id: q2
    text: Ищу приключений.
    scales:
      - scale: total
  - id: q3
    text: Люблю, когда вокруг много движения.
    scales:
      - scale: total
  - id: q4
    text: Мне нравится быть в шумной толпе.
    scales:
      - scale: total
  - id: q5
    text: Получаю удовольствие, когда рискую без оглядки.
    scales:
      - scale: total
  - id: q6
    text: Веду себя безбашенно.
    scales:
      - scale: total
  - id: q7
    text: Не против попробовать что угодно хотя бы раз.
    scales:
      - scale: total
  - id: q8
    text: Тянусь к опасности.
    scales:
      - scale: total
  - id: q9
    text: Ни за что не прыгну с тарзанки и не полечу на дельтаплане.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Не люблю громкую музыку.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Введите правило суток для решений, где на кону деньги, здоровье или отношения: если через 24 часа идея всё ещё
    кажется отличной — действуйте.
  - >-
    Ищите риск с обратимыми последствиями: новый маршрут, спорт со страховкой, публичное выступление. Острота остаётся,
    а цена ошибки резко падает.
  - >-
    Если накатывает скука, не увеличивайте дозу впечатлений, а меняйте их тип: физическая нагрузка и новые люди насыщают
    иначе, чем скорость и риск.
