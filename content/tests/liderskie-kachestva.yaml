slug: liderskie-kachestva
version: 1.0.0
title: Тест на лидерские качества
seoTitle: Тест на лидерские качества онлайн — бесплатно, 9 вопросов
description: >-
  9 утверждений о том, тянет ли вас брать управление на себя и отвечать за решения. Занимает пару минут. Это самоотчёт
  для размышления, а не диагностика и не оценка компетенций.
category: career
ctaCluster: career
minutes: 2
passport:
  measures: Шкала показывает, насколько вам хочется руководить, принимать решения и вести других за собой.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт «лидерские
    качества». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.85 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: лидерские качества
    high: стремление руководить и брать решения на себя
    low: готовность отдать руль другому
    bands:
      - from: 0
        label: низкая
        text: >-
          По ответам вы не стремитесь управлять другими и спокойно отдаёте руль тому, кто хочет его взять. Плюс в том,
          что вы не тратите силы на борьбу за влияние, легче работаете в команде и не берёте на себя лишнего. Цена —
          ваши идеи могут остаться незамеченными, а решения о вашей же работе примет кто-то другой. Со стороны это
          иногда читается как безразличие, хотя вам просто не нужна власть. Если тема для вас важна, помогает брать не
          роль начальника, а один конкретный участок и отвечать за него.
      - from: 40
        label: средняя
        text: >-
          Вы можете взять руководство на себя, но не рвётесь к нему при любой возможности. Обычно это значит, что вы
          становитесь ведущим там, где действительно разбираетесь, и спокойно уступаете в остальном. Обратная сторона —
          в моменты, когда группе нужен кто-то решающий, вы можете подождать слишком долго, и вопрос повиснет. Помогает
          заранее договариваться, кто за что отвечает, вместо того чтобы выяснять это уже в процессе.
      - from: 70
        label: высокая
        text: >-
          Ответы говорят о выраженном стремлении быть тем, кто решает: вам важно влияние, вы берёте ответственность и
          ведёте других за собой. Это даёт энергию там, где нужно быстро задать направление и сдвинуть дело с места.
          Цена — желание контролировать чужую работу, раздражение, когда решили без вас, и риск продавить своё там, где
          стоило спросить. Часть пунктов шкалы касается умения добиваться своего через людей, так что высокий балл сам
          по себе ничего не говорит о том, во благо это или нет. Полезно проверять, остаётся ли рядом с вами место для
          чужой инициативы.
questions:
  - id: q1
    text: Мне нравится, когда я руковожу другими
    scales:
      - scale: total
  - id: q2
    text: Стараюсь вести людей за собой
    scales:
      - scale: total
  - id: q3
    text: Хочу быть главным
    scales:
      - scale: total
  - id: q4
    text: Мне важно иметь власть
    scales:
      - scale: total
  - id: q5
    text: Мне легко управлять людьми в своих интересах
    scales:
      - scale: total
  - id: q6
    text: Не люблю командовать другими
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Не люблю брать на себя ответственность за решения
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Не особо стремлюсь к успеху
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Жду, пока инициативу возьмёт кто-то другой
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Возьмите на этой неделе один конкретный участок работы, объявите себя ответственным за него и скажите об этом
    остальным вслух.
  - >-
    На ближайшей встрече отдайте одно решение другому человеку целиком — без правок и подсказок — и посмотрите, что
    получится.
  - >-
    Выпишите три ситуации, где вы недавно ждали чужой инициативы; выберите одну и сделайте по ней первый шаг до конца
    недели.
