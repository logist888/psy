slug: zavisimost-ot-drugih-lyudey
version: 1.0.0
title: Тест на зависимость от других людей
seoTitle: Тест на зависимость от других онлайн — бесплатно, 10 вопросов
description: >-
  Тест из 10 утверждений о том, насколько вам важно согласие окружающих: чаще вы подстраиваетесь под чужие ожидания или
  идёте своим путём.
category: personality
ctaCluster: self
minutes: 3
passport:
  measures: Шкала показывает, насколько человек ориентируется на ожидания окружающих, а не на собственное решение.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт «зависимость
    от других людей». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.67 (данные IPIP) — это ниже привычного порога 0,70, то
    есть пункты шкалы согласуются между собой слабо и результат стоит читать как повод подумать, а не как замер. Русский
    перевод независимой психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к
    измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: зависимость от других людей
    high: подстраиваетесь под других и цените согласие
    low: идёте своим путём и мало оглядываетесь на мнения
    bands:
      - from: 0
        label: невысокая потребность в опоре
        text: >-
          Вы решаете сами и не тратите силы на то, чтобы всем угодить. Вам легко сказать «нет» и удержать свою линию под
          давлением. Обратная сторона — обратную связь легко пропустить мимо ушей, а попросить помощи бывает труднее,
          чем справиться в одиночку.
      - from: 40
        label: умеренная потребность в опоре
        text: >-
          Вы учитываете чужие ожидания, но не растворяетесь в них. В команде с вами уживчиво, а в принципиальных
          вопросах вы способны настоять на своём. Труднее всего заранее понять, где уступка уместна, а где вы
          соглашаетесь просто из нежелания спорить.
      - from: 70
        label: высокая потребность в опоре
        text: >-
          Вам важно, чтобы окружающие были довольны, и вы часто выбираете вариант, удобный для них. С вами легко иметь
          дело: вы надёжны в договорённостях и не создаёте лишнего напряжения. Риск — копить усталость от решений,
          принятых не в свою пользу, поэтому полезно заранее знать, где проходит ваша граница.
questions:
  - id: q1
    text: Стараюсь угодить всем.
    scales:
      - scale: total
  - id: q2
    text: Следую указаниям.
    scales:
      - scale: total
  - id: q3
    text: Делаю то, чего от меня хотят другие.
    scales:
      - scale: total
  - id: q4
    text: Ненавижу выглядеть навязчиво.
    scales:
      - scale: total
  - id: q5
    text: Выполняю приказы.
    scales:
      - scale: total
  - id: q6
    text: Не переживаю о том, что подумают другие.
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Схватываю возможности на лету.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Не уступаю никому.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Хочу отличаться от других.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Верю только в себя.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Заведите формулу паузы: на любую просьбу отвечайте «скажу через час». Отказ даётся легче, когда он звучит не в
    момент давления.
  - >-
    Раз в неделю делайте одно дело строго по своему вкусу, ни с кем не согласовывая, — даже совсем мелкое. Навык выбора
    тренируется на малом, а не на важном.
  - >-
    Заметьте, кому именно вы уступаете чаще всего. Обычно это два-три человека, и говорить нужно с ними, а не
    переделывать характер целиком.
