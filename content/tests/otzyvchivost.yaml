slug: otzyvchivost
version: 1.0.0
title: Тест на отзывчивость
seoTitle: Тест на отзывчивость онлайн — бесплатно, 10 вопросов
description: >-
  Онлайн-тест на отзывчивость по шкале IPIP: 10 утверждений о внимании к людям и готовности помогать. Займёт около 3
  минут, результат — ваша самооценка, а не оценка со стороны.
category: relationships
ctaCluster: relationships
minutes: 3
passport:
  measures: Шкала измеряет, насколько человек по своей инициативе замечает нужды других и вкладывается в их благополучие.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт
    «отзывчивость». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.77 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: отзывчивость
    high: замечаете чужие нужды и помогаете, не дожидаясь просьбы
    low: держите дистанцию и бережёте своё время и силы
    bands:
      - from: 0
        label: низкая
        text: >-
          Вы не спешите включаться в чужие дела и чаще исходите из того, что каждый справится сам. Это бережёт ваше
          время и силы, и вы редко берёте на себя лишнее. Цена такого стиля — вашу сдержанность близкие иногда читают
          как холодность, даже если относитесь вы к ним хорошо.
      - from: 40
        label: средняя
        text: >-
          Вы помогаете, когда видите реальную нужду, но не превращаете помощь в работу без выходных. Обычно получается и
          замечать людей рядом, и не растворяться в их задачах. В периоды перегруза вы естественным образом сокращаете
          участие — и это рабочий механизм.
      - from: 70
        label: высокая
        text: >-
          Вы замечаете, кому сейчас неуютно, и часто помогаете раньше, чем вас об этом попросят. Рядом с вами людям
          спокойно, и вокруг легко складывается тёплый круг. Обратная сторона — чужие просьбы копятся, и однажды можно
          обнаружить, что на свои дела ничего не осталось.
questions:
  - id: q1
    text: Умею сделать так, чтобы человек почувствовал себя своим.
    scales:
      - scale: total
  - id: q2
    text: Замечаю, что нужно другим, ещё до того как они попросят.
    scales:
      - scale: total
  - id: q3
    text: Люблю помогать людям.
    scales:
      - scale: total
  - id: q4
    text: Переживаю за других людей.
    scales:
      - scale: total
  - id: q5
    text: Для каждого нахожу доброе слово.
    scales:
      - scale: total
  - id: q6
    text: Смотрю на других свысока.
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Не обращаю внимания на чувства других.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Вызываю у людей неловкость.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Отворачиваюсь от людей, когда им трудно.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Не трачу время на других.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Перед тем как броситься помогать, спросите, какая помощь нужна: часто человеку нужно совсем не то, что вы уже начали
    делать.
  - >-
    Задайте себе бюджет помощи на неделю — например два вечера. Когда бюджет исчерпан, отказ становится вопросом
    календаря, а не отношения к человеку.
  - >-
    Раз в месяц просматривайте, кому вы помогали. Если один и тот же человек занимает больше трети списка, речь скорее о
    его привычке, чем о разовой нужде.
