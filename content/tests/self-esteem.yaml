slug: self-esteem
version: 1.0.0
title: Шкала самооценки Розенберга
seoTitle: "Тест на самооценку (шкала Розенберга) — онлайн бесплатно"
description: Классическая шкала общего самоуважения. 10 утверждений, около 3 минут. Анонимно, без регистрации.
category: wellbeing
ctaCluster: self
minutes: 3
passport:
  measures: Общее самоуважение — насколько человек в целом принимает и ценит себя.
  origin: Rosenberg Self-Esteem Scale (M. Rosenberg, 1965). Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: Шкала распространяется свободно при указании авторства (Университет Мэриленда от имени семьи М. Розенберга). Перевод — собственная работа проекта.
  reliability: У оригинальной шкалы высокая внутренняя согласованность (α около 0,8–0,9) и она остаётся самой цитируемой мерой самооценки в мире. Русский перевод этого проекта независимой проверки не проходил.
  limitations: Шкала измеряет одно общее отношение к себе и не показывает, в каких именно областях жизни самооценка выше или ниже. Результат сильно зависит от состояния в момент прохождения.
instruction: Оцените, насколько вы согласны с каждым утверждением. Отвечайте о том, как вы обычно себя чувствуете, а не только сегодня.
options:
  - text: "Совершенно не согласен"
    value: 0
  - text: "Не согласен"
    value: 1
  - text: "Согласен"
    value: 2
  - text: "Полностью согласен"
    value: 3
scales:
  - id: total
    name: Самоуважение
    high: устойчивое принятие себя
    low: критичное отношение к себе
    bands:
      - from: 0
        label: "низкое"
        text: "Вы часто оцениваете себя строже, чем оценили бы другого человека на своём месте. Низкая самооценка — не свойство личности, а привычка отношения к себе, и она поддаётся изменению."
      - from: 40
        label: "среднее"
        text: "Вы в целом принимаете себя, но уверенность заметно колеблется в зависимости от обстоятельств и чужой реакции."
      - from: 70
        label: "устойчивое"
        text: "Вы относитесь к себе с уважением и признаёте собственную ценность, не завися целиком от чужой оценки."
questions:
  - id: q1
    text: "В целом я себе нравлюсь."
    scales:
      - scale: total
  - id: q2
    text: "Иногда мне кажется, что я ни на что не годен."
    scales:
      - scale: total
        reverse: true
  - id: q3
    text: "Я считаю, что у меня есть ряд хороших качеств."
    scales:
      - scale: total
  - id: q4
    text: "Я способен делать многое не хуже других."
    scales:
      - scale: total
  - id: q5
    text: "Мне кажется, что мне особенно нечем гордиться."
    scales:
      - scale: total
        reverse: true
  - id: q6
    text: "Порой я чувствую себя бесполезным."
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: "Я чувствую, что я человек, достойный уважения, по крайней мере не меньше других."
    scales:
      - scale: total
  - id: q8
    text: "Мне хотелось бы больше уважать себя."
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: "В целом мне кажется, что в жизни у меня мало что получилось."
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: "Я отношусь к себе хорошо."
    scales:
      - scale: total
crisis: []
selfHelp:
  - Отследите, чьим голосом звучит внутренняя критика. Часто самые жёсткие оценки о себе — не ваши собственные, а усвоенные когда-то чужие.
  - "Записывайте сделанное, а не только несделанное. При низкой самооценке память избирательна: провалы запоминаются, а успехи обесцениваются как «само собой разумеющееся»."
  - Сравнивайте себя с собой полгода назад, а не с другими людьми. Второе сравнение почти всегда нечестное — вы знаете о себе всё, а о других только внешнюю сторону.
