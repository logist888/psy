slug: druzhelyubie
version: 1.0.0
title: Тест на дружелюбие
seoTitle: Тест на дружелюбие онлайн — бесплатно, 10 вопросов
description: >-
  Шкала дружелюбия IPIP: 10 утверждений о лёгкости контакта, теплоте к людям и дистанции в общении. Занимает около 2
  минут, результат с расшифровкой сразу.
category: relationships
ctaCluster: relationships
minutes: 3
passport:
  measures: Насколько легко и тепло вы вступаете в контакт с людьми и насколько близко их подпускаете.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт «Дружелюбие».
    Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.87 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: Дружелюбие
    high: легко и тепло сходитесь с людьми
    low: держите дистанцию и открываетесь медленно
    bands:
      - from: 0
        label: низкое
        text: >-
          Вы держите дистанцию и открываетесь не сразу: новых людей подпускаете медленно, а иногда общение просто не
          кажется нужным. Это не холодность, а другой ритм сближения. Круг общения при этом бывает узким, но крепким.
      - from: 40
        label: среднее
        text: >-
          С людьми вам обычно комфортно, но не с любыми и не всегда. Знакомитесь вы без особого труда, хотя близко
          подпускаете избранных. Обычное сочетание открытости и границ.
      - from: 70
        label: высокое
        text: >-
          Вы легко сходитесь с людьми, быстро становитесь своим и умеете поднять настроение компании. К вам тянутся и
          часто делятся личным. Оборотная сторона — можно набрать больше связей, чем хватает сил поддерживать.
questions:
  - id: q1
    text: Легко завожу друзей.
    scales:
      - scale: total
  - id: q2
    text: Быстро сближаюсь с людьми.
    scales:
      - scale: total
  - id: q3
    text: Чувствую себя легко среди людей.
    scales:
      - scale: total
  - id: q4
    text: Держусь свободно в компании.
    scales:
      - scale: total
  - id: q5
    text: Умею поднять людям настроение.
    scales:
      - scale: total
  - id: q6
    text: Открываюсь людям с трудом.
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Часто чувствую себя неуютно среди людей.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Избегаю общения.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Не особо интересуюсь другими людьми.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Держу людей на расстоянии.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    В разговоре задавайте второй вопрос по теме, которую человек уже поднял, — именно он превращает обмен репликами в
    контакт.
  - >-
    Пишите короткие сообщения без повода: «увидел и вспомнил о тебе». Связь держится на частоте касаний, а не на длине
    встреч.
  - >-
    Если дистанция кажется большой, начинайте с людей среднего круга — коллег, соседей, знакомых по хобби: там цена
    ошибки ниже, чем в близких отношениях.
