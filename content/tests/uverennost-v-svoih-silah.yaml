slug: uverennost-v-svoih-silah
version: 1.0.0
title: Тест на уверенность в своих силах
seoTitle: Тест на уверенность в своих силах — бесплатно, 10 вопросов
description: >-
  Онлайн-тест на уверенность в своих силах по шкале IPIP: 10 утверждений о том, насколько вы чувствуете, что
  справляетесь с задачами. Около 3 минут, это самооценка.
category: personality
ctaCluster: self
minutes: 3
passport:
  measures: Шкала измеряет, насколько человек ощущает себя способным справляться с задачами и добиваться нужного результата.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт «уверенность в
    своих силах». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.78 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: уверенность в своих силах
    high: уверены, что справитесь, и беретесь за сложное
    low: часто сомневаетесь, что вам это по силам
    bands:
      - from: 0
        label: низкая
        text: >-
          Вы чаще сомневаетесь, что справитесь, и склонны недооценивать собственный вклад. Польза у такой позиции тоже
          есть: вы реже переоцениваете себя и внимательнее к рискам. Цена — задачи, которые были бы вам по силам, можно
          не взять просто потому, что заранее решили, что не потянете.
      - from: 40
        label: средняя
        text: >-
          Вы примерно понимаете, где ваша сила, а где стоит попросить помощи, и опираетесь на этот опыт. В знакомых
          задачах чувствуете себя уверенно, в новых сначала присматриваетесь. Такой баланс редко подводит.
      - from: 70
        label: высокая
        text: >-
          Обычно вы уверены, что справитесь, и это видно по тому, как быстро вы беретесь за дело. Уверенность передаётся
          команде и помогает пройти неопределённость. Цена — на подъёме легче пропустить сигнал, что план не работает,
          поэтому рядом полезны люди, готовые сказать об этом прямо.
questions:
  - id: q1
    text: Довожу дела до успешного конца.
    scales:
      - scale: total
  - id: q2
    text: Добиваюсь отличных результатов в своём деле.
    scales:
      - scale: total
  - id: q3
    text: Справляюсь с задачами легко и без запинок.
    scales:
      - scale: total
  - id: q4
    text: Уверенно чувствую себя в том, что делаю.
    scales:
      - scale: total
  - id: q5
    text: Нахожу удачные решения.
    scales:
      - scale: total
  - id: q6
    text: Знаю, как довести дело до результата.
    scales:
      - scale: total
  - id: q7
    text: Неверно оцениваю ситуацию.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Часто не понимаю сути происходящего.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Мало что могу добавить по делу.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Не вижу, к чему приведут мои действия.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Ведите короткий журнал сделанного: раз в неделю три строки о том, что получилось. Ощущение «я справляюсь» строится
    на конкретных фактах, а не на настроении.
  - >-
    Разбивайте новое дело до куска, в котором вы уверены примерно на восемьдесят процентов. Уверенность растёт от
    завершённых кусков, а не от размера замысла.
  - >-
    Заведите одного человека, которому разрешено говорить вам «здесь ты ошибаешься». Это одинаково полезно и при
    завышенной, и при заниженной самооценке.
