slug: interes-k-rukovodyaschey-rabote
version: 1.0.0
title: Тест на интерес к руководящей работе
seoTitle: Тест на интерес к руководящей работе — бесплатно, 12 вопросов
description: >-
  Шкала опросника профессиональных интересов ORVIS: 12 занятий, связанных с руководством, переговорами и публичностью.
  Показывает силу интереса к такой работе, а не уровень способностей.
category: career
ctaCluster: career
minutes: 3
passport:
  measures: >-
    Шкала показывает, насколько человека привлекают занятия, связанные с руководством людьми, переговорами, публичностью
    и решениями, которые касаются многих.
  origin: >-
    Шкала опросника профессиональных интересов ORVIS (Oregon Vocational Interest Scales; Pozzebon, Visser, Ashton, Lee &
    Goldberg, 2010) из международного пула пунктов IPIP, измеряющая конструкт «интерес к руководящей работе». Русский
    перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    Ни коэффициент надёжности англоязычного оригинала, ни проверка русского перевода не опубликованы — относитесь к
    результату как к поводу подумать, а не к измерению.
  limitations: >-
    Шкала показывает интерес, а не способности и не пригодность к профессии: нравится — не то же самое, что получается.
    Нормы российской выборки не собраны, вы видите процент от максимума шкалы, а не сравнение с другими людьми, поэтому
    читайте результат как повод присмотреться к направлению, а не как рекомендацию по выбору работы.
instruction: >-
  Оценивайте, насколько вам нравится такая деятельность, независимо от того, умеете вы это или нет и сколько за это
  платят.
options:
  - text: Совсем не нравится
    value: 0
  - text: Скорее не нравится
    value: 1
  - text: Скорее нравится
    value: 2
  - text: Очень нравится
    value: 3
scales:
  - id: total
    name: интерес к руководящей работе
    high: тянет руководить, убеждать и отвечать за общий результат
    low: ближе своя работа без роли ведущего
    bands:
      - from: 0
        label: низкий
        text: >-
          Занятия, где нужно вести за собой, выступать и убеждать, вас скорее не привлекают. Похоже, вам спокойнее
          сделать дело самому, чем распределять его между людьми и добиваться от них результата. Низкий балл — это не
          недостаток и не потолок: он говорит о вкусе, а не о возможностях, и многие прекрасно справляются с
          ответственностью, когда обстоятельства этого требуют. Интерес и способности вообще стоит различать: «не тянет»
          и «не получится» — разные вещи.
      - from: 40
        label: средний
        text: >-
          Руководящие и публичные роли интересны вам умеренно. Скорее всего, вы готовы взять ответственность за общее
          дело, когда видите в нём смысл, но не стремитесь постоянно быть первым лицом. Такой профиль часто встречается
          у тех, кто ведёт отдельные проекты или небольшие команды, оставаясь при этом экспертом в своей теме. Помните,
          что нравится и получается — разные вещи: интерес имеет смысл проверять практикой, а не только опросником.
      - from: 70
        label: высокий
        text: >-
          Вас заметно тянет к тому, чтобы вести за собой, договариваться и влиять на решения, которые касаются многих
          людей. Это повод присмотреться к направлениям, где есть команда, переговоры и публичность: управление
          проектами, продажи, организаторская и общественная работа. Высокий балл не гарантирует успеха в таких ролях —
          желание руководить и умение руководить развиваются по-разному, и второе набирается опытом и обратной связью.
          Разумнее начать с небольшой ответственности и посмотреть, как это ощущается изнутри.
questions:
  - id: q1
    text: Добиваться, чтобы важные дела действительно происходили
    scales:
