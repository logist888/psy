crisis: []
selfHelp:
  - >-
    На этой неделе возьмите одну организаторскую задачу целиком: соберите людей на встречу, составьте повестку и
    проведите её от начала до конца — так интерес проверяется быстрее всего.
  - >-
    Найдите знакомого, который руководит командой хотя бы из трёх человек, и попросите полчаса на разговор: что в этой
    работе оказалось не таким, как он ожидал, и что отнимает больше всего сил.
  - >-
    Прочитайте одну книгу о переговорах — например, «Никаких компромиссов» Криса Восса — и опробуйте один приём в
    бытовом разговоре, где ставки невелики.
