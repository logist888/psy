  - id: q2
    text: Руководить людьми
    scales:
      - scale: total
  - id: q3
    text: Быть директором по продажам или маркетингу
    scales:
      - scale: total
  - id: q4
    text: Возглавлять крупную компанию
    scales:
      - scale: total
  - id: q5
    text: Организовывать политическую кампанию
    scales:
      - scale: total
  - id: q6
    text: Вести собрание в роли ведущего
    scales:
      - scale: total
  - id: q7
    text: Планировать рекламную кампанию
    scales:
      - scale: total
  - id: q8
    text: Отстаивать свою позицию в публичном споре
    scales:
      - scale: total
  - id: q9
    text: Убеждать других изменить своё мнение
    scales:
      - scale: total
  - id: q10
    text: Быть губернатором или депутатом
    scales:
      - scale: total
  - id: q11
