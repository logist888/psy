slug: dark-triad
version: 1.0.0
title: Тест на тёмную триаду
seoTitle: Тест на тёмную триаду онлайн — нарциссизм, макиавеллизм, психопатия
description: 'Три черты, которые в умеренной степени есть у всех: нарциссизм, макиавеллизм и низкая эмоциональная отзывчивость.
  18 утверждений, около 4 минут.'
category: personality
ctaCluster: self
minutes: 4
passport:
  measures: 'Выраженность трёх черт «тёмной триады»: нарциссизма (потребность в восхищении), макиавеллизма (расчётливость
    в отношениях) и низкой эмоциональной отзывчивости.'
  origin: Собственная разработка проекта на основе концепции тёмной триады (Полхус и Уильямс, 2002).
  rightsBasis: own_work
  rightsNote: Формулировки принадлежат проекту. Опросник SD3 требует согласия авторов на коммерческое использование и не воспроизводился.
  reliability: 'Опросник новый и независимой проверки не проходил. Учитывайте специфику темы: пункты здесь социально нежелательные,
    поэтому результаты особенно чувствительны к тому, насколько откровенно вы отвечали.'
  limitations: Это не тест на психопатию и не инструмент диагностики расстройств личности — такие вещи определяются клиническим
    обследованием, а не опросником. Высокий балл означает выраженность черты в обычном диапазоне, а не патологию. И тем более
    тест нельзя использовать, чтобы «поставить диагноз» другому человеку.
instruction: Отвечайте честно — результат видите только вы, и он нигде не сохраняется.
options:
- text: Не согласен
  value: 0
- text: Скорее не согласен
  value: 1
- text: Скорее согласен
  value: 2
- text: Согласен
  value: 3
scales:
- id: narc
  name: Нарциссизм
  high: потребность в восхищении и признании особым
  low: спокойное отношение к собственной значимости
  bands:
  - from: 0
    label: низкий
    text: Вам не требуется особое признание, чтобы чувствовать себя нормально.
  - from: 40
    label: средний
    text: Вам приятно внимание и признание, как и большинству людей.
  - from: 70
    label: высокий
    text: Вам важно быть замеченным и оценённым выше других; недостаток признания переживается болезненно.
- id: mach
  name: Макиавеллизм
  high: расчёт и стратегия в отношениях
  low: прямота и открытость
  bands:
  - from: 0
    label: низкий
    text: Вы прямолинейны и не склонны просчитывать людей.
  - from: 40
    label: средний
    text: Вы учитываете чужие интересы и мотивы, но не строите многоходовок.
  - from: 70
    label: высокий
    text: 'Вы смотрите на отношения стратегически: просчитываете выгоду и не спешите раскрывать намерения.'
- id: callous
  name: Эмоциональная отстранённость
  high: слабый отклик на чужие переживания
  low: живой отклик на чужие чувства
  bands:
  - from: 0
    label: низкая
    text: Вы живо отзываетесь на чужие переживания.
  - from: 40
    label: средняя
    text: Вы сочувствуете, но умеете держать дистанцию.
  - from: 70
    label: высокая
    text: Чужие переживания задевают вас мало, а чувство вины возникает редко.
questions:
- id: q1
  text: Мне важно, чтобы меня замечали.
  scales:
  - scale: narc
- id: q2
  text: Я заслуживаю большего признания, чем получаю.
  scales:
  - scale: narc
- id: q3
  text: Я не люблю быть в центре внимания.
  scales:
  - scale: narc
    reverse: true
- id: q4
  text: Люди часто недооценивают мои способности.
  scales:
  - scale: narc
- id: q5
  text: Мне нравится, когда меня хвалят публично.
  scales:
  - scale: narc
- id: q6
  text: Я считаю себя обычным человеком, не лучше других.
  scales:
  - scale: narc
    reverse: true
- id: q7
  text: Полезно знать слабые места людей.
  scales:
  - scale: mach
- id: q8
  text: Не стоит раскрывать свои настоящие мотивы.
  scales:
  - scale: mach
- id: q9
  text: Я говорю людям прямо, что думаю и чего хочу.
  scales:
  - scale: mach
    reverse: true
- id: q10
  text: Большинством людей можно управлять, если знать подход.
  scales:
  - scale: mach
- id: q11
  text: Я планирую разговоры заранее, чтобы получить нужный результат.
  scales:
  - scale: mach
- id: q12
  text: Честность важнее выгоды, даже когда это дорого стоит.
  scales:
  - scale: mach
    reverse: true
- id: q13
  text: Чужие переживания редко меня трогают.
  scales:
  - scale: callous
- id: q14
  text: Я расстраиваюсь, когда кому-то плохо.
  scales:
  - scale: callous
    reverse: true
- id: q15
  text: Я редко чувствую вину.
  scales:
  - scale: callous
- id: q16
  text: Мне бывает трудно смотреть, как человеку тяжело.
  scales:
  - scale: callous
    reverse: true
- id: q17
  text: Извиняться — обычно пустая формальность.
  scales:
  - scale: callous
- id: q18
  text: Я стараюсь не делать больно людям, даже когда это мне мешает.
  scales:
  - scale: callous
    reverse: true
crisis: []
selfHelp:
- 'Умеренные значения по этим шкалам — норма, а не тревожный знак: расчётливость помогает вести переговоры, а способность
  не сливаться с чужими эмоциями нужна в помогающих профессиях.'
- 'Полезнее смотреть не на балл, а на цену: если ваша стратегия в отношениях приносит результат, но вокруг не остаётся людей,
  с которыми можно быть настоящим, — это и есть повод для разговора со специалистом.'
- Не применяйте результат к другим. Соблазн «продиагностировать» партнёра или начальника по такому тесту велик, но ярлык обычно
  закрывает разговор вместо того, чтобы его начать.
