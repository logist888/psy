crisis: []
selfHelp:
  - >-
    Выпишите на бумагу все незакрытые дела и на этой неделе закройте три самых старых — даже если сделаете их не
    идеально.
  - >-
    Заведите одно место для задач (блокнот или заметки в телефоне) и раз в день, вечером, вносите туда всё, что всплыло
    за день.
  - Для дела, за которое трудно взяться, поставьте таймер на 15 минут и разрешите себе остановиться, когда он прозвенит.
