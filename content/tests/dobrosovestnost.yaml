slug: dobrosovestnost
version: 1.0.0
title: Тест на добросовестность
seoTitle: Тест на добросовестность онлайн — бесплатно, 20 вопросов
description: >-
  Шкала показывает, насколько вы организованы, держитесь планов и доводите начатое до конца. 20 вопросов, около 5 минут.
  Это самоотчёт для размышления, а не диагностика.
category: personality
ctaCluster: self
minutes: 5
passport:
  measures: >-
    Шкала показывает, насколько человек склонен планировать, соблюдать договорённости с собой и доводить начатые дела до
    конца.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт
    «добросовестность». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.90 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: добросовестность
    high: планирую заранее и довожу начатое до конца
    low: живу по обстоятельствам, начатое часто остаётся незакрытым
    bands:
      - from: 0
        label: низкая
        text: >-
          Вы больше живёте по ситуации, чем по расписанию. Планы легко уступают настроению и новым обстоятельствам,
          поэтому часть дел остаётся незакрытой, а к дедлайнам приходится догонять. Сильная сторона здесь настоящая: вы
          гибки, быстро меняете курс и не тратите силы на лишний порядок там, где он не нужен. Цена — накопившиеся
          хвосты и ощущение, что вы всё время что-то догоняете. Это ориентир, а не измерение: посмотрите, где именно
          расхождение между «собирался» и «сделал» мешает больше всего.
      - from: 40
        label: средняя
        text: >-
          У вас рабочее сочетание порядка и гибкости. В том, что для вас важно, вы обычно доводите дело до конца, а в
          мелочах позволяете себе не идеальничать. Скорее всего, всё держится не на системе, а на интересе и внешних
          сроках: когда мотивация проседает, дела начинают буксовать. Сильная сторона — вы не зажаты правилами и
          способны перестроиться. Цена — результат заметно зависит от того, насколько тема вас зацепила.
      - from: 70
        label: высокая
        text: >-
          Вы человек плана: сроки, детали и данные обещания для вас значат много, и на вас можно положиться. Такой стиль
          хорошо оплачивается в работе и учёбе — меньше хаоса, выше качество, реже сюрпризы. Цена тоже есть: сложно
          отпустить контроль, трудно работать в неопределённости, легко переработать и раздражаться на тех, кто
          относится к срокам иначе. Иногда порядок ради порядка съедает время, которое можно было потратить на суть.
          Стоит следить, чтобы аккуратность оставалась инструментом, а не обязанностью.
