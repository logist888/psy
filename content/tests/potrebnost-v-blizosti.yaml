slug: potrebnost-v-blizosti
version: 1.0.0
title: Тест на потребность в близости
seoTitle: Тест на потребность в близости онлайн — бесплатно, 10 вопросов
description: >-
  Показывает, насколько сильно вам нужны тёплые связи, компания и открытость с людьми. 10 вопросов, около 3 минут. Это
  самоотчёт, а не диагностика.
category: relationships
ctaCluster: relationships
minutes: 3
passport:
  measures: Шкала показывает, насколько сильна ваша потребность в тёплом общении и близких связях.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт «потребность в
    близости». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.85 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: потребность в близости
    high: тянется к людям и быстро сближается
    low: ценит автономию и держит дистанцию
    bands:
      - from: 0
        label: низкая
        text: >-
          Вам хорошо наедине с собой; общения нужно немного, и открываетесь вы не сразу. Это даёт независимость и
          устойчивость — чужое мнение качает вас слабее. Цена — связи приходится поддерживать сознательно, иначе они
          тихо истончаются.
      - from: 40
        label: средняя
        text: >-
          Вам нужны и люди, и тишина, и вы неплохо чувствуете, чего сейчас больше. Открываетесь постепенно, но наглухо
          не закрываетесь. Иногда середина превращается в дрейф: близкие ждут вашей инициативы, а вы ждёте подходящего
          повода.
      - from: 70
        label: высокая
        text: >-
          Вы легко сближаетесь, много говорите и быстро делитесь тем, что чувствуете. Вокруг вас обычно есть люди, а
          долгое одиночество переносится тяжело. Обратная сторона — можно открыться раньше, чем разобрались, кому, и
          незаметно набрать чужих настроений.
questions:
  - id: q1
    text: Легко завожу друзей.
    scales:
      - scale: total
  - id: q2
    text: Люблю поболтать.
    scales:
      - scale: total
  - id: q3
    text: Люблю быть частью компании.
    scales:
      - scale: total
  - id: q4
    text: Схожусь с людьми быстро.
    scales:
      - scale: total
  - id: q5
    text: Открыто говорю о своих чувствах.
    scales:
      - scale: total
  - id: q6
    text: Хочу, чтобы меня оставили в покое.
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Избегаю общения с людьми.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Открываюсь людям очень медленно.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Держу людей на расстоянии.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Стараюсь не появляться в компаниях.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - 'Держите ритм, а не поводы: короткое сообщение раз в неделю сохраняет связь лучше, чем редкие длинные встречи.'
  - 'Открываясь новому человеку, идите порциями и смотрите, отвечает ли он тем же: взаимность важнее скорости сближения.'
  - >-
    Если общения нужно много, заранее ставьте себе тихие часы в календарь — одиночество по расписанию переносится куда
    легче случайного.
