slug: vspylchivost
version: 1.0.0
title: Тест на вспыльчивость
seoTitle: Тест на вспыльчивость онлайн — бесплатно, 10 вопросов
description: >-
  Шкала гнева IPIP: 10 утверждений о раздражительности, вспышках злости и умении держать себя в руках. Занимает около 2
  минут, результат с пояснением сразу.
category: personality
ctaCluster: self
minutes: 3
passport:
  measures: Насколько легко у вас вспыхивает раздражение и злость и насколько трудно их сдержать.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт
    «Вспыльчивость». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.88 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: Вспыльчивость
    high: быстро вспыхиваете и медленно остываете
    low: редко злитесь и легко держите себя в руках
    bands:
      - from: 0
        label: низкая
        text: >-
          Вас трудно вывести из себя: раздражение возникает редко и быстро проходит. В конфликтах вы обычно держите
          ровный тон, и людям рядом с вами спокойно. Стоит проверить одно — не копится ли невысказанное раздражение
          внутри.
      - from: 40
        label: средняя
        text: >-
          Вы злитесь как большинство людей: на несправедливость, усталость и повторяющиеся мелочи. Обычно удаётся не
          выплеснуть это на окружающих, хотя иногда достаётся близким. Здесь гнев работает скорее как сигнал, чем как
          проблема.
      - from: 70
        label: высокая
        text: >-
          Реакция включается быстро, а остывание идёт медленнее, чем хотелось бы. Часто за этим стоит хроническая
          усталость, перегруз или нарушенные границы, а не плохой характер. Вспыльчивость хорошо поддаётся тренировке:
          меняется не темперамент, а промежуток между импульсом и действием.
questions:
  - id: q1
    text: Легко выхожу из себя.
    scales:
      - scale: total
  - id: q2
    text: Быстро раздражаюсь.
    scales:
      - scale: total
  - id: q3
    text: Легко расстраиваюсь из-за мелочей.
    scales:
      - scale: total
  - id: q4
    text: Часто бываю не в духе.
    scales:
      - scale: total
  - id: q5
    text: Могу сорваться и накричать.
    scales:
      - scale: total
  - id: q6
    text: Редко раздражаюсь.
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Почти никогда не злюсь.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Не завожусь по пустякам.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Сохраняю хладнокровие.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Редко жалуюсь.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Отслеживайте не саму вспышку, а то, что было за десять минут до неё: голод, недосып, незакрытый разговор. Гнев почти
    всегда стоит на фундаменте из усталости, и убирать удобнее фундамент.
  - >-
    Заведите фразу-паузу вместо первой реакции: «Мне нужно две минуты, я вернусь к этому». Возвращаться обязательно —
    иначе вы сами перестанете доверять этой паузе.
  - >-
    Если вспышки приводят к разрушенным отношениям, испорченным вещам или вы боитесь себя в такие моменты — есть смысл
    обратиться к психологу. Управление гневом хорошо поддаётся обучению.
