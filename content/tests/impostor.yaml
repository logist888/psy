slug: impostor
version: 1.0.0
title: Тест на синдром самозванца
seoTitle: Тест на синдром самозванца онлайн — бесплатно и анонимно
description: Насколько сильно вы обесцениваете свои достижения и боитесь, что вас «раскроют». 14 утверждений, около 3 минут.
category: wellbeing
ctaCluster: self
minutes: 3
passport:
  measures: 'Выраженность переживания самозванца: приписывание успехов случаю, страх разоблачения и обесценивание собственной
    компетентности.'
  origin: Собственная разработка проекта на основе описания феномена самозванца (Клэнс и Аймс, 1978) как явления.
  rightsBasis: own_work
  rightsNote: Формулировки принадлежат проекту. Шкала Clance Impostor Phenomenon Scale защищена авторским правом и не воспроизводилась;
    описанный феномен как научная концепция не охраняется.
  reliability: Опросник новый и независимой проверки не проходил.
  limitations: 'Синдром самозванца — не диагноз и не расстройство: его нет ни в одной классификации болезней. Это описание
    распространённого переживания. Похожие ощущения дают тревожные состояния, депрессия, а также объективно недоброжелательная
    среда — и последнее опросник отличить не может.'
instruction: Вспомните свою работу или учёбу за последний год.
options:
- text: Совсем не про меня
  value: 0
- text: Скорее не про меня
  value: 1
- text: Скорее про меня
  value: 2
- text: Точно про меня
  value: 3
scales:
- id: total
  name: Переживание самозванца
  high: успехи не присваиваются, страх разоблачения силён
  low: достижения признаются своими
  bands:
  - from: 0
    label: низкое
    text: Вы признаёте свои достижения своими. Сомнения бывают, но не превращаются в убеждение, что вы обманщик.
  - from: 40
    label: заметное
    text: 'Знакомое многим состояние: успехи объясняются удачей, похвала вызывает неловкость. Обычно управляемо, но подтачивает.'
  - from: 70
    label: выраженное
    text: 'Ощущение обмана устойчивое, и оно дорого обходится: вы либо перерабатываете, чтобы «соответствовать», либо избегаете
      возможностей. Это переживание хорошо поддаётся работе со специалистом, потому что дело не в фактах, а в способе их истолкования.'
questions:
- id: q1
  text: Мне кажется, что я оказался на своём месте по счастливой случайности.
  scales:
  - scale: total
- id: q2
  text: Я боюсь, что однажды все поймут, что я знаю меньше, чем кажется.
  scales:
  - scale: total
- id: q3
  text: Похвалу за работу я принимаю спокойно.
  scales:
  - scale: total
    reverse: true
- id: q4
  text: Свои успехи я объясняю удачей или помощью других.
  scales:
  - scale: total
- id: q5
  text: Я считаю себя компетентным в своём деле.
  scales:
  - scale: total
    reverse: true
- id: q6
  text: Я работаю больше необходимого, чтобы никто не усомнился в моей компетентности.
  scales:
  - scale: total
- id: q7
  text: Мне неловко, когда меня хвалят.
  scales:
  - scale: total
- id: q8
  text: Я сравниваю себя с коллегами и всегда оказываюсь хуже.
  scales:
  - scale: total
- id: q9
  text: Я берусь за сложные задачи, потому что уверен, что справлюсь.
  scales:
  - scale: total
    reverse: true
- id: q10
  text: Я боюсь задавать вопросы, чтобы не показаться некомпетентным.
  scales:
  - scale: total
- id: q11
  text: Даже после успеха я думаю, что в следующий раз не получится.
  scales:
  - scale: total
- id: q12
  text: Я отказывался от возможностей, считая, что недостаточно хорош.
  scales:
  - scale: total
- id: q13
  text: Мои достижения кажутся мне заслуженными.
  scales:
  - scale: total
    reverse: true
- id: q14
  text: Ошибка для меня — доказательство, что я не на своём месте.
  scales:
  - scale: total
crisis: []
selfHelp:
- 'Ведите список фактов, а не ощущений: что конкретно вы сделали, какие задачи решили, что сказали коллеги. Переживание самозванца
  питается избирательной памятью — провалы помнятся, успехи объясняются обстоятельствами.'
- Проверьте стандарт, по которому себя судите. Часто он взят у самого опытного человека в поле зрения, а не у того, кто на
  вашей позиции и с вашим стажем.
- 'Скажите вслух кому-то, кому доверяете. Переживание самозванца держится на секретности: почти всегда оказывается, что собеседник
  чувствует похожее.'
- Различайте переживание и среду. Если вам постоянно обесценивают работу, дело может быть не в вашем восприятии, а в конкретных
  людях вокруг.
