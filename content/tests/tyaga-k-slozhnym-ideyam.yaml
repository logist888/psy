slug: tyaga-k-slozhnym-ideyam
version: 1.0.0
title: Тест на тягу к сложным идеям
seoTitle: Тест на тягу к сложным идеям онлайн — бесплатно, 10 вопросов
description: >-
  Шкала IPIP из 10 утверждений: насколько вам интересно думать, разбираться в сложном и обсуждать идеи. Это про интерес,
  а не про уровень интеллекта. Около 2 минут.
category: personality
ctaCluster: self
minutes: 3
passport:
  measures: Насколько человеку интересны сложные задачи, абстрактные идеи и сам процесс размышления.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт «тяга к
    сложным идеям». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.86 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: тяга к сложным идеям
    high: любит сложные задачи и разговоры об идеях
    low: предпочитает конкретное и прикладное
    bands:
      - from: 0
        label: низкая
        text: >-
          Вам ближе конкретные, прикладные задачи, чем отвлечённые рассуждения. Это экономит силы и часто делает вас
          практичнее тех, кто увлекается теорией. Речь об интересе и привычках, а не о способностях: сложное становится
          доступнее, когда его объясняют через примеры.
      - from: 40
        label: умеренная
        text: >-
          Вы охотно думаете и разбираетесь, когда тема цепляет, но не ищете сложность специально. Легко переключаетесь
          между «поразмышлять» и «сделать». Такой профиль удобен там, где нужно и понимать, и внедрять.
      - from: 70
        label: сильная
        text: >-
          Вам нравится сам процесс мышления: трудные задачи, длинные тексты, споры об идеях. Это даёт глубину и умение
          держать в голове много информации. Обратная сторона — можно застрять в анализе или потерять собеседника,
          которому нужен простой ответ.
questions:
  - id: q1
    text: Люблю решать сложные задачи.
    scales:
      - scale: total
  - id: q2
    text: Люблю читать сложные тексты.
    scales:
      - scale: total
  - id: q3
    text: Владею богатым словарным запасом.
    scales:
      - scale: total
  - id: q4
    text: Легко справляюсь с большим объёмом информации.
    scales:
      - scale: total
  - id: q5
    text: Получаю удовольствие от размышлений.
    scales:
      - scale: total
  - id: q6
    text: Не интересуюсь абстрактными идеями.
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Избегаю разговоров о философии.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: С трудом понимаю отвлечённые идеи.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Скучаю в теоретических спорах.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Обхожу стороной трудное чтение.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Объясните сложную тему вслух за три минуты человеку не из этой области: место, где вы запнётесь, и есть непонятая
    вами часть.
  - >-
    Читайте «на четверть выше уровня»: текст, где непонятно примерно каждое пятое предложение, развивает лучше, чем
    совсем лёгкий или совсем трудный.
  - >-
    Если абстракции утомляют, переводите их в примеры, цифры и картинки — чаще дело в формате подачи, а не в
    способностях.
