slug: poryadochnost
version: 1.0.0
title: Тест на порядочность
seoTitle: Тест на порядочность онлайн — бесплатно, 10 вопросов
description: >-
  Шкала IPIP из 10 утверждений: насколько вы держитесь прямых способов добиваться своего — без хитрости, лести и
  давления. Занимает около 2 минут.
category: personality
ctaCluster: self
minutes: 3
passport:
  measures: Насколько человек предпочитает прямые и честные способы добиваться своего вместо хитрости и манипуляций.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт
    «порядочность». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.75 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: порядочность
    high: действует прямо и не хитрит ради выгоды
    low: гибко относится к правилам ради результата
    bands:
      - from: 0
        label: гибкая
        text: >-
          Вы спокойно относитесь к тому, чтобы обойти правило, надавить или подать себя выгоднее, если это ведёт к цели.
          Это даёт манёвренность в конкурентной среде, но со временем может стоить доверия — такие эпизоды люди хорошо
          запоминают. Полезно самому определить границу, которую вы не переходите.
      - from: 40
        label: умеренная
        text: >-
          Обычно вы играете честно, но в жёстких ситуациях допускаете тактическую гибкость. Правила для вас ориентир, а
          не абсолют. Подход практичный, если вы ясно понимаете, ради чего именно отступаете.
      - from: 70
        label: строгая
        text: >-
          Вы держитесь прямых способов: не хитрите, не давите и не изображаете чувств, которых нет. Это делает вас
          предсказуемым и надёжным партнёром, но лишает гибкости там, где другие спокойно торгуются. Бывает и цена в
          виде разочарования в людях, живущих по другим правилам.
questions:
  - id: q1
    text: Не стал бы обманывать налоговую.
    scales:
      - scale: total
  - id: q2
    text: Соблюдаю правила.
    scales:
      - scale: total
  - id: q3
    text: Пользуюсь лестью, чтобы добиться своего.
    scales:
      - scale: total
        reverse: true
  - id: q4
    text: Использую людей в своих целях.
    scales:
      - scale: total
        reverse: true
  - id: q5
    text: Знаю, как обойти правила.
    scales:
      - scale: total
        reverse: true
  - id: q6
    text: Могу схитрить ради выгоды.
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Давлю на людей.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Изображаю заботу о других.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Пользуюсь чужой слабостью.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Мешаю чужим планам.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Решите заранее, где ваша красная линия — что вы не сделаете даже ради крупной выгоды. В момент соблазна времени на
    размышления не будет.
  - >-
    Отличайте влияние от манипуляции простым тестом: было бы вам неловко, если бы человек узнал, зачем вы это сказали?
    Если да — это манипуляция.
  - >-
    Если правила для вас святы, раз в год пересматривайте их: ищите места, где следование букве вредит тем самым людям,
    ради которых правило и существует.
