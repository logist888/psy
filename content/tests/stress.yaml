slug: stress
version: 1.0.0
title: Тест на уровень напряжения и тревоги
seoTitle: "Тест на тревожность и стресс онлайн — бесплатно и анонимно"
description: Оцените, насколько сильно вы напряжены последние две недели и как это сказывается на теле и сне. 14 утверждений, около 4 минут.
category: wellbeing
ctaCluster: anxiety
minutes: 4
passport:
  measures: Уровень психоэмоционального напряжения за последние две недели по трём проявлениям — беспокойные мысли, телесное напряжение и нарушения сна и восстановления.
  origin: Собственная разработка проекта. Пункты написаны с нуля и не воспроизводят клинические опросники.
  rightsBasis: own_work
  rightsNote: Формулировки принадлежат проекту. Это не клиническая шкала и не адаптация чужой методики.
  reliability: Опросник новый и независимой психометрической проверки не проходил. Это ориентир для самонаблюдения, а не измерительный инструмент.
  limitations: Опросник не выявляет тревожное расстройство и не является скринингом. Похожие ощущения дают физические причины — от нехватки сна и кофеина до заболеваний щитовидной железы. Определить причину может только специалист.
instruction: Вспомните последние две недели. Насколько часто вы сталкивались с каждым из этих состояний?
options:
  - text: "Никогда"
    value: 0
  - text: "Несколько дней"
    value: 1
  - text: "Больше половины дней"
    value: 2
  - text: "Почти каждый день"
    value: 3
scales:
  - id: worry
    name: Беспокойные мысли
    high: мысли крутятся и не отключаются
    low: голова свободна, тревога не занимает день
    bands:
      - from: 0
        label: "низкий"
        text: "Беспокойство появляется по поводу и уходит. Мысли не захватывают день."
      - from: 40
        label: "умеренный"
        text: "Тревожные мысли возвращаются регулярно и заметно отвлекают, но вы всё ещё можете переключиться."
      - from: 70
        label: "высокий"
        text: "Мысли крутятся почти постоянно и плохо поддаются переключению. Такое напряжение редко проходит само и обычно требует поддержки."
  - id: body
    name: Телесное напряжение
    high: тело реагирует на стресс постоянно
    low: тело спокойно
    bands:
      - from: 0
        label: "низкий"
        text: "Тело в целом спокойно, телесных отголосков тревоги мало."
      - from: 40
        label: "умеренный"
        text: "Напряжение проявляется телесно — зажатые плечи, ком в горле, сбитое дыхание."
      - from: 70
        label: "высокий"
        text: "Тело живёт в постоянной готовности к опасности. Это изматывает физически и стоит обсудить со специалистом."
  - id: sleep
    name: Сон и восстановление
    high: сон нарушен, восстановления не происходит
    low: сон восстанавливает
    bands:
      - from: 0
        label: "низкий"
        text: "Сон в порядке и выполняет свою работу — вы просыпаетесь отдохнувшим."
      - from: 40
        label: "умеренный"
        text: "Сон стал хуже: трудно засыпать или вы просыпаетесь неотдохнувшим."
      - from: 70
        label: "высокий"
        text: "Сон почти не восстанавливает. Это одновременно и следствие напряжения, и его усилитель — обычно с этого и стоит начинать."
questions:
  - id: q1
    text: "Я не мог перестать беспокоиться или контролировать беспокойство."
    scales:
      - scale: worry
  - id: q2
    text: "Я прокручивал в голове разговоры и ситуации снова и снова."
    scales:
      - scale: worry
  - id: q3
    text: "Мне было трудно сосредоточиться из-за тревожных мыслей."
    scales:
      - scale: worry
  - id: q4
    text: "Я ждал, что случится что-то плохое."
    scales:
      - scale: worry
  - id: q5
    text: "Я легко раздражался по мелочам."
    scales:
      - scale: worry
  - id: q6
    text: "Я замечал напряжение в теле — плечах, шее, челюсти."
    scales:
      - scale: body
  - id: q7
    text: "У меня учащалось сердцебиение без физической нагрузки."
    scales:
      - scale: body
  - id: q8
    text: "Мне не хватало воздуха или было трудно глубоко вдохнуть."
    scales:
      - scale: body
  - id: q9
    text: "Я чувствовал дрожь, слабость или ком в горле."
    scales:
      - scale: body
  - id: q10
    text: "Мне было трудно расслабиться, даже когда было время."
    scales:
      - scale: body
  - id: q11
    text: "Мне было трудно заснуть из-за мыслей."
    scales:
      - scale: sleep
  - id: q12
    text: "Я просыпался ночью и не мог снова уснуть."
    scales:
      - scale: sleep
  - id: q13
    text: "Утром я просыпался разбитым, как будто не спал."
    scales:
      - scale: sleep
  - id: q14
    text: "Я чувствовал себя отдохнувшим после сна."
    scales:
      - scale: sleep
        reverse: true
crisis: []
selfHelp:
  - "Начните с дыхания, а не с мыслей: медленный выдох длиннее вдоха в течение двух-трёх минут снижает телесную реакцию быстрее, чем попытки успокоить себя доводами."
  - Ограничьте тревожные мысли по времени, а не по содержанию. Отведённые 15 минут в день на беспокойство работают лучше, чем попытки не думать вовсе.
  - "Проверьте очевидное: недосып, кофеин, алкоголь и отсутствие движения усиливают тревогу физиологически, независимо от того, что происходит в жизни."
  - Если напряжение держится дольше месяца или мешает работать и спать, стоит обратиться к специалисту. Это не «слабость» — это тот случай, когда помощь ускоряет дело в разы.
