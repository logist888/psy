slug: akkuratnost
version: 1.0.0
title: Тест на аккуратность
seoTitle: Тест на аккуратность онлайн — бесплатно, 10 вопросов
description: >-
  Онлайн-тест на аккуратность по шкале IPIP: 10 утверждений о порядке в вещах, планах и делах. Занимает около 3 минут,
  результат — самооценка, а не взгляд со стороны.
category: personality
ctaCluster: self
minutes: 3
passport:
  measures: Шкала измеряет, насколько человеку важен порядок в вещах и делах и насколько он его поддерживает.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт
    «аккуратность». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.82 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: аккуратность
    high: любите порядок и планы, замечаете любую неразбериху
    low: спокойно живёте среди беспорядка
    bands:
      - from: 0
        label: низкая
        text: >-
          Беспорядок вас не тревожит, и вы легко работаете там, где вещи лежат как лежат. Это даёт свободу: силы не
          уходят на поддержание формы там, где важна суть. Цена — время на поиски нужного и то, что более аккуратные
          люди рядом могут читать это как неуважение к общему пространству.
      - from: 40
        label: средняя
        text: >-
          Порядок вы поддерживаете там, где он реально помогает, и не гонитесь за идеалом в остальном. Обычно у вас есть
          свои островки системы — рабочий стол, календарь или деньги. Полный порядок наступает волнами, и вас это
          устраивает.
      - from: 70
        label: высокая
        text: >-
          Вы любите, когда всё на своих местах, и заранее раскладываете дела по плану. На такой системе удобно строить
          долгие проекты: вы почти ничего не теряете и не забываете. Цена — чужой беспорядок раздражает сильнее, чем
          того стоит, а планы плохо переносят внезапные изменения.
questions:
  - id: q1
    text: Люблю порядок.
    scales:
      - scale: total
  - id: q2
    text: Люблю наводить чистоту.
    scales:
      - scale: total
  - id: q3
    text: Хочу, чтобы всё было именно так, как надо.
    scales:
      - scale: total
  - id: q4
    text: Люблю порядок и постоянство.
    scales:
      - scale: total
  - id: q5
    text: Делаю дела по плану.
    scales:
      - scale: total
  - id: q6
    text: Часто забываю положить вещь на место.
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Оставляю в комнате беспорядок.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Разбрасываю свои вещи где попало.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Спокойно отношусь к неряшливым людям.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Спокойно переношу беспорядок.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Выберите две-три зоны, где порядок реально окупается — документы, деньги, рабочие файлы, — и осознанно отпустите
    остальные. Тотальный порядок стоит дороже, чем даёт.
  - >-
    Для вещей, которые вечно теряются, заведите одно место возврата и правило «в конце дня всё туда». Работает лучше,
    чем генеральная уборка раз в месяц.
  - >-
    Если план сорвался, перепишите его целиком, а не спасайте старый. Сопротивление обычно вызывает не новая задача, а
    несоответствие плану, которого уже нет.
