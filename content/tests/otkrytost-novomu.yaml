slug: otkrytost-novomu
version: 1.0.0
title: Тест на открытость новому
seoTitle: Тест на открытость новому онлайн — бесплатно, 10 вопросов
description: >-
  Шкала IPIP из 10 утверждений: насколько легко вам даются перемены, новые места, вкусы и занятия. Занимает около 2
  минут, результат — сразу.
category: personality
ctaCluster: self
minutes: 3
passport:
  measures: Насколько человек тянется к переменам и разнообразию или предпочитает привычное и проверенное.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт «открытость
    новому». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.77 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: открытость новому
    high: тянется к переменам и разнообразию
    low: держится привычного и проверенного
    bands:
      - from: 0
        label: низкая
        text: >-
          Вы цените проверенное и знакомый порядок: меньше сюрпризов, больше устойчивости. Это делает вас надёжным в
          долгих делах, но возможности иногда проходят мимо — «и так работает». Помогает добавлять новизну маленькими
          дозами там, где цена ошибки невелика.
      - from: 40
        label: умеренная
        text: >-
          Вы открыты новому, когда видите смысл, но не гонитесь за переменами ради перемен. Часть привычек храните,
          часть спокойно меняете. Такой режим даёт и стабильность, и развитие.
      - from: 70
        label: высокая
        text: >-
          Вас тянет к новому: места, идеи, форматы, вкусы. Вы быстро адаптируетесь и легко стартуете, но рутина
          утомляет, а начатое рискует остаться незаконченным. Сила такого профиля раскрывается, когда рядом есть
          система, удерживающая длинные дела.
questions:
  - id: q1
    text: Предпочитаю разнообразие рутине.
    scales:
      - scale: total
  - id: q2
    text: Люблю бывать в новых местах.
    scales:
      - scale: total
  - id: q3
    text: Интересуюсь самыми разными вещами.
    scales:
      - scale: total
  - id: q4
    text: Люблю начинать новое.
    scales:
      - scale: total
  - id: q5
    text: Предпочитаю держаться того, что уже знаю.
    scales:
      - scale: total
        reverse: true
  - id: q6
    text: Не люблю перемены.
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Напрягаюсь от одной мысли о переменах.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Живу по накатанной.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Не люблю пробовать незнакомую еду.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Ценю привычный порядок вещей.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Правило «одно новое в неделю»: маршрут, блюдо, собеседник. Маленькая новизна тренирует переносимость перемен, ничем
    не рискуя.
  - >-
    Перед отказом от изменения спросите себя письменно: «это невыгодно или просто непривычно?» — на бумаге разница
    видна, в голове почти никогда.
  - >-
    Любителям нового: доводите до конца хотя бы один начатый проект в квартал — новизна окупается, только если что-то
    доживает до результата.
