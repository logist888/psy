slug: interes-k-rabote-rukami
version: 1.0.0
title: Тест на интерес к работе руками
seoTitle: Тест на интерес к работе руками онлайн — бесплатно, 10 вопросов
description: >-
  Бесплатный тест из 10 вопросов о том, насколько вам интересна работа руками: техника, стройка, инструменты, земля,
  растения и животные. Без регистрации.
category: career
ctaCluster: career
minutes: 3
passport:
  measures: >-
    Шкала показывает, насколько вам интересны занятия с осязаемым результатом: работа с инструментами и техникой,
    стройка, земля, растения и животные.
  origin: >-
    Шкала опросника профессиональных интересов ORVIS (Oregon Vocational Interest Scales; Pozzebon, Visser, Ashton, Lee &
    Goldberg, 2010) из международного пула пунктов IPIP, измеряющая конструкт «интерес к работе руками». Русский перевод
    выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    Ни коэффициент надёжности англоязычного оригинала, ни проверка русского перевода не опубликованы — относитесь к
    результату как к поводу подумать, а не к измерению.
  limitations: >-
    Шкала показывает интерес, а не способности и не пригодность к профессии: нравится — не то же самое, что получается.
    Нормы российской выборки не собраны, вы видите процент от максимума шкалы, а не сравнение с другими людьми, поэтому
    читайте результат как повод присмотреться к направлению, а не как рекомендацию по выбору работы.
instruction: >-
  Оценивайте, насколько вам нравится такая деятельность, независимо от того, умеете вы это или нет и сколько за это
  платят.
options:
  - text: Совсем не нравится
    value: 0
  - text: Скорее не нравится
    value: 1
  - text: Скорее нравится
    value: 2
  - text: Очень нравится
    value: 3
scales:
  - id: total
    name: интерес к работе руками
    high: тянет работать руками, с техникой, землёй и животными
    low: ручной и полевой труд не увлекает
    bands:
      - from: 0
        label: низкий
        text: >-
          Работа с инструментами, техникой, землёй и животными вас скорее не зовёт. Ремонт, стройка, огород или уход за
          скотом выглядят для вас как обязанность, а не как отдых. Низкий балл здесь ничего не говорит о ваших руках и
          не означает, что вы не сможете починить или вырастить: это только про интерес к такому виду деятельности.
          Нравится и получается — разные вещи, и многие делают всё это умело, но без всякого удовольствия. Скорее всего,
          силы вы охотнее вкладываете туда, где результат не измеряется в вёдрах, метрах и деталях.
      - from: 40
        label: средний
        text: >-
          Работа руками вам в целом понятна и местами приятна, но выбирать её как главное занятие вы вряд ли будете.
          Возможно, вам нравится что-то одно — например, возиться с растениями или чинить своё, а не всё подряд. Средний
          балл часто у тех, для кого это хороший противовес к остальной жизни: поработал головой, потом руками. Учтите,
          что интерес не равен способностям: можно любить мастерить и делать это средне, а можно наоборот. Посмотрите,
          какие именно пункты набрали больше — там и есть ваша территория.
      - from: 70
        label: высокий
        text: >-
          Вас притягивает осязаемое дело: инструменты, техника, стройка, земля, растения, животные. Результат, который
          можно потрогать, для вас важнее абстрактных задач. Это повод присмотреться к направлениям, где ценят руки и
          практическую смекалку — от ремонта и производства до агрономии, лесного дела и работы с животными, — но не
          готовый ответ, какую профессию выбрать. Высокий интерес не заменяет квалификации: нравится и получается —
          разные вещи, и мастерство здесь набирается только практикой. Начните с малого и посмотрите, держится ли
          интерес через месяц.
questions:
  - id: q1
    text: Ухаживать за скотом или лошадьми
    scales:
      - scale: total
  - id: q2
    text: Работать фермером
    scales:
      - scale: total
  - id: q3
    text: Строить новые здания
    scales:
      - scale: total
  - id: q4
    text: Работать лесником
    scales:
      - scale: total
  - id: q5
    text: Выращивать растения
    scales:
      - scale: total
  - id: q6
    text: Гулять на природе
    scales:
      - scale: total
  - id: q7
    text: Столярничать, работать с деревом
    scales:
      - scale: total
  - id: q8
    text: Разводить цветы
    scales:
      - scale: total
  - id: q9
    text: Ремонтировать легковые или грузовые машины
    scales:
      - scale: total
  - id: q10
    text: Работать с инструментами и техникой
    scales:
      - scale: total
crisis: []
selfHelp:
  - >-
    На выходных возьмите одну ручную задачу целиком: почините что-то в доме, соберите мебель, пересадите растения — и
    отследите, устали вы или, наоборот, взбодрились.
  - >-
    Договоритесь провести полдня рядом с человеком, который работает руками: в автосервисе, столярке, теплице, питомнике
    или на ферме у знакомых.
  - >-
    Запишитесь на разовое занятие в столярной или слесарной мастерской, на курс садоводства либо волонтёрскую смену в
    приюте для животных.
