slug: interes-k-issledovatelskoy-rabote
version: 1.0.0
title: Тест на интерес к исследовательской работе
seoTitle: Тест на интерес к исследовательской работе — бесплатно, 10 вопросов
description: >-
  Шкала опросника профессиональных интересов ORVIS: 10 занятий из мира науки, расчётов и экспериментов. Показывает,
  насколько вам интересна такая работа, а не насколько она удаётся.
category: career
ctaCluster: career
minutes: 3
passport:
  measures: >-
    Шкала показывает, насколько человека привлекают занятия, связанные с наукой, расчётами, экспериментами и разбором
    сложных задач.
  origin: >-
    Шкала опросника профессиональных интересов ORVIS (Oregon Vocational Interest Scales; Pozzebon, Visser, Ashton, Lee &
    Goldberg, 2010) из международного пула пунктов IPIP, измеряющая конструкт «интерес к исследовательской работе».
    Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    Ни коэффициент надёжности англоязычного оригинала, ни проверка русского перевода не опубликованы — относитесь к
    результату как к поводу подумать, а не к измерению.
  limitations: >-
    Шкала показывает интерес, а не способности и не пригодность к профессии: нравится — не то же самое, что получается.
    Нормы российской выборки не собраны, вы видите процент от максимума шкалы, а не сравнение с другими людьми, поэтому
    читайте результат как повод присмотреться к направлению, а не как рекомендацию по выбору работы.
instruction: >-
  Оценивайте, насколько вам нравится такая деятельность, независимо от того, умеете вы это или нет и сколько за это
  платят.
options:
  - text: Совсем не нравится
    value: 0
  - text: Скорее не нравится
    value: 1
  - text: Скорее нравится
    value: 2
  - text: Очень нравится
    value: 3
scales:
  - id: total
    name: интерес к исследовательской работе
    high: интересно разбираться, считать и исследовать
    low: исследовательские задачи привлекают мало
    bands:
      - from: 0
        label: низкий
        text: >-
          Наука, расчёты и разбор сложных задач вас скорее не увлекают. Возможно, вам интереснее делать что-то руками,
          работать с людьми или создавать образы, чем подолгу докапываться до причин. Низкий балл не означает нехватку
          ума: это про вкус к типу занятий, а не про способности. Многие люди отлично считают и анализируют, когда
          нужно, просто не выбирают такие задачи по своей воле.
      - from: 40
        label: средний
        text: >-
          Аналитические занятия вам интересны, но не поглощают целиком. Скорее всего, вы охотно разберётесь в цифрах или
          устройстве системы, если это нужно для дела, но не станете копать ради самого процесса. Такой профиль удобен
          там, где анализ соседствует с чем-то ещё: аналитика в бизнесе, преподавание, продуктовая или инженерная
          работа. Помните, что интерес и способности — не одно и то же, и одно без другого встречается сплошь и рядом.
      - from: 70
        label: высокий
        text: >-
          Вам заметно нравится разбираться: искать закономерности, проверять гипотезы, считать и объяснять устройство
          вещей. Это повод присмотреться к направлениям, где такое занятие оплачивается: исследования, анализ данных,
          инженерия, статистика, научная журналистика. Высокий балл — не обещание успеха: в науке и аналитике многое
          решают базовая подготовка, усидчивость и умение доводить работу до конца, а интерес лишь даёт топливо.
          Проверьте себя на реальной задаче, а не на предвкушении.
questions:
  - id: q1
    text: Быть химиком
    scales:
      - scale: total
  - id: q2
    text: Продумывать лабораторный эксперимент
    scales:
      - scale: total
  - id: q3
    text: Быть математиком
    scales:
      - scale: total
  - id: q4
    text: Объяснять другим научные понятия
    scales:
      - scale: total
  - id: q5
    text: Быть физиком
    scales:
      - scale: total
  - id: q6
    text: Проводить медицинские исследования
    scales:
      - scale: total
  - id: q7
    text: Работать научным журналистом
    scales:
      - scale: total
  - id: q8
    text: Решать сложные головоломки
    scales:
      - scale: total
  - id: q9
    text: Разрабатывать компьютерную программу
    scales:
      - scale: total
  - id: q10
    text: Быть статистиком
    scales:
      - scale: total
crisis: []
selfHelp:
  - >-
    Возьмите одну открытую задачу — учебный набор данных на Kaggle или задачу с Project Euler — и доведите её до
    готового решения: интерес к анализу проверяется именно этим.
  - >-
    Прочитайте за неделю два обзорных материала по цепляющей теме — например, на «Элементах» или N + 1 — и перескажите
    один из них своими словами кому-нибудь вслух.
  - >-
    Сходите на открытую лекцию или семинар в вуз либо посмотрите запись и выпишите три вопроса, которые остались:
    желание копать дальше — хороший индикатор.
