    scales:
      - scale: total
crisis: []
selfHelp:
  - >-
    Запишитесь на одно пробное занятие с контролируемым риском — скалодром, картинг, прыжковая вышка в бассейне — и
    понаблюдайте за собой до и после.
  - >-
    Сходите в однодневный поход или на длинную велопрогулку: выносливость и бытовые неудобства составляют большую часть
    любого «приключения», и лучше узнать это заранее.
  - >-
    Поговорите с тем, для кого риск — работа: спасателем, тренером, действующим спортсменом. Спрашивайте про рутину,
    травмы и восстановление, а не про яркие моменты.
