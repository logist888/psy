slug: interes-k-rabote-s-riskom
version: 1.0.0
title: Тест на интерес к работе с риском
seoTitle: Тест на интерес к работе с риском — бесплатно, 10 вопросов
description: >-
  Шкала опросника профессиональных интересов ORVIS: 10 занятий, связанных с риском, спортом и физическими испытаниями.
  Показывает силу интереса к такой работе, а не готовность к ней.
category: career
ctaCluster: career
minutes: 3
passport:
  measures: >-
    Шкала показывает, насколько человека привлекают занятия с риском, физической нагрузкой, соревнованием и высокой
    долей непредсказуемости.
  origin: >-
    Шкала опросника профессиональных интересов ORVIS (Oregon Vocational Interest Scales; Pozzebon, Visser, Ashton, Lee &
    Goldberg, 2010) из международного пула пунктов IPIP, измеряющая конструкт «интерес к работе с риском». Русский
    перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    Ни коэффициент надёжности англоязычного оригинала, ни проверка русского перевода не опубликованы — относитесь к
    результату как к поводу подумать, а не к измерению.
  limitations: >-
    Шкала показывает интерес, а не способности и не пригодность к профессии: нравится — не то же самое, что получается.
    Нормы российской выборки не собраны, вы видите процент от максимума шкалы, а не сравнение с другими людьми, поэтому
    читайте результат как повод присмотреться к направлению, а не как рекомендацию по выбору работы.
instruction: >-
  Оценивайте, насколько вам нравится такая деятельность, независимо от того, умеете вы это или нет и сколько за это
  платят.
options:
  - text: Совсем не нравится
    value: 0
  - text: Скорее не нравится
    value: 1
  - text: Скорее нравится
    value: 2
  - text: Очень нравится
    value: 3
scales:
  - id: total
    name: интерес к работе с риском
    high: тянет к риску, движению и физическим испытаниям
    low: ближе спокойный и предсказуемый ритм
    bands:
      - from: 0
        label: низкий
        text: >-
          Риск, соревнование и физические испытания вас притягивают слабо. Скорее всего, вам ближе занятия, где
          результат предсказуем, а вечер заканчивается без адреналина. Это не осторожность как недостаток и не
          отсутствие смелости: низкий балл говорит лишь о том, что подобные ситуации вы не ищете специально. Интерес и
          способности здесь тоже расходятся — человек может прекрасно действовать в экстремальной ситуации, вовсе не
          стремясь в неё попасть.
      - from: 40
        label: средний
        text: >-
          Приключения и риск вам интересны в умеренной дозе. Вероятно, вы рады походу, соревнованию или новому маршруту,
          но не хотите, чтобы напряжение и непредсказуемость были фоном каждого дня. Такой профиль хорошо сочетается с
          обычной работой и активным хобби рядом с ней. Стоит помнить, что нравится и получается — разные вещи:
          физическая форма и навыки набираются тренировкой, а не интересом.
      - from: 70
        label: высокий
        text: >-
          Вас заметно тянет к движению, соревнованию и ситуациям, где есть настоящий риск. Это повод присмотреться к
          направлениям вроде спорта, спасательных и силовых служб, экспедиционной работы или профессий, связанных с
          полем и дорогой. Высокий балл ничего не гарантирует: в таких занятиях решают подготовка, здоровье и
          дисциплина, а тяга к острым ощущениям без этого скорее опасна. Разумный шаг — наращивать нагрузку постепенно и
          в местах, где риск контролируется.
questions:
  - id: q1
    text: Профессионально заниматься спортом
    scales:
      - scale: total
  - id: q2
    text: Пускаться в захватывающие приключения
    scales:
      - scale: total
  - id: q3
    text: Выживать в дикой природе
    scales:
      - scale: total
  - id: q4
    text: Быть автогонщиком
    scales:
      - scale: total
  - id: q5
    text: Сталкиваться с физической опасностью
    scales:
      - scale: total
  - id: q6
    text: Быть офицером в армии
    scales:
      - scale: total
  - id: q7
    text: Участвовать в спортивных соревнованиях
    scales:
      - scale: total
  - id: q8
    text: Ловить преступников за вознаграждение
    scales:
      - scale: total
  - id: q9
    text: Ездить на велосипеде на дальние дистанции
    scales:
