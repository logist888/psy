slug: personality-type
version: 1.0.0
title: Тест на тип личности
seoTitle: Тест на тип личности онлайн — бесплатно, 24 вопроса
description: 'Четыре пары предпочтений по модели Юнга: откуда берёте энергию, как воспринимаете информацию, как принимаете
  решения и как организуете жизнь. 24 утверждения, около 5 минут.'
category: personality
ctaCluster: self
minutes: 5
passport:
  measures: 'Четыре пары психологических предпочтений в традиции типологии Юнга: экстраверсия — интроверсия, конкретика —
    интуиция, логика — чувства, планирование — гибкость.'
  origin: 'Собственная разработка проекта на основе юнгианской модели предпочтений. Пункты написаны с нуля. Это не MBTI: товарные
    знаки The Myers-Briggs Company и текст их опросника не используются.'
  rightsBasis: own_work
  rightsNote: Формулировки принадлежат проекту. Юнгианская модель предпочтений как научная концепция авторским правом не охраняется,
    в отличие от конкретных опросников, её реализующих.
  reliability: 'Опросник новый и независимой психометрической проверки не проходил. Важная научная оговорка: типологические
    тесты этого семейства известны низкой устойчивостью результата — при повторном прохождении через несколько недель значительная
    доля людей получает другой тип. Причина в том, что предпочтения распределены непрерывно, а тип получается делением по
    границе: если ваш балл близок к середине шкалы, «тип» будет скакать.'
  limitations: 'Тест описывает предпочтения, а не способности и не потолок возможностей. Он не предсказывает успех в профессии
    и не годится для отбора кандидатов. Смотрите на проценты по шкалам, а не на четырёхбуквенный ярлык: близкие к 50% значения
    означают, что у вас нет выраженного предпочтения.'
instruction: Выбирайте то, что ближе к вашему обычному поведению, а не к тому, каким вы хотели бы быть.
options:
- text: Совсем не про меня
  value: 0
- text: Скорее не про меня
  value: 1
- text: Скорее про меня
  value: 2
- text: Точно про меня
  value: 3
scales:
- id: ei
  name: Экстраверсия — Интроверсия
  high: энергия приходит от общения и внешней активности
  low: энергия восстанавливается в тишине и наедине с собой
  bands:
  - from: 0
    label: интроверсия
    text: Вы восстанавливаетесь в одиночестве. После насыщенного общения нужна пауза, чтобы прийти в себя, и это не застенчивость,
      а способ обращения с энергией.
  - from: 40
    label: баланс
    text: Вам подходит и общение, и уединение — многое зависит от людей и состояния. Выраженного предпочтения нет.
  - from: 60
    label: экстраверсия
    text: Вы заряжаетесь от людей и событий. Долгое одиночество скорее опустошает, чем восстанавливает.
- id: sn
  name: Конкретика — Интуиция
  high: внимание к смыслам, связям и возможностям
  low: внимание к фактам, деталям и практике
  bands:
  - from: 0
    label: конкретика
    text: Вы опираетесь на факты и опыт. Абстрактные рассуждения без практического выхода кажутся вам пустыми.
  - from: 40
    label: баланс
    text: Вы переключаетесь между фактами и смыслами в зависимости от задачи.
  - from: 60
    label: интуиция
    text: Вас тянет к идеям, связям и возможностям. Детали интересны меньше, чем общая картина.
- id: tf
  name: Логика — Чувства
  high: решения через ценности и влияние на людей
  low: решения через анализ и объективные критерии
  bands:
  - from: 0
    label: логика
    text: Решая, вы отступаете на шаг и взвешиваете аргументы. Вас могут считать холодным, хотя вы просто отделяете задачу
      от эмоций.
  - from: 40
    label: баланс
    text: Вы учитываете и логику, и человеческие последствия, выбирая по ситуации.
  - from: 60
    label: чувства
    text: Решая, вы прежде всего смотрите, как это скажется на людях и совпадает ли с вашими ценностями.
- id: jp
  name: Планирование — Гибкость
  high: комфорт в открытых вариантах и спонтанности
  low: комфорт в решённом и запланированном
  bands:
  - from: 0
    label: планирование
    text: Вам спокойнее, когда решено и записано. Неопределённость и внезапные изменения планов выматывают.
  - from: 40
    label: баланс
    text: Вы планируете важное, но оставляете место для спонтанности.
  - from: 60
    label: гибкость
    text: Вам комфортнее держать варианты открытыми. Жёсткий план ощущается как клетка.
questions:
- id: q1
  text: После шумной вечеринки я чувствую себя заряженным.
  scales:
  - scale: ei
- id: q2
  text: Мне нужно побыть одному, чтобы восстановить силы.
  scales:
  - scale: ei
    reverse: true
- id: q3
  text: Я легко заговариваю с незнакомыми людьми.
  scales:
  - scale: ei
- id: q4
  text: В большой компании я больше слушаю, чем говорю.
  scales:
  - scale: ei
    reverse: true
- id: q5
  text: Я предпочитаю работать в команде, а не в одиночку.
  scales:
  - scale: ei
- id: q6
  text: Долгие разговоры меня утомляют, даже приятные.
  scales:
  - scale: ei
    reverse: true
- id: q7
  text: Меня увлекают идеи, у которых пока нет применения.
  scales:
  - scale: sn
- id: q8
  text: Я доверяю проверенному опыту больше, чем новым теориям.
  scales:
  - scale: sn
    reverse: true
- id: q9
  text: Я часто замечаю связи между вещами, которые другим кажутся несвязанными.
  scales:
  - scale: sn
- id: q10
  text: Мне важны конкретные детали и точные факты.
  scales:
  - scale: sn
    reverse: true
- id: q11
  text: Я люблю представлять, как что-то могло бы быть устроено иначе.
  scales:
  - scale: sn
- id: q12
  text: Инструкции я предпочитаю пошаговые и без общих рассуждений.
  scales:
  - scale: sn
    reverse: true
- id: q13
  text: Принимая решение, я взвешиваю аргументы за и против.
  scales:
  - scale: tf
    reverse: true
- id: q14
  text: Мне важно, чтобы решение никого не ранило.
  scales:
  - scale: tf
- id: q15
  text: Справедливость для меня важнее сочувствия.
  scales:
  - scale: tf
    reverse: true
- id: q16
  text: Я легко чувствую настроение людей вокруг.
  scales:
  - scale: tf
- id: q17
  text: Критику по делу я воспринимаю спокойно, даже резкую.
  scales:
  - scale: tf
    reverse: true
- id: q18
  text: Решая рабочий вопрос, я думаю о том, как он отразится на людях.
  scales:
  - scale: tf
- id: q19
  text: Я составляю планы и стараюсь их придерживаться.
  scales:
  - scale: jp
    reverse: true
- id: q20
  text: Мне нравится оставлять решение открытым как можно дольше.
  scales:
  - scale: jp
- id: q21
  text: Незавершённые дела меня беспокоят.
  scales:
  - scale: jp
    reverse: true
- id: q22
  text: Я хорошо работаю в последний момент, под давлением срока.
  scales:
  - scale: jp
- id: q23
  text: Я заранее продумываю поездки и покупки.
  scales:
  - scale: jp
    reverse: true
- id: q24
  text: Внезапные изменения планов меня скорее радуют, чем раздражают.
  scales:
  - scale: jp
crisis: []
selfHelp:
- Смотрите на проценты, а не на ярлык. Если по шкале у вас около 50%, выраженного предпочтения нет — и любая «буква типа»
  здесь будет случайной.
- Предпочтение — не ограничение. Интроверт может блестяще выступать публично, просто это стоит ему больше сил и требует восстановления
  после.
- Проверьте описание на близких. Типологические описания часто кажутся точными всем подряд — если ваше описание одинаково
  хорошо подходит другу с другим типом, доверия к нему должно быть меньше.
