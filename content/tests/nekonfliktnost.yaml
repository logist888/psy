slug: nekonfliktnost
version: 1.0.0
title: Тест на неконфликтность
seoTitle: Тест на неконфликтность онлайн — бесплатно, 10 вопросов
description: >-
  Онлайн-тест на неконфликтность по шкале IPIP: 10 утверждений о том, как вы ведёте себя в спорах и разногласиях. Около
  3 минут, ответы — ваша самооценка.
category: personality
ctaCluster: self
minutes: 3
passport:
  measures: Шкала измеряет, насколько человек склонен сглаживать разногласия и уступать, а не идти в столкновение напрямую.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт
    «неконфликтность». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.73 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: неконфликтность
    high: гасите конфликты и легко уступаете в мелочах
    low: говорите прямо и не боитесь столкновения
    bands:
      - from: 0
        label: низкая
        text: >-
          Вы говорите то, что думаете, и спор вас не пугает — иногда даже бодрит. Люди рядом обычно знают, где вы
          стоите, и это экономит всем время на догадки. Цена — резкая фраза запоминается дольше, чем повод, из-за
          которого она прозвучала.
      - from: 40
        label: средняя
        text: >-
          Вы выбираете, где спорить, а где промолчать, и чаще всего попадаете в цель. Важное отстаиваете, но не
          превращаете каждое расхождение в принципиальный вопрос. На усталости баланс может сдвигаться то в резкость, то
          в избегание.
      - from: 70
        label: высокая
        text: >-
          Вы стараетесь не доводить до столкновений и легко уступаете в мелочах. С вами спокойно работать, и напряжение
          рядом с вами обычно спадает. Обратная сторона — несказанное копится, а о ваших настоящих желаниях окружающие
          могут просто не догадываться.
questions:
  - id: q1
    text: Довольствуюсь тем, что есть.
    scales:
      - scale: total
  - id: q2
    text: Терпеть не могу выяснения отношений.
    scales:
      - scale: total
  - id: q3
    text: Терпеть не могу навязываться.
    scales:
      - scale: total
  - id: q4
    text: Легко могу уколоть словом.
    scales:
      - scale: total
        reverse: true
  - id: q5
    text: Часто возражаю людям.
    scales:
      - scale: total
        reverse: true
  - id: q6
    text: Люблю хорошую перепалку.
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Кричу на людей.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Оскорбляю людей.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Мщу тем, кто меня задел.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Долго держу обиду.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Ещё до разговора разделите вопросы на «мне всё равно» и «мне важно». Уступать намного легче, когда точно знаешь, что
    не отдашь.
  - >-
    Если фразу тянет сказать резко, оставьте в ней только факт и просьбу, без оценки человека: «звонок сорвался, давай
    перенесём» вместо «ты опять всё завалил».
  - >-
    Обиду, которая держится дольше суток, переводите в одно конкретное действие: попросить, договориться или отпустить.
    Третий вариант тоже считается решением.
