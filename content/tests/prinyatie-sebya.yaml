slug: prinyatie-sebya
version: 1.0.0
title: Тест на принятие себя
seoTitle: Тест на принятие себя онлайн — бесплатно, 7 вопросов
description: >-
  Тест из 7 утверждений о том, насколько вы спокойны по отношению к себе и другим: нужен ли вам статус и как вы
  относитесь к слабости.
category: personality
ctaCluster: self
minutes: 2
passport:
  measures: Шкала отражает, насколько человек принимает себя без гонки за статусом и обесценивания слабости.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт «принятие
    себя». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.69 (данные IPIP) — это ниже привычного порога 0,70, то
    есть пункты шкалы согласуются между собой слабо и результат стоит читать как повод подумать, а не как замер. Русский
    перевод независимой психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к
    измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: принятие себя
    high: спокойно относитесь к себе и не гонитесь за статусом
    low: многое доказываете себе и другим и строги к слабости
    bands:
      - from: 0
        label: невысокое принятие себя
        text: >-
          Вы много внимания отдаёте тому, как выглядите в глазах других, и плохо переносите слабость — прежде всего
          собственную. Такая требовательность часто даёт результат, который другим даётся дольше. Цена — почти нет пауз,
          где можно просто быть и ничего не доказывать; это описание сегодняшнего самоощущения, а не приговор.
      - from: 40
        label: среднее принятие себя
        text: >-
          В спокойные периоды вы относитесь к себе ровно, а под давлением возвращаются счёт достижений и сравнение с
          другими. Чужое мнение вы уважаете, но иногда ставите его выше собственного. Полезно замечать, какие именно
          ситуации включают режим доказывания.
      - from: 70
        label: высокое принятие себя
        text: >-
          Вы принимаете себя без постоянной ревизии и не меряете свою ценность статусом. Это делает вас устойчивым
          собеседником: рядом с вами не нужно оправдываться. Проверяйте только, что принятие не превращается в отказ
          замечать то, что вы сами хотели бы изменить.
questions:
  - id: q1
    text: Уважаю чужое мнение.
    scales:
      - scale: total
  - id: q2
    text: Принимаю всё как есть.
    scales:
      - scale: total
  - id: q3
    text: Ищу во всём личную выгоду.
    scales:
      - scale: total
        reverse: true
  - id: q4
    text: Гонюсь за статусом.
    scales:
      - scale: total
        reverse: true
  - id: q5
    text: Презираю любую слабость.
    scales:
      - scale: total
        reverse: true
  - id: q6
    text: Думаю в основном о себе.
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Использую лесть, чтобы продвинуться.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Отследите, в каких ситуациях вы описываете себя через достижения. Обычно это одни и те же две-три темы, и внимания
    требуют именно они, а не характер целиком.
  - >-
    Раз в неделю сознательно сделайте непринципиальное дело на троечку: это возвращает ощущение, что ваша ценность не
    привязана к результату.
  - >-
    Если мысли о собственной несостоятельности стали постоянными и мешают спать, работать или общаться, обсудите это с
    психологом — со стороны такие установки разбираются быстрее.
