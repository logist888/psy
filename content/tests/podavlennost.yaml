slug: podavlennost
version: 1.0.0
title: Тест на подавленность
seoTitle: Тест на подавленность онлайн — бесплатно, 10 вопросов
description: >-
  Шкала подавленности IPIP: 10 утверждений о грусти, отношении к себе и ощущении смысла. Занимает 2–3 минуты. Это
  самоотчёт, а не медицинская диагностика.
category: personality
ctaCluster: self
minutes: 3
passport:
  measures: Насколько часто вы переживаете сниженное настроение, недовольство собой и ощущение, что жизнь потеряла направление.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт
    «Подавленность». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.88 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: Подавленность
    high: часто грустите и строги к себе
    low: настроение ровное, к себе относитесь по-доброму
    bands:
      - from: 0
        label: низкая
        text: >-
          Настроение у вас в целом ровное, к себе вы относитесь по-доброму, а плохие дни проходят без долгого шлейфа.
          Обычно есть ощущение, что жизнь куда-то движется. Это хороший ресурс — в том числе для того, чтобы
          поддерживать других.
      - from: 40
        label: средняя
        text: >-
          Спады бывают — после неудач, зимой, на усталости, — но вы из них выбираетесь. К себе вы относитесь то тепло,
          то критично, и это нормальный человеческий диапазон. Стоит следить лишь за тем, чтобы плохие периоды не
          удлинялись.
      - from: 70
        label: высокая
        text: >-
          Грусть, критика в свой адрес и ощущение бессмысленности приходят часто и держатся долго. Это состояние, а не
          свойство личности: оно меняется — со временем само, быстрее с поддержкой и профессиональной помощью. Тест
          ничего не диагностирует, но он хороший повод отнестись к себе внимательнее.
questions:
  - id: q1
    text: Часто грущу без особой причины.
    scales:
      - scale: total
  - id: q2
    text: Недолюбливаю себя.
    scales:
      - scale: total
  - id: q3
    text: Часто хандрю.
    scales:
      - scale: total
  - id: q4
    text: Думаю о себе плохо.
    scales:
      - scale: total
  - id: q5
    text: Легко перехожу от хорошего настроения к плохому.
    scales:
      - scale: total
  - id: q6
    text: Испытываю отчаяние.
    scales:
      - scale: total
  - id: q7
    text: Не понимаю, куда движется моя жизнь.
    scales:
      - scale: total
  - id: q8
    text: Редко грущу.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Чувствую себя в ладу с собой.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Отношусь к себе с большой симпатией.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Планируйте по одному маленькому делу в день с видимым результатом — помыть окно, дописать письмо. При сниженном
    настроении действие возвращает силы раньше, чем появляется желание действовать.
  - >-
    Записывайте, что вы говорите себе в плохие минуты, и рядом — что сказали бы другу в той же ситуации. Разница между
    двумя колонками и есть то, с чем стоит работать.
  - >-
    Если подавленность держится больше двух недель почти каждый день, пропал сон, аппетит или интерес к тому, что
    радовало, — поговорите с психологом или врачом. Если появляются мысли о нежелании жить, обращайтесь за помощью
    сразу.
