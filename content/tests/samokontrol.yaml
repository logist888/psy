slug: samokontrol
version: 1.0.0
title: Тест на самоконтроль
seoTitle: Тест на самоконтроль онлайн — бесплатно, 10 вопросов
description: >-
  Вы человек плана или действия по настроению? Самоотчётная шкала из 10 вопросов о том, насколько вы обдумываете шаги
  заранее и держитесь намеченного.
category: personality
ctaCluster: self
minutes: 3
passport:
  measures: >-
    Шкала показывает, насколько вы склонны планировать, действовать методично и внимательно к деталям, а не по
    внезапному порыву.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт «самоконтроль
    и планомерность». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.78 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: самоконтроль и планомерность
    high: планомерность, внимание к деталям
    low: спонтанность, действие по ситуации
    bands:
      - from: 0
        label: низкий самоконтроль
        text: >-
          Вы действуете по обстановке и настроению, не тратя времени на подробные планы. Это делает вас быстрым там, где
          другие ещё согласовывают детали. Сложнее с длинными задачами, где результат зависит от аккуратности и порядка.
      - from: 40
        label: умеренный самоконтроль
        text: >-
          Ключевые вещи вы планируете, остальное оставляете на импровизацию. План для вас — ориентир, а не закон, и от
          него можно отступить осознанно. Такое сочетание неплохо держит и сроки, и гибкость.
      - from: 70
        label: высокий самоконтроль
        text: >-
          Вы предпочитаете обдумать шаги заранее, следовать порядку и доводить дело до аккуратного конца. На вас можно
          положиться в задачах, где важна точность. Труднее даются ситуации, где план приходится ломать на ходу.
questions:
  - id: q1
    text: Люблю планировать заранее.
    scales:
      - scale: total
  - id: q2
    text: Делаю всё по инструкции.
    scales:
      - scale: total
  - id: q3
    text: Работаю очень тщательно.
    scales:
      - scale: total
  - id: q4
    text: Обращаю внимание на детали.
    scales:
      - scale: total
  - id: q5
    text: Составляю планы и придерживаюсь их.
    scales:
      - scale: total
  - id: q6
    text: Берусь за дело, не подумав.
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Люблю действовать по настроению.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Строю планы в последний момент.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Принимаю решения сгоряча.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Устраиваю бардак в делах.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Планируйте не только задачи, но и пустые часы. Свободное время в календаре снижает тревогу от сбоя плана гораздо
    лучше, чем более подробный план.
  - 'Если планы разваливаются, уменьшайте не амбиции, а горизонт: договаривайтесь с собой на один вечер, а не на месяц.'
  - >-
    Раз в месяц смотрите, какие ваши правила и проверки уже никому не нужны. Аккуратность имеет свойство обрастать
    ритуалами, которые едят время.
