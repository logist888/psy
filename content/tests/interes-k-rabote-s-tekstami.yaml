crisis: []
selfHelp:
  - >-
    Прочитайте на этой неделе одну научно-популярную книгу или большой лонгрид до конца и запишите на страницу, что из
    этого вы могли бы объяснить другому человеку.
  - >-
    Отведите по 20 минут в день на иностранный язык — приложение, подкаст или разговорный клуб — и посмотрите, держится
    ли привычка все семь дней.
  - >-
    Напишите текст на две-три страницы на тему, в которой разбираетесь, и предложите его в тематический канал, блог или
    локальное издание.
