slug: interes-k-rabote-s-tekstami
version: 1.0.0
title: Тест на интерес к работе с текстами и языками
seoTitle: Тест на интерес к работе с текстами — бесплатно, 10 вопросов
description: >-
  Бесплатный тест из 10 вопросов о том, насколько вам интересна работа с текстами и языками: перевод, редактура, чтение
  и письмо. Без регистрации.
category: career
ctaCluster: career
minutes: 3
passport:
  measures: >-
    Шкала показывает, насколько вам интересны занятия вокруг слова и знания: языки, чтение, письмо, редактура,
    преподавание и работа с текстами.
  origin: >-
    Шкала опросника профессиональных интересов ORVIS (Oregon Vocational Interest Scales; Pozzebon, Visser, Ashton, Lee &
    Goldberg, 2010) из международного пула пунктов IPIP, измеряющая конструкт «интерес к работе с текстами». Русский
    перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    Ни коэффициент надёжности англоязычного оригинала, ни проверка русского перевода не опубликованы — относитесь к
    результату как к поводу подумать, а не к измерению.
  limitations: >-
    Шкала показывает интерес, а не способности и не пригодность к профессии: нравится — не то же самое, что получается.
    Нормы российской выборки не собраны, вы видите процент от максимума шкалы, а не сравнение с другими людьми, поэтому
    читайте результат как повод присмотреться к направлению, а не как рекомендацию по выбору работы.
instruction: >-
  Оценивайте, насколько вам нравится такая деятельность, независимо от того, умеете вы это или нет и сколько за это
  платят.
options:
  - text: Совсем не нравится
    value: 0
  - text: Скорее не нравится
    value: 1
  - text: Скорее нравится
    value: 2
  - text: Очень нравится
    value: 3
scales:
  - id: total
    name: интерес к работе с текстами
    high: тянет к языкам, книгам и работе со словом
    low: работа со словом и текстами не увлекает
    bands:
      - from: 0
        label: низкий
        text: >-
          Языки, книги, редактура и разговоры о знании вас скорее не зовут. Читать много и подолгу, вести дневник или
          разбираться в тонкостях формулировок — не то, чем хочется занимать свободное время. Низкий балл не означает,
          что вы плохо пишете или говорите: он про интерес к такому виду деятельности, а не про уровень. Нравится и
          получается — разные вещи, и грамотный текст вполне может даваться вам легко без всякого азарта. Вероятно, вам
          ближе задачи, где важнее действие или число, чем слово.
      - from: 40
        label: средний
        text: >-
          Слово и знания вам интересны, но не занимают всё пространство. Скорее всего, вы читаете, когда есть повод,
          можете взяться за текст или выучить язык под конкретную цель, но не живёте этим постоянно. Средний балл часто
          у тех, для кого эрудиция — рабочий инструмент: понятно объяснить, разобраться в теме, свести материал.
          Помните, что интерес и способности не совпадают: можно писать сильно и без особого влечения к письму. Обратите
          внимание, что вы отметили выше — языки, чтение или собственные тексты.
      - from: 70
        label: высокий
        text: >-
          Вас притягивает всё, что связано со словом и знанием: языки, книги, тексты, редактура, объяснение сложного
          простыми словами. Разбираться и рассказывать для вас скорее удовольствие, чем работа. Это повод присмотреться
          к направлениям вокруг перевода, редактуры, журналистики, преподавания и исследований — но не обещание, что
          конкретная профессия вам подойдёт. Высокий интерес не равен квалификации: нравится и получается — разные вещи,
          и языку или редактуре всё равно придётся учиться. Проверьте интерес небольшим делом, прежде чем строить на нём
          планы.
