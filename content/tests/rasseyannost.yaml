slug: rasseyannost
version: 1.0.0
title: Тест на рассеянность
seoTitle: Тест на рассеянность онлайн — бесплатно, 10 вопросов
description: >-
  Шкала показывает, как часто вы забываете, отвлекаетесь и теряете нить в повседневных делах. 10 вопросов, около 3
  минут. Это самоотчёт для размышления, а не диагностика.
category: personality
ctaCluster: self
minutes: 3
passport:
  measures: >-
    Шкала показывает, насколько часто человек замечает у себя забывчивость, отвлекаемость и промахи внимания в обычных
    делах.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт
    «рассеянность». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.79 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: рассеянность
    high: часто отвлекаюсь, забываю и теряю нить
    low: держу внимание и детали под контролем
    bands:
      - from: 0
        label: низкая
        text: >-
          В быту вы собранны: помните договорённости, замечаете детали и редко теряете нить. Это экономит массу времени
          и нервов — и вам, и людям рядом. Цена бывает в напряжении: удерживать всё в голове утомительно, а промахи
          других могут раздражать сильнее, чем стоило бы. Иногда за собранностью прячется нежелание отпускать контроль
          даже там, где ошибка ничего не стоит. Проверьте, не держите ли вы внимание включённым круглосуточно.
      - from: 40
        label: средняя
        text: >-
          Обычно вы держите дела в голове, но в загруженные дни начинаете что-то ронять: забытое сообщение, пропущенная
          деталь, перечитанный дважды абзац. Это привычная картина при нехватке сна и большом количестве переключений.
          Сильная сторона — вы замечаете такие моменты и умеете подстраховаться списком или напоминанием. Цена — в пики
          нагрузки внимание становится узким местом, и мелкие промахи копятся. Смотрите не на сам факт, а на то, в какие
          дни это усиливается.
      - from: 70
        label: высокая
        text: >-
          Вы часто ловите себя на том, что забыли, отвлеклись или перепутали: мысль уплывает, вещи теряются, решение
          даётся тяжело. За этим нередко стоят усталость, недосып, тревога или просто слишком много дел одновременно —
          стоит смотреть на условия, а не только на себя. Сильная сторона такого склада — широкое, подвижное внимание:
          вы замечаете фон и связи, которые собранный человек проскакивает. Цена — бытовые потери времени и ощущение
          ненадёжности. Если это заметно мешает и держится долго, разумно обсудить с врачом, а не искать ответ в тесте.
questions:
  - id: q1
    text: Легко теряюсь и путаюсь
    scales:
      - scale: total
  - id: q2
    text: Часто всё забываю
    scales:
      - scale: total
  - id: q3
    text: Мои мысли легко уплывают в сторону
    scales:
      - scale: total
  - id: q4
    text: Часто что-нибудь проливаю
    scales:
      - scale: total
  - id: q5
    text: Мне трудно удержать что-то в голове
    scales:
      - scale: total
  - id: q6
    text: Не могу определиться с решением
    scales:
      - scale: total
  - id: q7
    text: Люблю брать на себя ответственность за решения
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Всегда понимаю, зачем делаю то, что делаю
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: В напряжённой ситуации сохраняю спокойствие
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Обращаю внимание на детали
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - Заведите одно постоянное место для ключей, карт и наушников и всю неделю кладите их только туда.
  - >-
    Всё, что нужно не забыть, сразу превращайте в напоминание с точным временем — прямо в момент, когда вам об этом
    сказали.
  - На неделю уберите телефон из комнаты, где спите, и посмотрите, изменилось ли количество мелких промахов днём.
