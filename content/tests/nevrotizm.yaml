slug: nevrotizm
version: 1.0.0
title: Тест на невротизм
seoTitle: Тест на невротизм онлайн — бесплатно, 20 вопросов
description: >-
  Шкала невротизма: 20 утверждений, около 5 минут. Показывает, насколько легко вас выбивают из равновесия тревога,
  уныние и раздражение и быстро ли вы приходите в себя. Это самоотчёт, а не диагностика.
category: personality
ctaCluster: self
minutes: 5
passport:
  measures: >-
    Шкала показывает, насколько часто и сильно вы отзываетесь тревогой, унынием и раздражением на обычные события и как
    долго возвращаетесь в равновесие.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт «невротизм».
    Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.91 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: невротизм
    high: тревожность, перепады настроения, долгое возвращение в равновесие
    low: ровное настроение, спокойствие под давлением, быстрое восстановление
    bands:
      - from: 0
        label: низкая
        text: >-
          Судя по ответам, вы редко застреваете в тревоге и унынии: неприятности выбивают из колеи ненадолго, а под
          давлением вы держитесь ровно. Это удобно и вам, и людям рядом — на вас можно опереться в неразберихе. Цена
          такой устойчивости в том, что слабые сигналы легко пропустить: усталость, обиду или нарастающее напряжение вы
          замечаете, когда они уже накопились. Иногда спокойствие читается окружающими как равнодушие, особенно если
          рядом кто-то переживает сильно. Полезно время от времени спрашивать себя не «всё ли под контролем», а «что я
          сейчас чувствую».
      - from: 40
        label: средняя
        text: >-
          Ответы дают картину, привычную для большинства: бывают дни, когда задевает почти всё, и дни, когда почти ничто
          не трогает. Обычно вы восстанавливаетесь за несколько часов или к следующему утру, но при накопившейся
          усталости и в затяжном стрессе реакции становятся резче. Плюс такой середины в том, что вы чувствуете
          достаточно, чтобы вовремя заметить проблему, и при этом не тонете в переживаниях. Стоит присмотреться, что
          именно сдвигает вас в сторону тревоги: недосып, конфликты, неопределённость. Обычно таких поводов немного, и
          их можно разобрать по одному.
      - from: 70
        label: высокая
        text: >-
          Ответы говорят о сильной эмоциональной отзывчивости: тревога, уныние и раздражение приходят быстро, а уходят
          медленно. У этого есть и сильная сторона — вы раньше других замечаете, что что-то идёт не так, тоньше
          чувствуете настроение людей и редко бываете беспечны. Цена — много сил уходит на переживания, а решения иногда
          принимаются из ожидания худшего варианта. Это ориентир, а не измерение: балл описывает ваши сегодняшние
          ответы, а не устройство личности. Если переживания заметно мешают спать, работать или общаться, имеет смысл
          обсудить это с психологом — с поддержкой такое разбирается быстрее.
questions:
  - id: q1
    text: Часто хандрю.
    scales:
      - scale: total
  - id: q2
    text: Себе не нравлюсь.
    scales:
      - scale: total
  - id: q3
    text: Часто впадаю в уныние.
    scales:
      - scale: total
  - id: q4
    text: Настроение у меня часто скачет.
    scales:
      - scale: total
  - id: q5
    text: Легко впадаю в панику.
    scales:
      - scale: total
  - id: q6
    text: Во всём сомневаюсь.
    scales:
      - scale: total
  - id: q7
    text: Легко чувствую себя в опасности.
    scales:
      - scale: total
  - id: q8
    text: Быстро начинаю нервничать.
    scales:
      - scale: total
  - id: q9
    text: Жду худшего.
    scales:
