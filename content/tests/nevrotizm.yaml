crisis: []
selfHelp:
  - >-
    Заведите на неделю заметку в телефоне: как только накрывает тревога, записывайте одной строкой саму мысль и что
    случилось за минуту до неё. В воскресенье перечитайте — часть поводов повторяется, и дальше с ними можно работать по
    списку.
  - >-
    Назначьте беспокойству время: 15 минут в фиксированный час, например в 19:00. Тревожные мысли, которые приходят
    раньше, записывайте и откладывайте до этого окна — к нему большинство из них теряет остроту.
  - >-
    Три вечера подряд ложитесь спать в одно и то же время и оставляйте телефон вне спальни. Недосып делает и тревогу, и
    раздражительность сильнее, и это самое быстрое, что можно изменить.
