slug: interes-k-pomogayuschim-professiyam
version: 1.0.0
title: Тест на интерес к помогающим профессиям
seoTitle: Тест на интерес к помогающим профессиям — бесплатно, 13 вопросов
description: >-
  Шкала опросника профессиональных интересов ORVIS: 13 занятий, связанных с заботой, обучением и поддержкой людей.
  Показывает силу интереса к помогающей работе, а не уровень способностей.
category: career
ctaCluster: career
minutes: 3
passport:
  measures: >-
    Шкала показывает, насколько человека привлекают занятия, в которых главное — заботиться о людях, учить их, лечить и
    поддерживать.
  origin: >-
    Шкала опросника профессиональных интересов ORVIS (Oregon Vocational Interest Scales; Pozzebon, Visser, Ashton, Lee &
    Goldberg, 2010) из международного пула пунктов IPIP, измеряющая конструкт «интерес к помогающим профессиям». Русский
    перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    Ни коэффициент надёжности англоязычного оригинала, ни проверка русского перевода не опубликованы — относитесь к
    результату как к поводу подумать, а не к измерению.
  limitations: >-
    Шкала показывает интерес, а не способности и не пригодность к профессии: нравится — не то же самое, что получается.
    Нормы российской выборки не собраны, вы видите процент от максимума шкалы, а не сравнение с другими людьми, поэтому
    читайте результат как повод присмотреться к направлению, а не как рекомендацию по выбору работы.
instruction: >-
  Оценивайте, насколько вам нравится такая деятельность, независимо от того, умеете вы это или нет и сколько за это
  платят.
options:
  - text: Совсем не нравится
    value: 0
  - text: Скорее не нравится
    value: 1
  - text: Скорее нравится
    value: 2
  - text: Очень нравится
    value: 3
scales:
  - id: total
    name: интерес к помогающим профессиям
    high: нравится помогать, учить и заботиться о людях
    low: помогающие занятия привлекают мало
    bands:
      - from: 0
        label: низкий
        text: >-
          Занятия, построенные вокруг заботы о людях, обучения и поддержки, вас притягивают слабо. Возможно, вам ближе
          работа с задачами, вещами или идеями, чем с чужими состояниями и просьбами. Это не говорит о чёрствости:
          низкий интерес к помогающим профессиям и способность быть внимательным к близким — совершенно разные вещи. И
          наоборот: интерес не равен умению, поэтому балл здесь ничего не сообщает о том, насколько хорошо у вас
          получалось бы такое дело.
      - from: 40
        label: средний
        text: >-
          Помощь людям вам интересна, но не перевешивает всё остальное. Скорее всего, вы охотно поддержите и объясните,
          когда об этом просят, но не готовы, чтобы забота о других занимала весь рабочий день. Такой профиль хорошо
          ложится на роли, где помощь — важная часть работы, но не единственная: наставничество, клиентская работа,
          преподавание отдельных курсов. Стоит помнить, что интерес и способности не совпадают автоматически — проверять
          лучше делом.
      - from: 70
        label: высокий
        text: >-
          Вас явно тянет к делам, где есть живой человек и его нужда: учить, лечить, поддерживать, сопровождать. Это
          повод присмотреться к направлениям вроде педагогики, медицины, социальной работы, психологического
          консультирования или благотворительных проектов. Высокий балл не обещает, что такая работа окажется вам по
          силам: помогающие профессии требуют выносливости и умения держать границы, а этому учатся отдельно. Начните с
          волонтёрства или наставничества и посмотрите, как вы себя чувствуете через месяц.
questions:
