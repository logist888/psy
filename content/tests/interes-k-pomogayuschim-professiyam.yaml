    scales:
      - scale: total
  - id: q3
    text: Работать учителем начальных классов
    scales:
      - scale: total
  - id: q4
    text: Работать социальным работником
    scales:
      - scale: total
  - id: q5
    text: Быть священником или другим духовным наставником
    scales:
      - scale: total
  - id: q6
    text: Консультировать людей, которым нужна помощь
    scales:
      - scale: total
  - id: q7
    text: Обучать родителей уходу за детьми
    scales:
      - scale: total
  - id: q8
    text: Работать врачом или медработником
    scales:
      - scale: total
  - id: q9
    text: Работать физиотерапевтом или реабилитологом
    scales:
      - scale: total
  - id: q10
    text: Утешать и поддерживать других
    scales:
