crisis: []
selfHelp:
  - >-
    Сходите волонтёром на одно мероприятие в ближайшие дни: фонд, приют, донорская акция или помощь на городском забеге
    — важно попробовать, а не только читать об этом.
  - >-
    Поговорите с человеком помогающей профессии — врачом, педагогом, соцработником — и спросите про выгорание и границы:
    об этом редко пишут в описаниях профессий.
  - >-
    Объясните кому-нибудь то, что умеете сами: помогите знакомому подростку с задачей или коллеге разобраться в
    программе, а потом отследите, что вы почувствовали — усталость или подъём.
