slug: neumerennost
version: 1.0.0
title: Тест на неумеренность
seoTitle: Тест на неумеренность онлайн — бесплатно, 10 вопросов
description: >-
  Шкала неумеренности IPIP: 10 утверждений о соблазнах, переедании, спонтанных тратах и самоконтроле. Занимает около 2
  минут, результат с расшифровкой сразу.
category: personality
ctaCluster: self
minutes: 3
passport:
  measures: Насколько трудно вам противостоять сиюминутным желаниям — в еде, тратах и других соблазнах.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт
    «Неумеренность». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.77 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: Неумеренность
    high: легко поддаётесь соблазнам
    low: спокойно отказываетесь от лишнего
    bands:
      - from: 0
        label: низкая
        text: >-
          Соблазны вы переносите спокойно: уговорить себя на лишнюю покупку или добавку непросто. Планы и бюджет обычно
          выдерживаются без особого напряжения. Иногда стоит проверить, не превращается ли контроль в отказ от
          удовольствий вообще.
      - from: 40
        label: средняя
        text: >-
          Иногда вы позволяете себе лишнее, иногда останавливаетесь — в зависимости от усталости и настроения. Срывы
          случаются, но не задают тон вашей жизни. Это самый частый вариант.
      - from: 70
        label: высокая
        text: >-
          Импульс часто оказывается сильнее плана: съедается, покупается и делается больше, чем задумано, а сожаление
          приходит потом. Обычно за этим стоит стресс и попытка себя утешить, а не слабоволие. Помогает здесь не сила
          воли, а изменение среды и режима.
questions:
  - id: q1
    text: Часто переедаю.
    scales:
      - scale: total
  - id: q2
    text: Не всегда понимаю, зачем делаю то, что делаю.
    scales:
      - scale: total
  - id: q3
    text: Делаю то, о чём потом жалею.
    scales:
      - scale: total
  - id: q4
    text: Срываюсь и не могу вовремя остановиться.
    scales:
      - scale: total
  - id: q5
    text: Обожаю поесть.
    scales:
      - scale: total
  - id: q6
    text: Редко позволяю себе лишнее.
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Легко справляюсь с соблазнами.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Умею сдерживать свои желания.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Никогда не трачу больше, чем могу себе позволить.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Никогда не транжирю.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Меняйте среду, а не силу воли: то, до чего идти дольше двух минут, съедается и покупается заметно реже. Убирайте
    соблазн из поля зрения, вместо того чтобы бороться с ним взглядом.
  - >-
    Введите правило двадцати минут для крупных покупок и добавок: положили в корзину или в тарелку — и ждёте. Большая
    часть импульсов эту паузу не переживает.
  - >-
    Если срывы связаны с едой, алкоголем, ставками или тратами и вы уже пробовали остановиться сами — разговор со
    специалистом даст результат быстрее, чем ещё один подход к самоконтролю.
