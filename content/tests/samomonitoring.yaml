slug: samomonitoring
version: 1.0.0
title: Тест на самомониторинг
seoTitle: Тест на самомониторинг онлайн — бесплатно, 10 вопросов
description: >-
  Шкала самомониторинга: 10 утверждений, около 3 минут. Показывает, насколько охотно вы играете на публику, привлекаете
  внимание и подстраиваете подачу под аудиторию. Это самоотчёт, а не диагностика.
category: personality
ctaCluster: self
minutes: 3
passport:
  measures: >-
    Шкала показывает, насколько охотно вы работаете на публику: привлекаете внимание, подстраиваете подачу под аудиторию
    и держитесь свободно на виду.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт
    «самомониторинг». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.82 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: самомониторинг
    high: артистичность, лёгкость на публике, интерес к вниманию
    low: сдержанность, нежелание быть на виду
    bands:
      - from: 0
        label: низкая
        text: >-
          Ответы говорят о сдержанности на людях: быть в центре внимания вам не хочется, и на публику вы не играете.
          Плюс в том, что вас воспринимают как человека без позы — то, что вы говорите, обычно и есть то, что вы
          думаете. Цена — сделанное вами может остаться незамеченным просто потому, что вы о нём не рассказали, а там,
          где нужно продать себя или свою идею, приходится тяжело. Стоит развести две разные вещи: не любить внимание и
          не уметь его выдерживать. Первое остаётся с вами, второе тренируется — удобнее всего на маленькой знакомой
          аудитории.
      - from: 40
        label: средняя
        text: >-
          Вы можете выйти на сцену, если это нужно, но специально её не ищете. Обычно позиция гибкая: в своей компании
          держитесь свободно, а на незнакомой публике включаете сдержанность. Ограничение в том, что заметность зависит
          от настроения и обстановки, поэтому в важный момент подача может не собраться. Полезно заранее знать свои
          три-четыре темы, о которых вы говорите уверенно в любой аудитории. С ними выступление превращается в обычный
          разговор.
      - from: 70
        label: высокая
        text: >-
          Ответы говорят о том, что публика вам скорее помогает: вы легко привлекаете внимание, говорите экспромтом и
          умеете себя подать. Это выручает на переговорах, презентациях и в незнакомых компаниях. Цена — привычка
          держать роль иногда закрывает то, что происходит внутри, и близким трудно понять, где вы без неё. Ещё бывает,
          что впечатление обгоняет сделанное, и потом приходится подтягивать результат под обещание. Хорошая проверка:
          остаётся ли вам интересно в разговоре, где вас никто не оценивает.
questions:
  - id: q1
    text: Из меня вышел бы неплохой актёр.
    scales:
      - scale: total
  - id: q2
    text: Устраиваю представление, чтобы произвести впечатление.
    scales:
      - scale: total
  - id: q3
    text: Если есть повод, охотно покрасуюсь.
    scales:
      - scale: total
  - id: q4
    text: Я — душа компании.
    scales:
      - scale: total
  - id: q5
    text: Легко говорю экспромтом перед людьми.
    scales:
      - scale: total
  - id: q6
    text: Люблю привлекать внимание.
    scales:
      - scale: total
  - id: q7
    text: Не прочь польстить, если это помогает добиться своего.
    scales:
      - scale: total
  - id: q8
    text: Терпеть не могу быть в центре внимания.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Комик из меня плохой.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Не люблю обращать на себя внимание.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Проведите на этой неделе один разговор без единой попытки произвести впечатление: только вопросы собеседнику и
    прямые ответы. Отметьте, что меняется в вашем самочувствии и в его реакции.
  - >-
    Если внимание даётся тяжело, начните с малого: расскажите за столом с друзьями историю на две минуты, не передавая
    слово другим. Знакомая компания — самый мягкий тренажёр.
  - >-
    Один раз за неделю замените в рассказе о себе усиливающее слово на конкретный факт или цифру: не «огромный проект»,
    а «проект на четыре месяца».
