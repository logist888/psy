slug: naporistost
version: 1.0.0
title: Тест на напористость
seoTitle: Тест на напористость онлайн — бесплатно, 10 вопросов
description: >-
  Шкала напористости IPIP: 10 утверждений о лидерстве, влиянии на других и готовности брать управление на себя. Занимает
  около 2 минут, результат сразу.
category: personality
ctaCluster: self
minutes: 3
passport:
  measures: Насколько вы склонны брать инициативу, вести за собой и влиять на решения других людей.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт
    «Напористость». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.84 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: Напористость
    high: берёте руль на себя и влияете на других
    low: уступаете лидерство и держитесь в тени
    bands:
      - from: 0
        label: низкая
        text: >-
          Вы редко берёте руль на себя: удобнее поддержать чужую инициативу, чем вести самому. Мнение чаще остаётся при
          вас, особенно в больших группах. Это экономит силы, но иногда за вас решают то, что важно вам.
      - from: 40
        label: средняя
        text: >-
          Инициативу вы берёте, когда тема ваша или больше некому, а в остальном спокойно уступаете лидерство. Мнение
          высказываете, но без нажима. Такой баланс хорошо работает в командах.
      - from: 70
        label: высокая
        text: >-
          Вы естественно оказываетесь во главе: берёте контроль, убеждаете, задаёте направление. Люди часто ждут от вас
          решения — и получают его. Чтобы это работало вдолгую, полезно оставлять место чужому мнению и не решать за
          тех, кто может сам.
questions:
  - id: q1
    text: Беру инициативу на себя.
    scales:
      - scale: total
  - id: q2
    text: Стараюсь вести людей за собой.
    scales:
      - scale: total
  - id: q3
    text: Умею уговорить людей на что-то.
    scales:
      - scale: total
  - id: q4
    text: Стремлюсь влиять на других.
    scales:
      - scale: total
  - id: q5
    text: Беру ситуацию под контроль.
    scales:
      - scale: total
  - id: q6
    text: Жду, пока другие начнут первыми.
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Держусь в тени.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Мало говорю.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Не люблю привлекать к себе внимание.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Держу своё мнение при себе.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Высказывайтесь в первые пять минут обсуждения, даже коротко. Дальше вступить в разговор сложнее в разы: роль
    молчащего закрепляется быстро.
  - >-
    Формулируйте просьбы утвердительно и адресно: не «может, кто-нибудь посмотрит», а «Оля, посмотри, пожалуйста, до
    четверга».
  - >-
    Если напористости много, добавьте паузу-вопрос: прежде чем решить за группу, спросите, у кого другое мнение. Это
    сохраняет ваше влияние и снижает риск, что от вас начнут скрывать проблемы.
