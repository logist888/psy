slug: samodisciplina
version: 1.0.0
title: Тест на самодисциплину
seoTitle: Тест на самодисциплину онлайн — бесплатно, 10 вопросов
description: >-
  Онлайн-тест на самодисциплину по шкале IPIP: 10 утверждений о том, как вы начинаете дела и доводите их до конца.
  Занимает около 3 минут, это самооценка.
category: personality
ctaCluster: self
minutes: 3
passport:
  measures: Шкала измеряет, насколько легко человек приступает к делам и доводит их до конца без внешнего давления.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт
    «самодисциплина». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.85 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: самодисциплина
    high: беретесь за дела сразу и доводите до конца
    low: тянете со стартом и работаете рывками
    bands:
      - from: 0
        label: низкая
        text: >-
          Начать вам трудно, и дела часто сдвигаются к последнему моменту. Многие в таком режиме работают вполне
          продуктивно: мотор запускается от срока, а не от плана. Цена — постоянный фон из «надо бы», который выматывает
          сильнее самой работы.
      - from: 40
        label: средняя
        text: >-
          Обычно вы начинаете вовремя, хотя неприятные дела и у вас могут полежать. Есть задачи, за которые вы беретесь
          сразу, и есть те, для которых нужен внешний срок. Режим устойчивый, пока сроков не становится слишком много
          одновременно.
      - from: 70
        label: высокая
        text: >-
          Вы садитесь за дело без раскачки и доводите планы до конца. Это даёт спокойствие: никакой гонки в последнюю
          ночь и почти нет долгов перед собой. Цена — привычка сразу браться за всё легко превращает в задачу то, что
          можно было и не делать.
questions:
  - id: q1
    text: Делаю домашние дела сразу.
    scales:
      - scale: total
  - id: q2
    text: Всегда готовлюсь заранее.
    scales:
      - scale: total
  - id: q3
    text: Берусь за задачи сразу.
    scales:
      - scale: total
  - id: q4
    text: Принимаюсь за работу без раскачки.
    scales:
      - scale: total
  - id: q5
    text: Довожу свои планы до конца.
    scales:
      - scale: total
  - id: q6
    text: С трудом заставляю себя сесть за работу.
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Трачу время впустую.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Начинаю только тогда, когда меня подтолкнут.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Тяжело приступаю к новым делам.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Откладываю решения на потом.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Договаривайтесь с собой не о деле, а о первых двух минутах: открыть файл, надеть кроссовки. Сопротивление живёт на
    старте, а не внутри самой работы.
  - >-
    Привяжите начало к месту и времени, а не к настроению: одно и то же кресло и один и тот же час экономят силы,
    которые уходят на решение «начинать ли».
  - >-
    Отложенное решение назначайте на конкретный момент — «в четверг в десять выбираю». Незакрытое решение тратит
    внимание всё время, пока висит.
