slug: doverie-k-lyudyam
version: 1.0.0
title: Тест на доверие к людям
seoTitle: Тест на доверие к людям онлайн — бесплатно, 10 вопросов
description: >-
  Шкала IPIP из 10 утверждений: насколько вы готовы верить людям и рассчитывать на их добрые намерения. Занимает около 2
  минут, результат — сразу.
category: relationships
ctaCluster: relationships
minutes: 3
passport:
  measures: Насколько человек исходит из того, что окружающие честны и настроены доброжелательно.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт «доверие к
    людям». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.82 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: доверие к людям
    high: исходит из того, что людям можно верить
    low: подходит к людям осторожно и проверяет
    bands:
      - from: 0
        label: низкое
        text: >-
          К людям вы подходите осторожно и не спешите верить словам: сначала доказательства, потом доверие. Это защищает
          от обмана, но требует сил и иногда отпугивает тех, кто настроен доброжелательно. Часто такая настороженность —
          след опыта, а не черта характера.
      - from: 40
        label: умеренное
        text: >-
          Вы в целом рассчитываете на порядочность людей, но держите глаза открытыми. Доверие выдаёте по ситуации, и оно
          растёт по мере проверки. Позиция устойчивая: редко приводит и к наивности, и к изоляции.
      - from: 70
        label: высокое
        text: >-
          Вы исходите из того, что людям можно верить, и это делает контакт лёгким: с вами охотно открываются и
          договариваются. Цена — риск не заметить манипуляцию или принять на веру то, что стоило проверить. Доверие как
          установка хорошо уживается с простыми проверками там, где на кону деньги и обязательства.
questions:
  - id: q1
    text: Доверяю людям.
    scales:
      - scale: total
  - id: q2
    text: Верю, что у людей добрые намерения.
    scales:
      - scale: total
  - id: q3
    text: Верю тому, что мне говорят.
    scales:
      - scale: total
  - id: q4
    text: Считаю, что по сути люди порядочны.
    scales:
      - scale: total
  - id: q5
    text: Верю в человеческую доброту.
    scales:
      - scale: total
  - id: q6
    text: Думаю, что всё будет хорошо.
    scales:
      - scale: total
  - id: q7
    text: Не доверяю людям.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Подозреваю у людей скрытые мотивы.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Держусь с людьми настороже.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Считаю, что человек по природе злой.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Выдавайте доверие порциями: небольшая ставка — проверка — увеличение. Так не приходится выбирать между наивностью и
    подозрительностью.
  - >-
    Различайте «человек ненадёжен» и «ситуация провоцирует»: усталость, спешка и конфликт интересов объясняют больше
    поступков, чем характер.
  - >-
    Если подозрительность мешает, заранее опишите конкретные признаки нарушенного обещания — тогда тревога опирается на
    факты, а не на общее ощущение.
