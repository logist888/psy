slug: vliyatelnost
version: 1.0.0
title: Тест на влиятельность
seoTitle: Тест на влиятельность онлайн — бесплатно, 9 вопросов
description: >-
  Оценивает, насколько легко вам вести за собой, убеждать и говорить перед людьми. 9 вопросов, примерно 3 минуты. Это
  самоотчётная шкала, а не диагностика.
category: personality
ctaCluster: self
minutes: 2
passport:
  measures: Шкала показывает, насколько естественно вам брать слово, вести группу и склонять других к своему решению.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт
    «влиятельность». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.85 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: влиятельность
    high: легко ведёт за собой и убеждает
    low: держится в тени и не тянет руль на себя
    bands:
      - from: 0
        label: низкая
        text: >-
          Вы редко тянете одеяло на себя: не рвётесь выступать, не уговариваете, спокойно отдаёте руль другому. Рядом с
          вами люди не чувствуют давления, и это ценят. Минус в том, что ваши идеи иногда проходят незамеченными просто
          потому, что их некому озвучить.
      - from: 40
        label: средняя
        text: >-
          Вы берёте инициативу, когда тема ваша и ситуация понятная, но не делаете этого по привычке. Умеете и вести, и
          поддерживать чужое лидерство — это гибко. Цена гибкости — пауза, за которую роль ведущего успевает занять
          кто-то другой.
      - from: 70
        label: высокая
        text: >-
          Вы легко берёте слово, задаёте направление разговора и убеждаете; экспромт вас не пугает. Группа рядом с вами
          быстрее приходит к решению. Обратная сторона — тихие люди замолкают, а убедительность иногда обгоняет проверку
          фактов.
questions:
  - id: q1
    text: Умею влиять на людей.
    scales:
      - scale: total
  - id: q2
    text: Беру руководство на себя.
    scales:
      - scale: total
  - id: q3
    text: Могу уговорить людей сделать то, что мне нужно.
    scales:
      - scale: total
  - id: q4
    text: Хорошо выступаю без подготовки.
    scales:
      - scale: total
  - id: q5
    text: Не люблю привлекать к себе внимание.
    scales:
      - scale: total
        reverse: true
  - id: q6
    text: Не умею влиять на людей.
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Держусь в тени.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Не умею манипулировать людьми.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Редко нахожу, что сказать.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Заранее решайте, где ваш голос обязателен, а где вы намеренно молчите первые десять минут: в этой тишине становится
    видно, кто ещё умеет вести.
  - Тренируйте экспромт на низких ставках — короткий тост, реплика на планёрке, — чтобы навык не зависел от подготовки.
  - >-
    После того как кого-то убедили, спросите через день, что человек думает сейчас: согласие в моменте и настоящее
    согласие — разные вещи.
