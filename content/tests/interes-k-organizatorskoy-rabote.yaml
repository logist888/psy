crisis: []
selfHelp:
  - >-
    На этой неделе возьмите один запущенный процесс — семейный бюджет, рабочую папку с документами, список задач — и
    наведите в нём порядок за два вечера. Заодно проверите, даёт это энергию или выматывает.
  - >-
    Расспросите знакомого, который отвечает за операционку, закупки или финансы, из чего реально состоит его рабочий
    день и что в нём самое скучное.
  - >-
    Пройдите бесплатный вводный курс по управлению проектами или финансовой грамотности и посмотрите, дочитаете ли вы
    его до конца без принуждения.
