slug: interes-k-organizatorskoy-rabote
version: 1.0.0
title: Тест на интерес к организаторской работе
seoTitle: Тест на интерес к организаторской работе — бесплатно, 13 вопросов
description: >-
  Бесплатный тест из 13 вопросов о том, насколько вам интересна организаторская работа: бюджеты, графики, учёт, закупки
  и управление процессами. Без регистрации.
category: career
ctaCluster: career
minutes: 3
passport:
  measures: >-
    Шкала показывает, насколько вам интересны занятия, связанные с планированием, учётом, финансами и управлением
    рабочими процессами.
  origin: >-
    Шкала опросника профессиональных интересов ORVIS (Oregon Vocational Interest Scales; Pozzebon, Visser, Ashton, Lee &
    Goldberg, 2010) из международного пула пунктов IPIP, измеряющая конструкт «интерес к организаторской работе».
    Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    Ни коэффициент надёжности англоязычного оригинала, ни проверка русского перевода не опубликованы — относитесь к
    результату как к поводу подумать, а не к измерению.
  limitations: >-
    Шкала показывает интерес, а не способности и не пригодность к профессии: нравится — не то же самое, что получается.
    Нормы российской выборки не собраны, вы видите процент от максимума шкалы, а не сравнение с другими людьми, поэтому
    читайте результат как повод присмотреться к направлению, а не как рекомендацию по выбору работы.
instruction: >-
  Оценивайте, насколько вам нравится такая деятельность, независимо от того, умеете вы это или нет и сколько за это
  платят.
options:
  - text: Совсем не нравится
    value: 0
  - text: Скорее не нравится
    value: 1
  - text: Скорее нравится
    value: 2
  - text: Очень нравится
    value: 3
scales:
  - id: total
    name: интерес к организаторской работе
    high: тянет наводить порядок в делах, деньгах и процессах
    low: организационная рутина не увлекает
    bands:
      - from: 0
        label: низкий
        text: >-
          Дела, где нужно вести учёт, следить за деньгами и держать процессы под контролем, вас скорее не притягивают.
          Таблицы, графики и отчётность вы, вероятно, охотно передали бы кому-то другому. Низкий балл — не недостаток:
          он говорит об отсутствии интереса именно к этому виду деятельности, а не о том, что вы неаккуратны или не
          справитесь. Интерес и способности — разные вещи: многие ведут документы безупречно, не получая от этого
          никакого удовольствия. Если работа всё же требует порядка, выручают внешние опоры — шаблоны, напоминания,
          помощь коллег.
      - from: 40
        label: средний
        text: >-
          Организационная сторона дела вам не чужда, но и не захватывает. Скорее всего, вы спокойно составите план или
          проследите за бюджетом, если это часть общей задачи, но искать такую работу специально не станете. Средний
          балл часто означает гибкость: порядок в проекте вы можете взять на себя, а можете уступить тому, кому это
          интереснее. Помните, что нравится и получается — разные вещи: умение вести дела вполне может быть выше, чем
          интерес к ним. Присмотритесь, какие именно задачи из списка вызвали отклик, — обычно там и прячется зацепка.
      - from: 70
        label: высокий
        text: >-
          Вас притягивает всё, что можно упорядочить: бюджеты, графики, склады, базы данных, зоны ответственности.
          Наводить порядок в делах для вас скорее удовольствие, чем повинность. Это повод присмотреться к направлениям,
          где ценят администрирование, финансы, логистику и управление процессами, — но не готовый ответ о профессии.
          Высокий интерес не гарантирует результата: нравится и получается — разные вещи, и навыки всё равно придётся
          набирать отдельно. Разумно проверить интерес на небольшой практике, прежде чем строить на нём планы.
