slug: obschitelnost
version: 1.0.0
title: Тест на общительность
seoTitle: Тест на общительность онлайн — бесплатно, 10 вопросов
description: >-
  Шкала общительности IPIP: 10 утверждений о вечеринках, компаниях, толпе и потребности в тишине. Занимает около 2
  минут, результат — сразу после прохождения.
category: relationships
ctaCluster: relationships
minutes: 3
passport:
  measures: Насколько сильно вам нужны компании и большие группы людей и где вы восстанавливаете силы.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт
    «Общительность». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.79 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: Общительность
    high: тянетесь к людям и компаниям
    low: выбираете тишину и уединение
    bands:
      - from: 0
        label: низкая
        text: >-
          Шумные компании и толпа вас утомляют, вы выбираете тишину и общение один на один. Это не про неумение
          общаться, а про то, где восстанавливаются силы. Наедине с собой вам обычно хорошо.
      - from: 40
        label: средняя
        text: >-
          Компании радуют, если их в меру: вечеринка раз в неделю — да, каждый день — уже нет. Вы умеете и включиться в
          группу, и вовремя уйти в тишину. Гибкий и удобный вариант.
      - from: 70
        label: высокая
        text: >-
          Вам нужны люди: в группе вы оживаете, легко собираете компанию вокруг себя и скучаете в одиночестве. Энергия
          приходит от общения, а не от уединения. Стоит следить, чтобы за плотным графиком встреч не терялись отдых и
          глубокие разговоры.
questions:
  - id: q1
    text: Люблю большие вечеринки.
    scales:
      - scale: total
  - id: q2
    text: Общаюсь на вечеринках с самыми разными людьми.
    scales:
      - scale: total
  - id: q3
    text: Люблю быть частью компании.
    scales:
      - scale: total
  - id: q4
    text: Втягиваю других в свои занятия.
    scales:
      - scale: total
  - id: q5
    text: Обожаю вечеринки-сюрпризы.
    scales:
      - scale: total
  - id: q6
    text: Предпочитаю проводить время в одиночестве.
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Хочу, чтобы меня оставили в покое.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Не люблю многолюдные мероприятия.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Избегаю толпы.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Ищу тишину.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Договаривайтесь не просто встретиться, а о конкретном формате и времени окончания. И тихим, и шумным людям легче
    согласиться на два часа в понятном месте, чем на бессрочное «посидим».
  - >-
    Если после компаний вы выжаты, закладывайте час тишины сразу после встречи — восстановление важнее, чем количество
    встреч.
  - >-
    Ищите форматы с общим делом: мастер-класс, волейбол, настолки. Там общение возникает само, без задачи всё время
    поддерживать разговор.
