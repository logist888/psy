slug: priverzhennost-tradiciyam
version: 1.0.0
title: Тест на приверженность традициям
seoTitle: Тест на приверженность традициям онлайн — бесплатно, 10 вопросов
description: >-
  Показывает, насколько вам близки традиции, порядок и привычные нормы, а не пересмотр правил. 10 вопросов, около 3
  минут. Это самоотчёт, а не диагностика.
category: values
ctaCluster: self
minutes: 3
passport:
  measures: Шкала показывает, насколько вы опираетесь на традиции, порядок и устоявшиеся нормы.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт
    «приверженность традициям». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.83 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: приверженность традициям
    high: ценит порядок, преемственность и проверенное
    low: готов пересматривать нормы и правила
    bands:
      - from: 0
        label: низкая
        text: >-
          Правила для вас — рабочая договорённость, которую можно пересмотреть, а не святыня. Вы спокойно относитесь к
          непохожим взглядам и легко принимаете новое. Цена — вместе с устаревшим иногда уходит то, что держало людей
          вместе, и общие ориентиры приходится собирать заново.
      - from: 40
        label: средняя
        text: >-
          Часть традиций вам дорога, часть кажется отжившей, и вы разбираете их по отдельности. Такая позиция помогает
          договариваться с очень разными людьми. Минус — от вас ждут ясной стороны, а вы её не занимаете, и обе стороны
          считают вас не своим.
      - from: 70
        label: высокая
        text: >-
          Вам важны порядок, преемственность и понятные общие правила; проверенное вызывает больше доверия, чем модное.
          Это даёт опору и вам, и людям рядом — рядом с вами понятно, чего ждать. Обратная сторона — новое иногда
          отсеивается ещё до того, как вы его рассмотрели.
questions:
  - id: q1
    text: Обычно голосую за консервативных политиков.
    scales:
      - scale: total
  - id: q2
    text: Верю, что истинная религия только одна.
    scales:
      - scale: total
  - id: q3
    text: Считаю, что законы должны исполняться строго.
    scales:
      - scale: total
  - id: q4
    text: Считаю, что с преступностью нужно бороться жёстко.
    scales:
      - scale: total
  - id: q5
    text: Люблю вставать, когда играет гимн.
    scales:
      - scale: total
  - id: q6
    text: Обычно голосую за либеральных политиков.
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Не считаю себя верующим человеком.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Считаю, что преступникам нужнее помощь, чем наказание.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Считаю искусство важной частью жизни.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Считаю, что абсолютного добра и зла не бывает.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Про каждое привычное правило спрашивайте: какую проблему оно когда-то решало? Часть правил живее, чем кажется, часть
    держится на одной инерции.
  - >-
    Раз в сезон разбирайте одну тему, где ваша позиция сложилась давно, по первоисточникам, а не по пересказам
    единомышленников.
  - >-
    В споре с несогласным начинайте с общей ценности, а не с вывода: спорить вы будете о выводах, а договариваться — о
    ценностях.
