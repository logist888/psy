slug: skromnost
version: 1.0.0
title: Тест на скромность
seoTitle: Тест на скромность онлайн — бесплатно, 10 вопросов
description: >-
  Онлайн-тест на скромность по шкале IPIP: 10 утверждений о том, насколько вы склонны держаться в тени и не выставлять
  себя напоказ. Примерно 3 минуты.
category: values
ctaCluster: self
minutes: 3
passport:
  measures: Шкала измеряет, насколько человек склонен преуменьшать собственную значимость и избегать внимания к себе.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт «скромность».
    Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.77 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: скромность
    high: держитесь в тени и не говорите о своих заслугах
    low: знаете себе цену и не прячете это
    bands:
      - from: 0
        label: низкая
        text: >-
          Вы знаете себе цену и не считаете нужным это скрывать. Такая манера выручает там, где нужно быстро заявить о
          себе — на собеседовании, в переговорах, в новой команде. Цена — часть людей воспримет уверенность как
          соперничество и начнёт считать очки.
      - from: 40
        label: средняя
        text: >-
          О своих сильных сторонах вы говорите, когда это уместно, но не делаете их фоном разговора. Обычно вы
          чувствуете, где нужна витрина, а где достаточно результата. В незнакомой компании чаще выбираете подождать и
          осмотреться.
      - from: 70
        label: высокая
        text: >-
          Вы не любите быть в центре внимания и редко рассказываете о собственных заслугах. Рядом с вами никто не
          чувствует себя фоном, и это располагает людей. Цена — ваш вклад иногда остаётся незамеченным, а описывают его
          те, кто говорит громче.
questions:
  - id: q1
    text: Не люблю быть в центре внимания.
    scales:
      - scale: total
  - id: q2
    text: Не люблю рассказывать о себе.
    scales:
      - scale: total
  - id: q3
    text: Считаю себя обычным человеком.
    scales:
      - scale: total
  - id: q4
    text: Редко хвастаюсь своими успехами.
    scales:
      - scale: total
  - id: q5
    text: Считаю, что я лучше других.
    scales:
      - scale: total
        reverse: true
  - id: q6
    text: Думаю о себе очень хорошо.
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Не сомневаюсь в собственных достоинствах.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Знаю ответы на многие вопросы.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Хвалюсь своими достоинствами.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Стараюсь оказаться в центре внимания.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Держите личный файл фактов: что сделали, с каким результатом, в каких цифрах. Это не хвастовство, а материал,
    который выручит на любом разговоре о вас.
  - >-
    Тренируйте нейтральную формулировку: не «да ерунда, повезло», а «я вёл этот проект, вышло так». Факт без оценки не
    звучит ни как скромность, ни как похвальба.
  - >-
    Если тянет рассказать о себе, задайте сначала один вопрос собеседнику. Обмен вниманием считывается совершенно иначе,
    чем монолог.
