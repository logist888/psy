slug: attachment
version: 1.0.0
title: Тест на стиль привязанности
seoTitle: "Тест на стиль привязанности онлайн — бесплатно, без регистрации"
description: Два измерения близких отношений — тревога и избегание. Узнайте свой стиль привязанности за 12 утверждений и 3 минуты.
category: relationships
ctaCluster: relationships
minutes: 3
passport:
  measures: Два независимых измерения привязанности в близких отношениях — тревогу (страх отвержения и потребность в подтверждениях) и избегание (дискомфорт от близости и зависимости).
  origin: Собственная разработка проекта на основе двухмерной модели привязанности взрослых. Пункты написаны с нуля.
  rightsBasis: own_work
  rightsNote: Формулировки принадлежат проекту. Двухмерная модель привязанности как научная концепция авторским правом не охраняется.
  reliability: Опросник новый и независимой психометрической проверки не проходил. Считайте результат поводом для размышления.
  limitations: Стиль привязанности меняется в зависимости от партнёра и этапа отношений. Опросник описывает ваш привычный способ быть в близости, а не постоянное свойство и тем более не приговор отношениям.
instruction: Подумайте о своих близких отношениях — нынешних или прошлых. Насколько каждое утверждение похоже на вас?
options:
  - text: "Совсем не про меня"
    value: 0
  - text: "Скорее не про меня"
    value: 1
  - text: "Скорее про меня"
    value: 2
  - text: "Точно про меня"
    value: 3
scales:
  - id: anxiety
    name: Тревога в отношениях
    high: страх отвержения, потребность в подтверждениях
    low: спокойная уверенность в отношениях
    bands:
      - from: 0
        label: "низкая"
        text: "Вы спокойно переносите паузы и дистанцию: молчание партнёра не означает для вас угрозу отношениям."
      - from: 40
        label: "умеренная"
        text: "Вам важны подтверждения близости, и вы заметно реагируете на охлаждение, но не теряете почву под ногами."
      - from: 70
        label: "высокая"
        text: "Вы остро реагируете на любые признаки отдаления, и тревога в отношениях занимает много сил. Это распространённый паттерн, и он поддаётся изменению в терапии."
  - id: avoidance
    name: Избегание близости
    high: дискомфорт от зависимости и эмоциональной открытости
    low: комфорт в близости
    bands:
      - from: 0
        label: "низкое"
        text: "Вам комфортно быть близким и зависеть от партнёра, вы легко открываетесь."
      - from: 40
        label: "умеренное"
        text: "Вам нужно больше личного пространства, чем принято, и вы не всегда готовы делиться переживаниями."
      - from: 70
        label: "высокое"
        text: "Близость и зависимость ощущаются как угроза самостоятельности. Дистанция — привычный способ чувствовать себя в безопасности, а не отсутствие чувств."
questions:
  - id: q1
    text: "Я боюсь, что партнёр перестанет меня любить."
    scales:
      - scale: anxiety
  - id: q2
    text: "Я часто беспокоюсь, что значу для партнёра меньше, чем он для меня."
    scales:
      - scale: anxiety
  - id: q3
    text: "Когда партнёр долго не отвечает, я начинаю думать, что что-то не так."
    scales:
      - scale: anxiety
  - id: q4
    text: "Мне нужно, чтобы партнёр часто подтверждал свои чувства."
    scales:
      - scale: anxiety
  - id: q5
    text: "Я спокойно переношу, когда партнёр занят своими делами и мы не на связи."
    scales:
      - scale: anxiety
        reverse: true
  - id: q6
    text: "Я редко переживаю, что меня бросят."
    scales:
      - scale: anxiety
        reverse: true
  - id: q7
    text: "Мне некомфортно, когда партнёр хочет очень большой близости."
    scales:
      - scale: avoidance
  - id: q8
    text: "Мне трудно рассказывать партнёру о своих чувствах."
    scales:
      - scale: avoidance
  - id: q9
    text: "Я предпочитаю не зависеть от партнёра."
    scales:
      - scale: avoidance
  - id: q10
    text: "В трудный момент я скорее справлюсь сам, чем попрошу поддержки."
    scales:
      - scale: avoidance
  - id: q11
    text: "Мне легко открываться близкому человеку."
    scales:
      - scale: avoidance
        reverse: true
  - id: q12
    text: "Мне комфортно, когда партнёр эмоционально близко."
    scales:
      - scale: avoidance
        reverse: true
crisis: []
selfHelp:
  - Тревога и избегание — не характер партнёров, а способ каждого справляться со страхом. Понимание этого само по себе снижает накал ссор, потому что снимает интерпретацию «он специально».
  - "Заметьте свой сигнал тревоги раньше реакции: обычно между «партнёр не ответил» и «я пишу пятое сообщение» есть 20–30 секунд, в которые можно вмешаться."
  - Если у вас высокая тревога, а у партнёра — избегание, вы попали в самую частую пару. Выход не в том, чтобы кто-то один изменился, а в договорённостях о темпе сближения.
