slug: temperament
version: 1.0.0
title: Тест на темперамент
seoTitle: Тест на темперамент онлайн — холерик, сангвиник, флегматик, меланхолик
description: Два свойства нервной системы — сила реакции и её устойчивость — складываются в четыре классических темперамента.
  20 утверждений, около 4 минут.
category: personality
ctaCluster: self
minutes: 4
passport:
  measures: 'Два измерения, из которых складывается классическая типология темперамента: активность (насколько сильно и быстро
    вы реагируете) и устойчивость (насколько ровно держится ваш эмоциональный фон).'
  origin: Собственная разработка проекта. Четыре темперамента — идея, идущая от античной медицины и переосмысленная в психологии
    XX века; современные опросники этого семейства защищены авторским правом, поэтому пункты написаны с нуля.
  rightsBasis: own_work
  rightsNote: 'Формулировки принадлежат проекту. Опросники Айзенка и других авторов не воспроизводились: охраняется текст
    пунктов, а не сама классификация темпераментов.'
  reliability: 'Опросник новый и независимой проверки не проходил. Отдельная оговорка о самой типологии: деление на четыре
    темперамента — историческая, а не современная научная модель. Сегодняшняя психология описывает те же различия непрерывными
    чертами, а не типами.'
  limitations: Темперамент не объясняет поступки и не оправдывает их. Тест не измеряет характер, способности и уж тем более
    не показывает, кем вам работать. Результат — про скорость и силу реакций, не про содержание личности.
instruction: Отвечайте о том, как вы ведёте себя обычно, а не в исключительных ситуациях.
options:
- text: Нет
  value: 0
- text: Скорее нет
  value: 1
- text: Скорее да
  value: 2
- text: Да
  value: 3
scales:
- id: activity
  name: Активность реакции
  high: быстрый, сильный отклик на происходящее
  low: спокойный, размеренный отклик
  bands:
  - from: 0
    label: низкая
    text: Вы реагируете неспешно и вас трудно раскачать. Там, где другие вспыхивают, вы сначала осматриваетесь.
  - from: 40
    label: средняя
    text: 'Скорость реакции зависит от ситуации: где-то вы включаетесь мгновенно, где-то берёте паузу.'
  - from: 70
    label: высокая
    text: Вы реагируете быстро и заметно — включаетесь первым, говорите громче, действуете раньше, чем додумаете.
- id: stability
  name: Эмоциональная устойчивость
  high: ровный фон, редкие перепады
  low: чувствительность, заметные перепады
  bands:
  - from: 0
    label: низкая
    text: Вы тонко чувствуете и близко принимаете. Настроение меняется от мелочей, зато вы замечаете то, что другие пропускают.
  - from: 40
    label: средняя
    text: Вы реагируете на события, но обычно быстро возвращаетесь в равновесие.
  - from: 70
    label: высокая
    text: Вас трудно выбить из колеи. В напряжённой обстановке вы остаётесь тем, кто сохраняет спокойствие.
