- id: q1
  text: Я быстро принимаю решения и сразу начинаю действовать.
  scales:
  - scale: activity
- id: q2
  text: Мне нужно время, чтобы раскачаться и включиться в дело.
  scales:
  - scale: activity
    reverse: true
- id: q3
  text: Я говорю быстро и много жестикулирую.
  scales:
  - scale: activity
- id: q4
  text: В споре я загораюсь мгновенно.
  scales:
  - scale: activity
- id: q5
  text: Я предпочитаю размеренный ритм жизни без спешки.
  scales:
  - scale: activity
    reverse: true
- id: q6
  text: Мне трудно долго сидеть на одном месте.
  scales:
  - scale: activity
- id: q7
  text: Новое дело обычно захватывает меня сразу.
  scales:
  - scale: activity
- id: q8
  text: Я долго втягиваюсь в новую обстановку.
  scales:
  - scale: activity
    reverse: true
- id: q9
  text: Я легко переключаюсь с одного занятия на другое.
  scales:
  - scale: activity
- id: q10
