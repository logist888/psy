crisis: []
selfHelp:
- 'Темперамент удобнее использовать как знание о своём ритме, а не как ярлык: он подсказывает, в каком режиме вам работается
  легче, но ничего не говорит о том, на что вы способны.'
- 'Если активность высокая, а устойчивость низкая — вам сильнее прочих нужны паузы и режим сна: такое сочетание быстрее приводит
  к истощению.'
- Не пытайтесь «сменить темперамент». Меняются привычки и способы обращения с собой, а скорость реакций — свойство нервной
  системы, с которым проще договориться, чем воевать.
