slug: romantichnost
version: 1.0.0
title: Тест на романтичность
seoTitle: Тест на романтичность онлайн — бесплатно, 8 вопросов
description: >-
  Умеете ли вы загораться, радоваться без повода и искать смысл в происходящем? Самоотчётная шкала из 8 вопросов о
  романтическом складе характера.
category: personality
ctaCluster: self
minutes: 2
passport:
  measures: Шкала показывает, насколько вам свойственны страстная увлечённость, беспричинная радость и вкус к смыслу и красоте.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт «романтичность
    и страстность натуры». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.74 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: романтичность и страстность натуры
    high: увлечённость, вдохновение, вкус к смыслу
    low: трезвость, приземлённость, ровный тон
    bands:
      - from: 0
        label: низкая романтичность
        text: >-
          Вы смотрите на вещи трезво и не склонны к восторгам и поиску скрытых смыслов. Решения принимаете по существу,
          а не по вдохновению. Такой взгляд удерживает от разочарований, но иногда обесценивает то, что дорого другим.
      - from: 40
        label: умеренная романтичность
        text: >-
          Вы способны увлечься и порадоваться просто так, не теряя при этом почвы. Красивое и осмысленное вам важно, но
          не заменяет практики. Хорошее сочетание для долгих проектов и отношений.
      - from: 70
        label: высокая романтичность
        text: >-
          Вы легко загораетесь тем, во что верите, радуетесь по-детски и любите разбираться в себе. Рядом с вами
          обыденное становится значимым. Обратная сторона — на спаде вдохновения дела даются заметно тяжелее.
questions:
  - id: q1
    text: Загораюсь идеями, которые считаю важными.
    scales:
      - scale: total
  - id: q2
    text: Бываю счастлив без всякой причины.
    scales:
      - scale: total
  - id: q3
    text: Радуюсь по-детски.
    scales:
      - scale: total
  - id: q4
    text: Люблю разбираться в себе и своей жизни.
    scales:
      - scale: total
  - id: q5
    text: Отдаюсь со страстью всему, чем занимаюсь.
    scales:
      - scale: total
  - id: q6
    text: Люблю цветы.
    scales:
      - scale: total
  - id: q7
    text: Не ищу в вещах глубокого смысла.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Не люблю поэзию.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Переводите вдохновение в первый маленький шаг в тот же день. Восторг проходит быстрее, чем нужно проекту, а
    сделанный шаг остаётся.
  - >-
    Держите список того, что вас зажигало год назад. Он показывает, что для вас настоящий интерес, а что просто красивая
    вспышка.
  - >-
    Если восторги вам чужды, не подделывайте их — спрашивайте у близких, что для них значит важное событие. Разделить
    смысл можно и без общего накала.
