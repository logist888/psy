slug: kreativnost
version: 1.0.0
title: Тест на креативность
seoTitle: Тест на креативность онлайн — бесплатно, 10 вопросов
description: >-
  Шкала креативности: 10 утверждений, около 3 минут. Показывает, насколько вас притягивают сложные задачи, воображение и
  поиск новых способов сделать дело. Это самоотчёт, а не диагностика.
category: personality
ctaCluster: self
minutes: 3
passport:
  measures: >-
    Шкала показывает, насколько вас притягивают сложные задачи, работа воображения и поиск новых способов сделать
    привычное дело.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт
    «креативность». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.83 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: креативность
    high: тяга к сложным задачам, воображение, поиск новых решений
    low: опора на простые, понятные и проверенные способы
    bands:
      - from: 0
        label: низкая
        text: >-
          Судя по ответам, вы не ищете сложности ради сложности: если задача решается известным способом, вы им и
          воспользуетесь. Это экономит силы и время — пока другие изобретают, вы уже сделали. Цена — задачи без готового
          рецепта раздражают, а идеи «на вырост» откладываются до лучших времён. Стоит учесть, что креативность нередко
          путают с умением фантазировать вслух, хотя ваша сильная сторона может быть в аккуратной доводке чужих находок.
          Если хочется расшевелить воображение, начинать проще не с чистого листа, а с переделки готового.
      - from: 40
        label: средняя
        text: >-
          Вы включаетесь в непростые задачи, но не гоняетесь за ними: интересное разбираете охотно, скучное делаете по
          накатанной. Такой баланс удобен в работе — есть и запас идей, и готовность довести рутину до конца.
          Ограничение в том, что творческая часть обычно запускается под внешний запрос: когда никто не просит, до неё
          не доходят руки. Присмотритесь, в каких задачах вы оживаете — там ваш потолок заметно выше вашего среднего
          результата. И держится он на регулярности, а не на вдохновении.
      - from: 70
        label: высокая
        text: >-
          Ответы говорят о сильной тяге к сложному: вам нравится разбираться, как всё устроено, придумывать новые
          способы и читать то, что требует усилия. Это заметное преимущество там, где готовых решений нет. Цена —
          интерес остывает, как только задача стала понятной, и до финиша доходит не всё начатое, а простые дела кажутся
          невыносимо скучными. Окружающим бывает трудно за вами успевать, и часть идей теряется просто потому, что вы их
          не объяснили. Помогает привычка доводить хотя бы одну идею в месяц до вида, в котором ею может воспользоваться
          кто-то ещё.
questions:
  - id: q1
    text: Люблю решать сложные задачи.
    scales:
      - scale: total
  - id: q2
    text: Люблю читать сложные тексты.
    scales:
      - scale: total
  - id: q3
    text: Люблю придумывать новые способы что-то сделать.
    scales:
      - scale: total
  - id: q4
    text: У меня живое воображение.
    scales:
      - scale: total
  - id: q5
    text: Разбираюсь в том, как всё устроено.
    scales:
      - scale: total
  - id: q6
    text: Абстрактные идеи мне неинтересны.
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Мне неинтересны теоретические споры.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Избегаю сложного чтения.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Стараюсь держаться подальше от сложных людей.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Воображение у меня так себе.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Возьмите одну рабочую или бытовую задачу и придумайте для неё три разных решения, прежде чем начать делать.
    Небанальным обычно оказывается третье.
  - >-
    Заведите список «непонятного»: всё, в чём вы не разобрались в своей области. Раз в неделю выбирайте один пункт и
    копайте час — без цели, просто до ясности.
  - >-
    Доведите до конца что-то одно из начатого раньше: выберите проект, который лежит дольше месяца, и отдайте ему два
    вечера на этой неделе.
