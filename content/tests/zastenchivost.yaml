slug: zastenchivost
version: 1.0.0
title: Тест на застенчивость
seoTitle: Тест на застенчивость онлайн — бесплатно, 10 вопросов
description: >-
  Шкала застенчивости IPIP: 10 утверждений о смущении, страхе внимания и лёгкости общения с незнакомыми людьми. Занимает
  около 2 минут, результат — сразу.
category: personality
ctaCluster: self
minutes: 3
passport:
  measures: Насколько сильно вас смущает внимание окружающих и незнакомые социальные ситуации.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт
    «Застенчивость». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.80 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: Застенчивость
    high: смущаетесь и избегаете внимания
    low: держитесь свободно даже с незнакомыми
    bands:
      - from: 0
        label: низкая
        text: >-
          В незнакомой компании вы чувствуете себя свободно, легко заговариваете первым и не боитесь оказаться в центре
          внимания. Неловкие моменты почти вас не задевают. Полезно помнить, что более стеснительным людям рядом нужно
          чуть больше времени на разгон.
      - from: 40
        label: средняя
        text: >-
          Волнение появляется в новых компаниях и при выступлениях, но проходит, когда вы освоились. Иногда вы
          прокручиваете, как выглядели со стороны, — и это не мешает знакомиться и говорить. Обычный расклад для
          большинства людей.
      - from: 70
        label: высокая
        text: >-
          Внимание других ощущается как оценка, поэтому часто проще промолчать, чем рискнуть. Это не навсегда:
          застенчивость снижается от практики маленькими шагами, а не от попыток просто перестать стесняться. При этом
          со своими людьми вы, скорее всего, общаетесь легко и глубоко.
questions:
  - id: q1
    text: Легко робею перед другими людьми.
    scales:
      - scale: total
  - id: q2
    text: Боюсь сделать что-то не так.
    scales:
      - scale: total
  - id: q3
    text: Долго решаюсь заговорить с незнакомым человеком.
    scales:
      - scale: total
  - id: q4
    text: Боюсь привлекать к себе внимание.
    scales:
      - scale: total
  - id: q5
    text: Расслабляюсь только среди своих.
    scales:
      - scale: total
  - id: q6
    text: Запинаюсь и путаюсь в словах.
    scales:
      - scale: total
  - id: q7
    text: Редко смущаюсь.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Чувствую себя свободно в незнакомой обстановке.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Не теряюсь в неловких ситуациях общения.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Умею за себя постоять.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Готовьте не то, что сказать, а два вопроса собеседнику. Внимание переключается с себя на другого, и телесное
    напряжение падает почти сразу.
  - >-
    Тренируйте мелкие социальные риски по нарастающей: спросить время, вернуть товар, попросить скидку. Цель не в
    успехе, а в том, чтобы обнаружить: неловкость проходит за пару минут.
  - >-
    Если страх оценки заставляет отказываться от работы, учёбы или встреч, которые вам важны, это повод поговорить со
    специалистом — социальная тревога хорошо поддаётся коррекции.
