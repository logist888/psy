slug: optimizm
version: 1.0.0
title: Тест на оптимизм
seoTitle: Тест на оптимизм онлайн — бесплатно, 10 вопросов
description: >-
  Тест из 10 утверждений о том, смотрите ли вы вперёд с надеждой, понимаете ли, чего хотите, и кто на самом деле
  определяет ваши решения.
category: personality
ctaCluster: self
minutes: 3
passport:
  measures: Шкала оценивает надежду на хорошее, ощущение направления в жизни и опору на собственный выбор.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт «оптимизм».
    Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.71 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: оптимизм
    high: смотрите вперёд с надеждой и знаете, чего хотите
    low: чаще готовитесь к худшему и плохо видите направление
    bands:
      - from: 0
        label: невысокий оптимизм
        text: >-
          Сейчас вам трудно поверить, что дальше будет лучше, а направление собственной жизни выглядит размытым. Такая
          позиция бережёт от разочарований и помогает замечать риски, которые оптимисты пропускают. Стоит проверить,
          действительно ли направления нет — или вы просто давно не задавали себе этот вопрос.
      - from: 40
        label: средний оптимизм
        text: >-
          Надежда у вас есть, но включается не всегда: в знакомых делах вы уверены, в новых ждёте подвоха. Решения чаще
          ваши, хотя иногда проще согласиться с чужим вариантом. Режим устойчивый, если отслеживать, где именно вы
          уступаете без желания.
      - from: 70
        label: высокий оптимизм
        text: >-
          Вы редко теряете надежду, понимаете, чего хотите, и не отдаёте выбор другим. Это тянет вас через периоды,
          когда результата ещё не видно. Обратная сторона — легко недооценить реальные препятствия, поэтому полезен
          рядом человек, который спокойно называет риски.
questions:
  - id: q1
    text: Не теряю надежду даже в плохие времена.
    scales:
      - scale: total
  - id: q2
    text: Люблю жизнь.
    scales:
      - scale: total
  - id: q3
    text: Работаю над собой.
    scales:
      - scale: total
  - id: q4
    text: Продолжаю развиваться.
    scales:
      - scale: total
  - id: q5
    text: Знаю, чего хочу.
    scales:
      - scale: total
  - id: q6
    text: Чувствую, что моя жизнь идёт непонятно куда.
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Не представляю, куда движется моя жизнь.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Смиряюсь с тем, что судьбу не изменить.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Позволяю другим решать за меня.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Соглашаюсь на что угодно.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Формулируйте направление на год, а не на всю жизнь: расплывчатое «куда я иду» проясняется быстрее, когда горизонт
    короче.
  - >-
    Отслеживайте, где вы говорите «да» из нежелания спорить. Одно такое согласие в неделю, отменённое вслух, заметно
    возвращает ощущение авторства.
  - >-
    Держите список случаев, когда вышло лучше ожиданий: память сама по себе хранит провалы подробнее, чем удачи, и
    список выравнивает эту асимметрию.
