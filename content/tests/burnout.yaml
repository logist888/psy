slug: burnout
version: 1.0.0
title: Тест на выгорание
seoTitle: "Тест на выгорание онлайн — бесплатно, без регистрации"
description: Проверьте три признака выгорания — истощение, отстранённость и потерю смысла в работе. 15 утверждений, около 4 минут.
category: wellbeing
ctaCluster: burnout
minutes: 4
passport:
  measures: Три составляющие профессионального выгорания — эмоциональное истощение, отстранённость от работы и людей, ощущение бессмысленности усилий.
  origin: Собственная разработка проекта на основе трёхкомпонентной модели выгорания. Пункты написаны с нуля и не воспроизводят защищённые авторским правом опросники.
  rightsBasis: own_work
  rightsNote: Формулировки принадлежат проекту. Общепринятая трёхкомпонентная модель выгорания как научная концепция авторским правом не охраняется.
  reliability: Опросник новый и пока не прошёл независимую психометрическую проверку. Считайте результат поводом задуматься, а не измерением.
  limitations: Выгорание — состояние, а не болезнь и не диагноз. Похожие ощущения дают недосып, физическое истощение, депрессия и тревожные состояния — по опроснику их различить нельзя.
instruction: Вспомните последние две-три недели работы. Насколько каждое утверждение похоже на то, что вы переживаете?
options:
  - text: "Никогда"
    value: 0
  - text: "Редко"
    value: 1
  - text: "Иногда"
    value: 2
  - text: "Часто"
    value: 3
  - text: "Почти всегда"
    value: 4
scales:
  - id: exhaustion
    name: Истощение
    high: сил не остаётся даже после отдыха
    low: энергии хватает на работу и на жизнь после неё
    bands:
      - from: 0
        label: "в норме"
        text: "Силы восстанавливаются. Усталость приходит, но выходные и сон возвращают вас в рабочее состояние."
      - from: 40
        label: "заметное"
        text: "Усталость накапливается быстрее, чем уходит. Выходных уже не всегда хватает, чтобы восстановиться."
      - from: 70
        label: "высокое"
        text: "Ресурс исчерпан: усталость стала фоном, отдых почти не помогает. Это состояние редко проходит само."
  - id: detachment
    name: Отстранённость
    high: работа и люди в ней вызывают раздражение и безразличие
    low: сохраняется живой контакт с делом и коллегами
    bands:
      - from: 0
        label: "в норме"
        text: "Вы остаётесь в контакте с работой и людьми вокруг неё."
      - from: 40
        label: "заметная"
        text: "Появилось желание держать дистанцию: меньше разговоров, больше формальности, чаще раздражение."
      - from: 70
        label: "высокая"
        text: "Вы отгородились от работы и людей. Цинизм и безразличие — типичная защита истощённой психики, а не черта характера."
  - id: efficacy
    name: Потеря смысла
    high: усилия кажутся бесполезными, достижения обесцениваются
    low: вы видите результат своей работы
    bands:
      - from: 0
        label: "в норме"
        text: "Вы видите отдачу от своей работы и признаёте собственные результаты."
      - from: 40
        label: "заметная"
        text: "Всё чаще кажется, что усилия уходят в пустоту, а сделанное не считается достижением."
      - from: 70
        label: "высокая"
        text: "Работа ощущается бессмысленной, а собственные успехи не засчитываются. Это искажение восприятия, типичное для выгорания, — оно обратимо."
questions:
  - id: q1
    text: "К концу рабочего дня я чувствую себя полностью опустошённым."
    scales:
      - scale: exhaustion
  - id: q2
    text: "Утром, ещё не начав работать, я уже чувствую усталость."
    scales:
      - scale: exhaustion
  - id: q3
    text: "После выходных я возвращаюсь к работе отдохнувшим."
    scales:
      - scale: exhaustion
        reverse: true
  - id: q4
    text: "Мне физически тяжело заставить себя начать рабочие дела."
    scales:
      - scale: exhaustion
  - id: q5
    text: "Сон перестал восстанавливать мои силы."
    scales:
      - scale: exhaustion
  - id: q6
    text: "Я стал раздражаться на людей, с которыми работаю."
    scales:
      - scale: detachment
  - id: q7
    text: "Я делаю рабочие задачи формально, лишь бы отделаться."
    scales:
      - scale: detachment
  - id: q8
    text: "Мне интересно то, чем я занимаюсь на работе."
    scales:
      - scale: detachment
        reverse: true
  - id: q9
    text: "Я стараюсь свести общение по работе к минимуму."
    scales:
      - scale: detachment
  - id: q10
    text: "Мысль о завтрашнем рабочем дне вызывает у меня тяжесть."
    scales:
      - scale: detachment
  - id: q11
    text: "Мне кажется, что моя работа ничего не меняет."
    scales:
      - scale: efficacy
  - id: q12
    text: "Я доволен тем, чего добиваюсь в работе."
    scales:
      - scale: efficacy
        reverse: true
  - id: q13
    text: "Я сомневаюсь, что справляюсь со своими задачами."
    scales:
      - scale: efficacy
  - id: q14
    text: "Мои усилия остаются незамеченными и не приносят результата."
    scales:
      - scale: efficacy
  - id: q15
    text: "У меня появилось чувство, что дальше ничего не изменится, и оно не проходит."
    scales:
      - scale: efficacy
crisis:
  - question: q15
    minValue: 4
selfHelp:
  - "Начните с восстановления сна и границ рабочего дня: без этого любые другие меры против истощения не работают. Одна неделя с фиксированным временем отбоя даёт больше, чем месяц мотивационных усилий."
  - Отделите то, на что вы влияете, от того, на что нет. Выгорание чаще растёт из хронического бессилия что-то изменить, чем из объёма задач.
  - Верните в неделю хотя бы одно дело, которое делаете не ради результата. Это самый быстрый способ вернуть ощущение смысла, которое уходит первым.
  - "Если истощение держится дольше трёх месяцев или к нему добавились нарушения сна и аппетита, стоит поговорить со специалистом: похожие симптомы даёт депрессия, и различить их самостоятельно нельзя."
