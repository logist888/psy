slug: pogruzhennost-v-perezhivaniya
version: 1.0.0
title: Тест на погружённость в переживания
seoTitle: Тест на погружённость онлайн — бесплатно, 9 вопросов
description: >-
  Умеете ли вы уходить в мысли, образы и фантазии с головой? Самоотчётная шкала из 9 вопросов о яркости воображения и
  глубине внутренних переживаний.
category: personality
ctaCluster: self
minutes: 2
passport:
  measures: Шкала показывает, насколько легко вы погружаетесь в размышления, образы и впечатления, теряя счёт внешнему.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт «погружённость
    в переживания и воображение». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.78 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: погружённость в переживания и воображение
    high: яркое воображение, глубина переживаний
    low: практичность, опора на внешнее и конкретное
    bands:
      - from: 0
        label: низкая погружённость
        text: >-
          Вы держитесь конкретного и происходящего вокруг, а не внутренних картин. Мечтания и поиски скрытого смысла
          занимают у вас мало места. Это экономит силы и держит внимание там, где нужно действовать.
      - from: 40
        label: умеренная погружённость
        text: >-
          Вы способны уйти в мысли или впечатление, но возвращаетесь без труда. Искусство и размышления вам интересны,
          хотя жизнь ими не заслоняется. Внутренний мир работает как ресурс, а не как отдельная реальность.
      - from: 70
        label: высокая погружённость
        text: >-
          Мысль, музыка или образ могут захватить вас целиком, и внешнее на время исчезает. Вы замечаете оттенки и
          смыслы, мимо которых другие проходят. Обратная сторона — можно выпасть из момента, когда рядом ждут вашего
          внимания.
questions:
  - id: q1
    text: Люблю смелые полёты фантазии.
    scales:
      - scale: total
  - id: q2
    text: Люблю уходить в свои мысли.
    scales:
      - scale: total
  - id: q3
    text: Обожаю размышлять о происходящем.
    scales:
      - scale: total
  - id: q4
    text: Обладаю живым воображением.
    scales:
      - scale: total
  - id: q5
    text: Обожаю мечтать наяву.
    scales:
      - scale: total
  - id: q6
    text: Не люблю поэзию.
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Не люблю искусство.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Погружаюсь в раздумья редко.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Не ищу в вещах глубокого смысла.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Отведите воображению рабочее место: 20 минут без телефона и задачи. Погружённость, у которой есть своё время, реже
    прорывается в неподходящий момент.
  - >-
    Записывайте то, что приходит в такие состояния, сразу. Ценность этих находок исчезает быстрее, чем кажется изнутри
    переживания.
  - >-
    Если внутрь уйти трудно, начинайте не с мыслей, а с сенсорного: одна песня целиком без дел, прогулка без наушников,
    длинный взгляд на одну картину.
