slug: tyaga-k-raznoobraziyu
version: 1.0.0
title: Тест на тягу к новизне
seoTitle: Тест на тягу к новизне онлайн — бесплатно, 10 вопросов
description: >-
  Что вас больше устраивает — привычный уклад или постоянная смена декораций? 10 вопросов о том, как вы относитесь к
  переменам, новым местам и незнакомым идеям.
category: personality
ctaCluster: self
minutes: 3
passport:
  measures: Шкала показывает, насколько вас притягивают перемены, новые места и идеи — и насколько утомляет однообразие.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт «тяга к
    разнообразию и новизне». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.80 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: тяга к разнообразию и новизне
    high: интерес к новому, лёгкость перемен
    low: верность привычному, любовь к устойчивости
    bands:
      - from: 0
        label: низкая тяга к новизне
        text: >-
          Вы цените понятный распорядок и проверенные решения. Перемены принимаете, когда видите в них смысл, а не ради
          самого движения. Благодаря этому вы доводите начатое до конца там, где другие уже переключились на следующее.
      - from: 40
        label: умеренная тяга к новизне
        text: >-
          Вам нравится обновлять жизнь, но не сносить её основание. Часть дел вы держите в устойчивом режиме, а часть
          меняете и пробуете. Это позволяет и накапливать опыт, и не застаиваться.
      - from: 70
        label: высокая тяга к новизне
        text: >-
          Однообразие вы переносите тяжело, а новое место, идея или задача заметно вас оживляют. Вы легко
          перестраиваетесь и первым берётесь за незнакомое. Сложнее даётся длинная рутинная фаза, которая идёт после
          старта.
questions:
  - id: q1
    text: Предпочитаю разнообразие рутине.
    scales:
      - scale: total
  - id: q2
    text: Люблю придумывать новые способы делать привычные дела.
    scales:
      - scale: total
  - id: q3
    text: Принимаю перемены спокойно.
    scales:
      - scale: total
  - id: q4
    text: Люблю слушать новые идеи.
    scales:
      - scale: total
  - id: q5
    text: Ищу приключений.
    scales:
      - scale: total
  - id: q6
    text: Люблю браться за новое.
    scales:
      - scale: total
  - id: q7
    text: Люблю бывать в новых местах.
    scales:
      - scale: total
  - id: q8
    text: Не люблю саму мысль о переменах.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Не люблю перемены.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Предпочитаю держаться привычного.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Разделите дела на те, где новизна приносит пользу, и те, где она стоит денег и времени. Экспериментируйте в первых,
    а во вторых сознательно оставляйте скуку.
  - >-
    Если начатое надоедает, меняйте не проект, а способ: инструмент, место, формат, напарника. Часто голод по новизне
    утоляется этим полностью.
  - >-
    Перед сменой курса выждите 72 часа и запишите причину. Решения, дожившие до третьего дня, обычно про смысл, а не про
    усталость от однообразия.
