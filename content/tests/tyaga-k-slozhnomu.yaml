slug: tyaga-k-slozhnomu
version: 1.0.0
title: Тест на тягу к сложному
seoTitle: Тест на тягу к сложному онлайн — бесплатно, 10 вопросов
description: >-
  Показывает, насколько вас тянет к сложным идеям, искусству и разговорам без простых ответов. 10 вопросов, около 3
  минут. Это самоотчёт, а не диагностика.
category: personality
ctaCluster: self
minutes: 3
passport:
  measures: Шкала показывает, насколько вас притягивают сложные идеи, искусство и темы без однозначных ответов.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт «тяга к
    сложному и неоднозначному». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.82 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: тяга к сложному и неоднозначному
    high: любит идеи, искусство и разговоры без простых ответов
    low: предпочитает конкретику и ясные ответы
    bands:
      - from: 0
        label: низкая
        text: >-
          Вам ближе конкретика: понятная задача, ясный ответ, разговор по делу. Это экономит время и защищает от
          бесконечных рассуждений ни о чём. Обратная сторона — темы, которые не сводятся к простому ответу, вы обходите
          стороной, и часть интересного проходит мимо.
      - from: 40
        label: средняя
        text: >-
          Вы охотно копаетесь в идее, если она зачем-то нужна, но не ради самого процесса. Абстракции переносите
          дозированно. Плюс — вас понимают и практики, и любители порассуждать; минус — глубина появляется только под
          конкретный повод.
      - from: 70
        label: высокая
        text: >-
          Вас тянет к тому, что не раскладывается на простые ответы: искусство, идеи, разбор себя и чужих мотивов. Вы
          спокойно держите в голове противоречивые версии и не спешите выбирать одну. Цена — можно уйти в размышления
          вместо действия, а собеседникам иногда тяжело за вами идти.
questions:
  - id: q1
    text: Считаю искусство важной частью жизни.
    scales:
      - scale: total
  - id: q2
    text: Владею богатым словарным запасом.
    scales:
      - scale: total
  - id: q3
    text: Люблю разбираться в себе и своей жизни.
    scales:
      - scale: total
  - id: q4
    text: Люблю обсуждать фильмы и книги с другими.
    scales:
      - scale: total
  - id: q5
    text: Стараюсь смотреть на себя со стороны.
    scales:
      - scale: total
  - id: q6
    text: Не интересуюсь отвлечёнными идеями.
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Стараюсь держаться подальше от сложных людей.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Избегаю разговоров о философии.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Не интересуюсь теоретическими спорами.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Не люблю стихи.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Возьмите за правило пересказывать любую интересную идею вслух одним абзацем без терминов: простая формулировка
    проверяет глубину лучше любого спора.
  - >-
    Ставьте размышлению границу по времени и заканчивайте его действием — письмом, наброском, решением, — иначе процесс
    подменяет результат.
  - >-
    Ищите собеседников с другим опытом, а не просто с другим мнением: новый материал даёт больше, чем очередной спор о
    знакомом.
