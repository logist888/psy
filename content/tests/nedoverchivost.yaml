slug: nedoverchivost
version: 1.0.0
title: Тест на недоверчивость
seoTitle: Тест на недоверчивость онлайн — бесплатно, 10 вопросов
description: >-
  Показывает, насколько настороженно вы относитесь к чужим намерениям и словам. 10 вопросов, около 3 минут. Это
  самоотчётная шкала, а не диагностика.
category: relationships
ctaCluster: relationships
minutes: 3
passport:
  measures: Шкала показывает, насколько настороженно вы относитесь к намерениям и словам других людей.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт
    «недоверчивость». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.83 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: недоверчивость
    high: видит скрытые мотивы и доверяет с трудом
    low: верит людям на слово и легко сходится
    bands:
      - from: 0
        label: низкая
        text: >-
          Вы исходите из того, что люди говорят то, что думают, и это сильно упрощает жизнь. С вами легко
          договариваться, отношения строятся быстро. Обратная сторона — тревожные сигналы вы замечаете позже других и
          иногда платите за чужую нечестность.
      - from: 40
        label: средняя
        text: >-
          Доверие вы не выдаёте авансом, но и не отбираете без причины: смотрите на поступки. Важное проверяете, не
          превращая проверку в подозрительность. Иногда взвешивание затягивается и решение откладывается дольше нужного.
      - from: 70
        label: высокая
        text: >-
          Вы держитесь настороже: ищете второй смысл, замечаете нестыковки, не спешите верить словам. Это защищает от
          манипуляций и хорошо работает там, где ставки высоки. Цена — напряжение и дистанция, из-за которых близость
          приходит медленно; если настороженность распространяется и на отношение к себе, это стоит обсудить со
          специалистом.
questions:
  - id: q1
    text: Чувствую, что окружающие нападают на меня.
    scales:
      - scale: total
  - id: q2
    text: Чувствую, что жизнь меня обделила.
    scales:
      - scale: total
  - id: q3
    text: Подозреваю у людей скрытые мотивы.
    scales:
      - scale: total
  - id: q4
    text: Не доверяю людям.
    scales:
      - scale: total
  - id: q5
    text: Чувствую, что меня трудно понять.
    scales:
      - scale: total
  - id: q6
    text: Недолюбливаю себя.
    scales:
      - scale: total
  - id: q7
    text: Держусь с людьми настороже.
    scales:
      - scale: total
  - id: q8
    text: Веду себя с людьми непринуждённо.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Верю тому, что мне говорят.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Доверяю людям.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Разделяйте проверку и подозрение: фиксируйте договорённости письменно со всеми подряд — тогда осторожность не
    читается как претензия к конкретному человеку.
  - >-
    Записывайте свои прогнозы про людей и сверяйте их через месяц: так видно, где чутьё сработало, а где напрасно
    держало вас в напряжении.
  - >-
    Пробуйте маленькие ставки доверия — просьба, потерю которой не жалко. Доверие набирается дозами, а не одним решением
    довериться.
