slug: perfekcionizm
version: 1.0.0
title: Тест на перфекционизм
seoTitle: Тест на перфекционизм онлайн — бесплатно, 9 вопросов
description: >-
  9 утверждений о том, насколько вам важно, чтобы всё было сделано безупречно — у вас и у окружающих. Занимает пару
  минут. Это самоотчёт, а не диагностика.
category: personality
ctaCluster: self
minutes: 2
passport:
  measures: Шкала показывает, насколько высоко вы держите планку качества и порядка — для себя и для других.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт
    «перфекционизм». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.76 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: перфекционизм
    high: высокая планка, внимание к деталям, контроль
    low: терпимость к беспорядку, готовность остановиться на «достаточно»
    bands:
      - from: 0
        label: низкая
        text: >-
          По ответам вам легко живётся без идеального порядка: беспорядок и чужая небрежность вас мало трогают. Сильная
          сторона — вы редко застреваете на мелочах, быстрее заканчиваете начатое и не изводите требованиями ни себя, ни
          других. Цена — детали иногда теряются, и там, где точность действительно важна, приходится переделывать.
          Кому-то рядом может не хватать от вас внимания к качеству. Если задача из тех, где мелочи решают, помогает
          заранее договориться, что именно будет считаться сделанным хорошо.
      - from: 40
        label: средняя
        text: >-
          Вам важно, чтобы работа была сделана хорошо, но вы способны остановиться, когда этого достаточно. Обычно это
          удобная позиция: качество не проваливается, а сроки не сгорают. Обратная сторона — в значимых для вас темах
          планка может резко подскакивать, и тогда на доводку уходит куда больше времени, чем вы планировали. Полезно
          заранее решать, где на этой неделе нужна безупречность, а где хватит рабочего варианта.
      - from: 70
        label: высокая
        text: >-
          Ответы говорят о высокой планке: вы доводите до идеала, следите за деталями и ждёте того же от окружающих. Это
          даёт заметное качество и надёжность там, где мелочи действительно важны. Цена — время уходит на доводку того,
          что уже достаточно хорошо, растёт напряжение, а близким и коллегам ваш контроль может казаться давлением.
          Страдает и способность заканчивать: «идеально» не наступает никогда. Помогает заранее назначать себе точку
          остановки и отделять задачи, где планка оправдана, от тех, где она обходится слишком дорого.
questions:
  - id: q1
    text: Не останавливаюсь, пока всё не станет идеально
    scales:
      - scale: total
  - id: q2
    text: Хочу, чтобы была продумана каждая деталь
    scales:
      - scale: total
  - id: q3
    text: Хочу, чтобы всё было ровно так, как надо
    scales:
      - scale: total
  - id: q4
    text: Хочу, чтобы всё шло по плану
    scales:
      - scale: total
  - id: q5
    text: Требую от других безупречности
    scales:
      - scale: total
  - id: q6
    text: Пристально слежу за тем, как работают другие
    scales:
      - scale: total
  - id: q7
    text: Жду от других полной отдачи в работе
    scales:
      - scale: total
  - id: q8
    text: Меня не раздражают неаккуратные люди
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Беспорядок меня не напрягает
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Для одной задачи на этой неделе заранее напишите, что будет считаться «готово», и сдайте её ровно в этот момент, не
    улучшая дальше.
  - 'Ставьте таймер на доводку: 20 минут на финальную вычитку или уборку — когда звонит, вы останавливаетесь.'
  - >-
    Выберите одну зону, где вы обычно проверяете чужую работу, и на неделю не проверяйте её: договоритесь о требованиях
    заранее, вместо того чтобы поправлять по ходу.
