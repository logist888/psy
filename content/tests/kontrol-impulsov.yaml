slug: kontrol-impulsov
version: 1.0.0
title: Тест на контроль импульсов
seoTitle: Тест на контроль импульсов онлайн — бесплатно, 10 вопросов
description: >-
  Легко ли вам устоять перед соблазном и довести задуманное до конца? Самоотчётная шкала из 10 вопросов о сдержанности и
  доведении дел до результата.
category: personality
ctaCluster: self
minutes: 3
passport:
  measures: >-
    Шкала показывает, насколько вы способны выдерживать соблазны и доводить начатое до конца, а не действовать по
    сиюминутному порыву.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт «контроль
    импульсов». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.78 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: контроль импульсов
    high: выдержка, доведение дел до конца
    low: импульсивность, действие по порыву
    bands:
      - from: 0
        label: низкий контроль импульсов
        text: >-
          Порыв у вас часто опережает расчёт: легко отвлечься, сорваться на соблазн, бросить начатое. Зато вы быстро
          включаетесь и живо реагируете там, где другие тормозят. Полезно опираться не на силу воли, а на среду, где
          соблазнов меньше.
      - from: 40
        label: умеренный контроль импульсов
        text: >-
          Вы обычно удерживаетесь от лишнего и доводите важное до конца, хотя срывы случаются. В усталости или стрессе
          выдержка проседает заметнее. Это обычный рабочий диапазон, а не проблема.
      - from: 70
        label: высокий контроль импульсов
        text: >-
          Вы умеете отложить желаемое и держаться намеченного даже без внешнего контроля. Планы у вас чаще доходят до
          результата, чем у большинства. Стоит следить, чтобы выдержка не превращалась в постоянный отказ себе во всём.
questions:
  - id: q1
    text: Умею сдерживать свои желания.
    scales:
      - scale: total
  - id: q2
    text: Противостою соблазнам без труда.
    scales:
      - scale: total
  - id: q3
    text: Выполняю то, что задумал.
    scales:
      - scale: total
  - id: q4
    text: Довожу свои планы до конца.
    scales:
      - scale: total
  - id: q5
    text: Знаю меру.
    scales:
      - scale: total
  - id: q6
    text: Не понимаю, зачем делаю некоторые вещи.
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Упускаю свои шансы раз за разом.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Устраиваю бардак в делах.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Трачу время впустую.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Делаю то, о чём потом жалею.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Меняйте не силу воли, а расстояние до соблазна: чем больше шагов до него, тем реже срыв. Убранное приложение
    работает лучше обещания не открывать его.
  - >-
    Заранее решайте, что сделаете в момент порыва: «захочу бросить — работаю ещё десять минут». Готовое правило
    срабатывает там, где рассуждать уже поздно.
  - >-
    После срыва фиксируйте не вину, а обстоятельства: время суток, голод, усталость, компания. Импульсивность почти
    всегда привязана к повторяющимся условиям.
