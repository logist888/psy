slug: lokus-kontrolya
version: 1.0.0
title: Тест на локус контроля
seoTitle: Тест на локус контроля онлайн — бесплатно, 19 вопросов
description: >-
  Шкала показывает, чему вы приписываете происходящее с вами: собственным действиям или обстоятельствам и везению. 19
  вопросов, около 5 минут. Это самоотчёт, а не диагностика.
category: wellbeing
ctaCluster: self
minutes: 5
passport:
  measures: >-
    Шкала показывает, насколько человек объясняет происходящее с ним своими действиями, а не удачей и внешними
    обстоятельствами.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт «локус
    контроля». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.86 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: локус контроля
    high: считаю, что многое в моей жизни зависит от меня
    low: чаще объясняю происходящее обстоятельствами и везением
    bands:
      - from: 0
        label: низкая
        text: >-
          Вы чаще объясняете события внешними причинами: обстоятельствами, чужими решениями, удачей. В этом есть
          трезвость — многое действительно от нас не зависит, и вы реже грызёте себя за то, чего не могли изменить. Цена
          — ощущение, что руль не в ваших руках, и меньше попыток что-то поменять там, где повлиять всё же можно.
          Инициатива и ответственность за решения могут восприниматься как лишняя тяжесть. Полезно искать зоны, пусть
          небольшие, где ваш шаг точно меняет результат.
      - from: 40
        label: средняя
        text: >-
          Вы видите и свой вклад, и роль обстоятельств, и обычно различаете, где что. В привычных делах чувствуете, что
          влияете на исход, а в новых или неопределённых ситуациях легче отдаёте руль внешним причинам. Сильная сторона
          такого баланса — вы не берёте на себя лишнего и не сдаётесь заранее. Цена — в трудный период оценка может
          уплывать то в самообвинение, то в «от меня ничего не зависит». Ориентируйтесь на конкретный вопрос: какой шаг
          здесь мой.
      - from: 70
        label: высокая
        text: >-
          Вы исходите из того, что результат в большой мере зависит от ваших действий, и потому охотно берёте инициативу
          и решения на себя. Такой настрой помогает начинать, доводить и не ждать, пока сложится само. Цена — соблазн
          считать своей виной то, что определялось рынком, здоровьем или чужим выбором, и отсюда лишнее напряжение и
          трудность просить о помощи. Иногда рядом с этим идёт нежелание признавать, что часть событий просто случайна.
          Здесь помогает честное разделение: вот моя часть, вот не моя.
questions:
  - id: q1
    text: Мне комфортно с самим собой
    scales:
      - scale: total
  - id: q2
    text: Считаю, что мой успех зависит от способностей, а не от везения
    scales:
      - scale: total
  - id: q3
    text: Просто знаю, что у меня всё получится
    scales:
      - scale: total
  - id: q4
    text: Нахожу удачные решения
    scales:
      - scale: total
  - id: q5
    text: Люблю жизнь
    scales:
      - scale: total
  - id: q6
    text: С другими людьми держусь свободно
    scales:
      - scale: total
  - id: q7
    text: Чувствую, что справлюсь с любой задачей
    scales:
      - scale: total
  - id: q8
    text: Люблю брать на себя ответственность за решения
    scales:
      - scale: total
  - id: q9
    text: Проявляю инициативу
    scales:
      - scale: total
  - id: q10
    text: Принимаю решение и иду дальше
    scales:
      - scale: total
  - id: q11
    text: Считаю, что неприятности случаются из-за невезения
    scales:
      - scale: total
        reverse: true
  - id: q12
    text: Считаю, что миром управляет горстка влиятельных людей
    scales:
      - scale: total
        reverse: true
  - id: q13
    text: Мне кажется, что моя жизнь идёт без направления
    scales:
      - scale: total
        reverse: true
  - id: q14
    text: Раз за разом упускаю свои шансы
    scales:
      - scale: total
        reverse: true
  - id: q15
    text: Считаю, что некоторые люди рождаются везучими
    scales:
      - scale: total
        reverse: true
  - id: q16
    text: Не люблю брать на себя ответственность за решения
    scales:
      - scale: total
        reverse: true
  - id: q17
    text: Во многом уступаю большинству людей
    scales:
      - scale: total
        reverse: true
  - id: q18
    text: Не нравлюсь себе
    scales:
      - scale: total
        reverse: true
  - id: q19
    text: Чувствую, что не справляюсь с тем, что происходит
    scales:
      - scale: total
        reverse: true
crisis:
  - question: q19
    minValue: 4
selfHelp:
  - >-
    Возьмите одну застрявшую ситуацию и напишите два столбца: что в ней зависит от меня и что нет; на этой неделе
    сделайте один шаг только из левого столбца.
  - >-
    В течение трёх дней ловите фразу «так вышло» и заменяйте её на конкретное описание: кто что сделал и какой ваш шаг
    был бы возможен.
  - >-
    Примите одно небольшое решение, которое давно откладывали (звонок, запись, отказ), в ближайшие 48 часов — без
    дополнительного сбора информации.
