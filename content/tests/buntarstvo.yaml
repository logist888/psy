slug: buntarstvo
version: 1.0.0
title: Тест на бунтарство
seoTitle: Тест на бунтарство онлайн — бесплатно, 10 вопросов
description: >-
  Как вы относитесь к правилам, запретам и начальству — соблюдаете или обходите? Самоотчётная шкала из 10 вопросов о
  склонности идти против установленного порядка.
category: values
ctaCluster: self
minutes: 3
passport:
  measures: Шкала показывает, насколько вы склонны оспаривать правила, нормы приличия и авторитет тех, кто наделён властью.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт «бунтарство и
    сопротивление правилам». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.80 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: бунтарство и сопротивление правилам
    high: независимость, готовность идти против правил
    low: уважение к порядку и договорённостям
    bands:
      - from: 0
        label: низкое бунтарство
        text: >-
          Правила и договорённости для вас — опора, а не помеха. Вы соблюдаете формальности, уважительно ведёте себя со
          старшими и не ищете лазеек. Иногда стоит проверять, все ли правила, которым вы следуете, ещё работают.
      - from: 40
        label: умеренное бунтарство
        text: >-
          Порядок вы в целом соблюдаете, но не считаете его священным. Бессмысленное требование можете обойти или
          оспорить, важное — выполнить без спора. Такая избирательность обычно хорошо считывается окружающими.
      - from: 70
        label: выраженное бунтарство
        text: >-
          Указания и формальности вызывают у вас сопротивление почти рефлекторно. Вы говорите резко, не боитесь спорить
          со старшими и умеете находить обходные пути. Это делает вас неудобным, но именно такие люди меняют негодные
          правила.
questions:
  - id: q1
    text: Нарушаю правила.
    scales:
      - scale: total
  - id: q2
    text: Знаю, как обойти правила.
    scales:
      - scale: total
  - id: q3
    text: Люблю грубые шутки.
    scales:
      - scale: total
  - id: q4
    text: Ругаюсь матом.
    scales:
      - scale: total
  - id: q5
    text: Жульничаю, чтобы добиться своего.
    scales:
      - scale: total
  - id: q6
    text: Сопротивляюсь начальству.
    scales:
      - scale: total
  - id: q7
    text: Не стану обманывать налоговую.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Стараюсь соблюдать правила.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Держусь правил.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Уважаю начальство.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Прежде чем спорить, выясните, кто автор правила и зачем оно введено. Половина раздражающих требований оказывается
    чужим пересказом, а не позицией того, кто перед вами.
  - >-
    Оставьте себе одно-два поля, где вы демонстративно ничего не нарушаете, — деньги, документы, сроки. Это резко
    повышает вес вашего протеста в остальном.
  - >-
    Если правило кажется глупым, предлагайте замену в том же разговоре. Протест с готовым вариантом почти всегда
    обсуждают, протест без него — гасят.
