slug: emotional-intelligence
version: 1.0.0
title: Тест на эмоциональный интеллект
seoTitle: Тест на эмоциональный интеллект (EQ) онлайн — бесплатно
description: 'Четыре навыка: понимать свои эмоции, управлять ими, считывать чужие и выстраивать отношения. 20 утверждений,
  около 4 минут.'
category: personality
ctaCluster: self
minutes: 4
passport:
  measures: 'Самооценку четырёх составляющих эмоционального интеллекта: понимание своих эмоций, управление ими, распознавание
    эмоций других и управление отношениями.'
  origin: Собственная разработка проекта на основе четырёхкомпонентной модели эмоционального интеллекта.
  rightsBasis: own_work
  rightsNote: Формулировки принадлежат проекту. Проприетарные инструменты MSCEIT и EQ-i издательства MHS не использовались.
  reliability: 'Опросник новый и независимой проверки не проходил. Принципиальная оговорка: это самоотчёт, то есть он измеряет
    ваше представление о своём эмоциональном интеллекте. Люди с низким EQ часто оценивают себя высоко — именно потому, что
    плохо считывают обратную связь.'
  limitations: Тест не измеряет реальный навык, только представление о нём. Настоящую способность распознавать эмоции проверяют
    задачами с правильными ответами, а не согласием с утверждениями о себе.
instruction: Отвечайте честно, а не так, как «правильно». Здесь нет хороших и плохих ответов.
options:
- text: Совсем не про меня
  value: 0
- text: Скорее не про меня
  value: 1
- text: Скорее про меня
  value: 2
- text: Точно про меня
  value: 3
scales:
- id: self_aware
  name: Понимание своих эмоций
  high: вы замечаете и называете свои чувства
  low: эмоции опознаются с трудом
  bands:
  - from: 0
    label: низкое
    text: Свои чувства вы замечаете задним числом или узнаёте о них по телу и поступкам. Это распространено и вполне тренируемо.
  - from: 40
    label: среднее
    text: Обычно вы понимаете, что чувствуете, хотя в сильном напряжении это даётся хуже.
  - from: 70
    label: высокое
    text: Вы хорошо различаете свои состояния и понимаете, что их вызвало.
- id: self_reg
  name: Управление эмоциями
  high: вы можете не действовать в порыве
  low: эмоция быстро переходит в действие
  bands:
  - from: 0
    label: низкое
    text: Сильная эмоция быстро превращается в слова и поступки, о которых потом жалеете.
  - from: 40
    label: среднее
    text: Обычно вы удерживаетесь, но в сильном стрессе контроль слабеет.
  - from: 70
    label: высокое
    text: Между чувством и действием у вас есть пауза, и вы умеете ею пользоваться.
- id: empathy
  name: Понимание других
  high: вы точно считываете состояние людей
  low: чужие эмоции распознаются с трудом
  bands:
  - from: 0
    label: низкое
    text: Вам трудно понять, что чувствует человек, пока он не скажет прямо.
  - from: 40
    label: среднее
    text: Вы замечаете явные эмоции, но тонкие сигналы можете пропустить.
  - from: 70
    label: высокое
    text: Вы быстро считываете настроение и подтекст, иногда раньше самого человека.
- id: social
  name: Управление отношениями
  high: вы умеете договариваться и удерживать контакт
  low: отношения даются напряжённо
  bands:
  - from: 0
    label: низкое
    text: Конфликты и сложные разговоры даются тяжело, их хочется избегать.
  - from: 40
    label: среднее
    text: Вы справляетесь с большинством ситуаций, хотя острые разговоры даются с трудом.
  - from: 70
    label: высокое
    text: Вы умеете говорить о трудном, не разрушая отношений.
questions:
- id: q1
  text: Я легко могу назвать словами, что именно чувствую.
  scales:
  - scale: self_aware
- id: q2
  text: Я понимаю, почему у меня испортилось настроение.
  scales:
  - scale: self_aware
- id: q3
  text: Мне трудно отличить тревогу от раздражения.
  scales:
  - scale: self_aware
    reverse: true
- id: q4
  text: Я замечаю, как эмоции влияют на мои решения.
  scales:
  - scale: self_aware
- id: q5
  text: Я узнаю о своих чувствах только когда они уже сильные.
  scales:
  - scale: self_aware
    reverse: true
- id: q6
  text: В злости я могу сказать то, о чём потом жалею.
  scales:
  - scale: self_reg
    reverse: true
- id: q7
  text: Я умею успокоиться, когда это нужно.
  scales:
  - scale: self_reg
- id: q8
  text: Сильные эмоции надолго выбивают меня из рабочего состояния.
  scales:
  - scale: self_reg
    reverse: true
- id: q9
  text: Я могу отложить реакцию и вернуться к разговору позже.
  scales:
  - scale: self_reg
- id: q10
  text: Я срываюсь на близких от усталости.
  scales:
  - scale: self_reg
    reverse: true
- id: q11
  text: Я замечаю, когда человеку не по себе, даже если он молчит.
  scales:
  - scale: empathy
- id: q12
  text: Мне трудно понять, что чувствуют другие.
  scales:
  - scale: empathy
    reverse: true
- id: q13
  text: Я улавливаю по голосу, что что-то не так.
  scales:
  - scale: empathy
- id: q14
  text: Меня удивляет, когда люди обижаются на мои слова.
  scales:
  - scale: empathy
    reverse: true
- id: q15
  text: Я понимаю мотивы поступков других людей.
  scales:
  - scale: empathy
- id: q16
  text: Я могу спокойно обсудить то, что меня задело.
  scales:
  - scale: social
- id: q17
  text: Я избегаю сложных разговоров.
  scales:
  - scale: social
    reverse: true
- id: q18
  text: Мне удаётся успокоить человека, который расстроен.
  scales:
  - scale: social
- id: q19
  text: В конфликте я перехожу на личности.
  scales:
  - scale: social
    reverse: true
- id: q20
  text: Я умею сказать «нет», не разрушая отношений.
  scales:
  - scale: social
crisis: []
selfHelp:
- Начните с называния. Три раза в день спрашивайте себя, что именно вы сейчас чувствуете, и подбирайте точное слово — не «нормально»,
  а «раздражён», «тревожно», «обидно». Точность названия сама по себе снижает интенсивность.
- Тренируйте паузу, а не сдержанность. Задача не в том, чтобы не чувствовать, а в том, чтобы между чувством и словом появились
  несколько секунд.
- Проверьте самооценку обратной связью. Спросите двух близких людей, насколько вы, по их мнению, замечаете их состояние —
  расхождение с вашим результатом скажет больше, чем сам результат.
