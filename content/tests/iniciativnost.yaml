slug: iniciativnost
version: 1.0.0
title: Тест на инициативность
seoTitle: Тест на инициативность онлайн — бесплатно, 10 вопросов
description: >-
  Оценивает, как быстро вы беретесь за дело и доводите его до конца без внешнего толчка. 10 вопросов, около 3 минут. Это
  самоотчётная шкала, а не диагностика.
category: personality
ctaCluster: self
minutes: 3
passport:
  measures: Шкала показывает, как быстро вы переходите от намерения к первому действию и заканчиваете начатое.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт
    «инициативность». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.85 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: инициативность
    high: берётся за дело сразу и быстро заканчивает
    low: долго раскачивается и откладывает старт
    bands:
      - from: 0
        label: низкая
        text: >-
          Старт даётся тяжело: дело крутится в голове дольше, чем делается руками. Зато вы редко бросаетесь в задачу не
          подумав и чаще точнее выбираете момент. Цена — хвост отложенных неприятных дел, который сам по себе давит на
          настроение.
      - from: 40
        label: средняя
        text: >-
          За важное вы беретесь вовремя, а скучное и неприятное умеете оттянуть. Вас хорошо держит внешняя рамка:
          дедлайн, чужая просьба, назначенное время. Режим устойчив, пока рамок хватает; без них дела расползаются.
      - from: 70
        label: высокая
        text: >-
          Вы стартуете почти сразу и не любите держать дело в подвешенном состоянии. Это даёт скорость и репутацию
          человека, на которого можно положиться. Цена — иногда вы начинаете раньше, чем стоило подумать, и тормозить,
          когда дел уже слишком много, трудно.
questions:
  - id: q1
    text: Справляюсь с делами быстро.
    scales:
      - scale: total
  - id: q2
    text: Делаю бытовые дела сразу.
    scales:
      - scale: total
  - id: q3
    text: Принимаюсь за работу сразу же.
    scales:
      - scale: total
  - id: q4
    text: Погружаюсь в задачу с головой.
    scales:
      - scale: total
  - id: q5
    text: Заканчиваю задачи быстро.
    scales:
      - scale: total
  - id: q6
    text: Берусь за дело без раскачки.
    scales:
      - scale: total
  - id: q7
    text: Не могу вовремя приступить к делу.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Начинаю, только когда меня подтолкнут.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Оттягиваю момент, когда пора сесть за работу.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Откладываю неприятные дела.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Договаривайтесь с собой не о задаче, а о первом действии на две минуты: открыть файл, набрать номер. Сопротивление
    живёт на старте, а не внутри работы.
  - >-
    Неприятные дела ставьте на конкретное время суток, а не в список: список можно листать бесконечно, время наступает
    само.
  - Если беретесь мгновенно за всё подряд, введите правило суток на решения, которые дороже вашей недельной нагрузки.
