slug: big-five
version: 1.0.0
title: Большая пятёрка (Mini-IPIP)
seoTitle: "Тест «Большая пятёрка» онлайн — бесплатно, 20 вопросов"
description: Научная модель личности из пяти черт. 20 утверждений, около 4 минут. Бесплатно и анонимно, без регистрации.
category: personality
ctaCluster: self
minutes: 4
passport:
  measures: Пять базовых черт личности — экстраверсию, доброжелательность, добросовестность, эмоциональную нестабильность и открытость опыту.
  origin: Mini-IPIP (Donnellan et al., 2006) на основе международного пула пунктов IPIP. Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: Пункты IPIP находятся в общественном достоянии с 1999 года и разрешены к коммерческому использованию. Перевод — собственная работа проекта.
  reliability: У англоязычного оригинала внутренняя согласованность шкал приемлемая для коротких форм (α около 0,7). Русский перевод пока не прошёл независимую психометрическую проверку — относитесь к результату как к ориентиру.
  limitations: Короткая форма из 4 пунктов на черту даёт грубую оценку и не заменяет полные опросники. Нормы российской выборки не собраны, результат показан в процентах от максимума шкалы, а не в сравнении с популяцией.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: "Совсем не про меня"
    value: 0
  - text: "Скорее не про меня"
    value: 1
  - text: "Затрудняюсь"
    value: 2
  - text: "Скорее про меня"
    value: 3
  - text: "Точно про меня"
    value: 4
scales:
  - id: e
    name: Экстраверсия
    high: энергия от общения, инициатива в контактах
    low: спокойствие в одиночестве, экономия социальной энергии
    bands:
      - from: 0
        label: "низкая"
        text: "Вы восстанавливаетесь в тишине и небольших компаниях. Долгие шумные встречи скорее опустошают, чем заряжают."
      - from: 40
        label: "средняя"
        text: "Вам комфортно и в компании, и наедине с собой — многое зависит от людей и обстановки."
      - from: 70
        label: "высокая"
        text: "Вы заряжаетесь от людей, легко заговариваете первым и обычно оказываетесь в центре разговора."
  - id: a
    name: Доброжелательность
    high: внимание к чувствам других, склонность к сотрудничеству
    low: прямота, готовность отстаивать своё
    bands:
      - from: 0
        label: "низкая"
        text: "Вы держите дистанцию и говорите прямо. Чужие переживания редко становятся вашей задачей."
      - from: 40
        label: "средняя"
        text: "Вы считаетесь с другими, но не в ущерб себе — обычно ищете баланс."
      - from: 70
        label: "высокая"
        text: "Вы быстро считываете чужие эмоции и часто ставите чужой комфорт выше своего."
  - id: c
    name: Добросовестность
    high: порядок, доведение дел до конца
    low: гибкость, спонтанность
    bands:
      - from: 0
        label: "низкая"
        text: "Вы живёте по ситуации. Планы и порядок скорее мешают, чем помогают."
      - from: 40
        label: "средняя"
        text: "Вы держите важное под контролем, но не превращаете порядок в самоцель."
      - from: 70
        label: "высокая"
        text: "Вы планируете, доводите начатое до конца и плохо переносите хаос вокруг."
  - id: n
    name: Эмоциональная нестабильность
    high: чувствительность к стрессу, перепады настроения
    low: ровный эмоциональный фон
    bands:
      - from: 0
        label: "низкая"
        text: "Вас трудно вывести из равновесия. Настроение держится ровно даже в напряжённые периоды."
      - from: 40
        label: "средняя"
        text: "Вы реагируете на стресс, но обычно возвращаетесь в равновесие сами."
      - from: 70
        label: "высокая"
        text: "Вы остро чувствуете напряжение, настроение меняется быстро. Это не диагноз — это особенность нервной системы, с которой можно работать."
  - id: o
    name: Открытость опыту
    high: интерес к новому, воображение
    low: опора на проверенное и конкретное
    bands:
      - from: 0
        label: "низкая"
        text: "Вы предпочитаете конкретику и проверенные способы. Абстракции кажутся пустой тратой времени."
      - from: 40
        label: "средняя"
        text: "Вы открыты новому, когда видите в нём смысл, но не гонитесь за новизной ради неё самой."
      - from: 70
        label: "высокая"
        text: "Вас тянет к новому, необычному и абстрактному. Воображение работает постоянно."
questions:
  - id: q1
    text: "Я оживляю компанию."
    scales:
      - scale: e
  - id: q2
    text: "Я сочувствую чувствам других людей."
    scales:
      - scale: a
  - id: q3
    text: "Я сразу делаю дела по дому и по работе, не откладывая."
    scales:
      - scale: c
  - id: q4
    text: "У меня часто меняется настроение."
    scales:
      - scale: n
  - id: q5
    text: "У меня живое воображение."
    scales:
      - scale: o
  - id: q6
    text: "Я мало говорю."
    scales:
      - scale: e
        reverse: true
  - id: q7
    text: "Меня не интересуют проблемы других людей."
    scales:
      - scale: a
        reverse: true
  - id: q8
    text: "Я часто забываю класть вещи на место."
    scales:
      - scale: c
        reverse: true
  - id: q9
    text: "Большую часть времени сохраняю спокойствие."
    scales:
      - scale: n
        reverse: true
  - id: q10
    text: "Мне трудно понимать абстрактные идеи."
    scales:
      - scale: o
        reverse: true
  - id: q11
    text: "На вечеринках я разговариваю со многими разными людьми."
    scales:
      - scale: e
  - id: q12
    text: "Я чувствую эмоции других людей."
    scales:
      - scale: a
  - id: q13
    text: "Я люблю порядок."
    scales:
      - scale: c
  - id: q14
    text: "Меня легко расстроить."
    scales:
      - scale: n
  - id: q15
    text: "У меня плохо развито воображение."
    scales:
      - scale: o
        reverse: true
  - id: q16
    text: "Я предпочитаю оставаться в тени."
    scales:
      - scale: e
        reverse: true
  - id: q17
    text: "Мне в общем-то неинтересны другие люди."
    scales:
      - scale: a
        reverse: true
  - id: q18
    text: "Я развожу беспорядок в делах."
    scales:
      - scale: c
        reverse: true
  - id: q19
    text: "Я редко грущу."
    scales:
      - scale: n
        reverse: true
  - id: q20
    text: "Меня не интересуют абстрактные идеи."
    scales:
      - scale: o
        reverse: true
crisis: []
selfHelp:
  - "Перечитайте описание шкалы, где результат оказался неожиданным: чаще всего именно там прячется расхождение между тем, как вы себя видите, и тем, как ведёте себя на самом деле."
  - "Черты — не приговор. Они описывают привычный способ реагировать, а не потолок возможностей: поведение меняется, даже когда черта остаётся прежней."
  - Пройдите тест ещё раз через пару месяцев. Устойчивое расхождение результатов обычно говорит не о личности, а о том, что изменились обстоятельства или состояние.
