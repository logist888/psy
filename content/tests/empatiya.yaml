slug: empatiya
version: 1.0.0
title: Тест на эмпатию
seoTitle: Тест на эмпатию онлайн — бесплатно, 10 вопросов
description: >-
  Шкала показывает, насколько сильно вы отзываетесь на чужие чувства и как ярко переживаете свои. 10 вопросов, около 3
  минут. Это самоотчёт, а не диагностика.
category: relationships
ctaCluster: relationships
minutes: 3
passport:
  measures: >-
    Шкала показывает, насколько человек чувствителен к эмоциям других людей и насколько ярко переживает собственные
    чувства.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт «эмпатия».
    Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.80 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: эмпатия
    high: остро чувствую чужие переживания и близко их принимаю
    low: остаюсь ровным там, где другие переживают
    bands:
      - from: 0
        label: низкая
        text: >-
          Чужие эмоции редко захватывают вас: вы скорее смотрите на ситуацию со стороны и разбираетесь в фактах. Это
          помогает в спорах, кризисах и работе, где нужна холодная голова, — вас трудно вывести из равновесия. Цена в
          том, что близкие иногда ждут не решения, а сочувствия, и им может казаться, что вы отстранены. Иногда
          собственные чувства тоже замечаются с опозданием — сначала «всё в порядке», потом накрывает усталость. Полезно
          проверять словами, что человек рядом хочет получить прямо сейчас.
      - from: 40
        label: средняя
        text: >-
          Вы замечаете, что происходит с людьми рядом, но не растворяетесь в их состоянии. Обычно получается и
          посочувствовать, и не утонуть в чужой истории. В сильных ситуациях — беда у близкого, тяжёлый разговор — вас
          может задеть глубже обычного, и это понятно. Сильная сторона такого баланса в том, что вы остаётесь опорой и
          при этом сохраняете себя. Цена — иногда трудно понять, где ваше чувство, а где перенятое от другого.
      - from: 70
        label: высокая
        text: >-
          Вы улавливаете настроение людей почти мгновенно и переживаете чужие истории как свои. Рядом с вами тепло: люди
          чувствуют, что их слышат, и часто идут к вам с трудным. Цена — эмоциональная усталость: новости, чужие ссоры и
          просьбы забирают много сил, и бывает трудно отличить свою тревогу от подхваченной. Ещё легко брать на себя
          чужую ответственность там, где вас об этом не просили. Умение отойти и восстановиться здесь так же важно, как
          умение сопереживать.
questions:
  - id: q1
    text: Чувствую эмоции других людей
    scales:
      - scale: total
  - id: q2
    text: Страдаю от чужого горя
    scales:
      - scale: total
  - id: q3
    text: Чужие несчастья задевают меня до глубины души
    scales:
      - scale: total
  - id: q4
    text: Меня легко довести до слёз
    scales:
      - scale: total
  - id: q5
    text: Я легко плачу
    scales:
      - scale: total
  - id: q6
    text: Переживаю свои чувства очень сильно
    scales:
      - scale: total
  - id: q7
    text: Чувствую душевную связь с другими людьми
    scales:
      - scale: total
  - id: q8
    text: Не понимаю людей, которые дают волю эмоциям
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Чужие проблемы мне неинтересны
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Редко испытываю сильные чувства
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    После тяжёлого разговора давайте себе 10 минут тишины без телефона — прогулка до магазина или душ помогают вернуться
    к своему состоянию.
  - >-
    Раз в день спрашивайте собеседника прямо: «Тебе сейчас нужен совет или просто чтобы я выслушал?» — и делайте ровно
    то, о чём попросили.
  - >-
    Выберите один день на этой неделе без новостных лент и чатов с чужими бедами, а вечером отметьте, как изменилось
    самочувствие.
