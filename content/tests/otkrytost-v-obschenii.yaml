slug: otkrytost-v-obschenii
version: 1.0.0
title: Тест на открытость в общении
seoTitle: Тест на открытость в общении онлайн — бесплатно, 10 вопросов
description: >-
  Шкала открытости в общении: 10 утверждений, около 3 минут. Показывает, насколько легко вы рассказываете о своих
  чувствах, тревогах и личных мыслях. Это самоотчёт, а не диагностика.
category: personality
ctaCluster: self
minutes: 3
passport:
  measures: 'Шкала показывает, насколько легко вы говорите о себе: о чувствах, тревогах и том, что обычно считается личным.'
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт «открытость в
    общении». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.86 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: открытость в общении
    high: лёгкость в разговоре о чувствах, готовность делиться личным
    low: сдержанность, привычка держать переживания при себе
    bands:
      - from: 0
        label: низкая
        text: >-
          Ответы говорят о закрытой манере общения: о себе вы рассказываете скупо, а переживания предпочитаете держать
          при себе. Сильная сторона — вы не нагружаете людей лишним, умеете держать границу и редко жалеете наутро о
          сказанном. Цена — близость строится медленнее: людям рядом трудно понять, что с вами происходит, и они
          начинают додумывать. Кроме того, невысказанное не исчезает, а копится и выходит через раздражение или
          усталость. Начинать проще не с большого разговора, а с одной фразы про своё состояние — с тем, кому вы
          доверяете.
      - from: 40
        label: средняя
        text: >-
          Вы делитесь личным избирательно: с близкими открываетесь, с остальными держите дистанцию. Обычно это рабочая
          стратегия — и поддержку получаете, и не оказываетесь беззащитны перед случайными людьми. Ограничение в том,
          что круг, где можно говорить прямо, легко сужается до одного человека, и вся нагрузка ложится на него. Стоит
          проверить, есть ли рядом хотя бы двое, с кем можно обсудить трудное. И вспомнить, когда вы делали это в
          последний раз.
      - from: 70
        label: высокая
        text: >-
          Ответы говорят о том, что вы легко говорите о себе: чувства не прячете, о тревогах рассказываете, личное не
          держите под замком. Это быстро сближает и обычно снимает напряжение — названное вслух переносится легче. Цена
          — открытость не всегда попадает в подходящего человека и в подходящий момент, а сказанное в порыве потом
          трудно забрать назад. Иногда рассказ о переживаниях подменяет действие: обсудили, стало легче, а ситуация
          осталась прежней. Полезно перед разговором отвечать себе, чего вы от него хотите: поддержки, совета или чтобы
          вас просто выслушали.
questions:
  - id: q1
    text: Открыто говорю о своих чувствах.
    scales:
      - scale: total
  - id: q2
    text: Легко рассказываю о себе другим.
    scales:
      - scale: total
  - id: q3
    text: Делюсь самыми личными мыслями.
    scales:
      - scale: total
  - id: q4
    text: Не скрываю своих чувств.
    scales:
      - scale: total
  - id: q5
    text: Рассказываю о том, что меня тревожит.
    scales:
      - scale: total
  - id: q6
    text: Говорю немного.
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Мало рассказываю о себе.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Держу чувства в себе.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Мне обычно нечего сказать.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: В разговоре обхожусь короткими репликами.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Один раз на этой неделе ответьте на «как дела» по существу и одной фразой — не жалобой и не отчётом, а тем, что
    действительно есть.
  - >-
    Выберите человека, которому доверяете, и расскажите ему то, что обычно держите при себе. Хватит одной темы и десяти
    минут.
  - >-
    Перед трудным разговором скажите вслух, чего вы ждёте: «мне нужен совет» или «мне нужно, чтобы просто выслушали».
    Это экономит обеим сторонам полчаса недопонимания.
