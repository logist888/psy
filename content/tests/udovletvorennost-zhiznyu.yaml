slug: udovletvorennost-zhiznyu
version: 1.0.0
title: Тест на удовлетворённость жизнью
seoTitle: Тест на удовлетворённость жизнью онлайн — бесплатно, 9 вопросов
description: >-
  Тест из 9 утверждений о том, насколько вам сейчас хорошо в собственной жизни: умеете ли получать удовольствие и как
  воспринимаете окружающих.
category: personality
ctaCluster: self
minutes: 2
passport:
  measures: Шкала отражает, насколько человек доволен своей жизнью и спокоен по отношению к окружающим.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт
    «удовлетворённость жизнью». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.72 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: удовлетворённость жизнью
    high: довольны жизнью и открыты с людьми
    low: чувствуете, что жизнь недодала, и держитесь настороже
    bands:
      - from: 0
        label: невысокая удовлетворённость
        text: >-
          Сейчас вам трудно получать удовольствие от обычных вещей, а в словах окружающих проще заметить подвох, чем
          доброжелательность. Обычно такое самоощущение связано с конкретным периодом — усталостью, потерей,
          затянувшимся напряжением — и меняется вместе с обстоятельствами. Результат ничего не диагностирует: это
          моментальный снимок вашего состояния, а не свойство характера.
      - from: 40
        label: средняя удовлетворённость
        text: >-
          Хорошие периоды у вас чередуются с полосами, когда ничего не радует. Людям вы в целом доверяете, но в новых
          компаниях сначала присматриваетесь. Полезно замечать, что именно возвращает вкус к жизни: обычно таких вещей
          меньше, чем кажется, и они повторяются.
      - from: 70
        label: высокая удовлетворённость
        text: >-
          Вы умеете радоваться тому, что есть, и не ждёте подвоха от окружающих. Дом, знакомства и разговоры чаще
          воспринимаются как ресурс, а не как источник напряжения. Такое состояние стоит поддерживать сознательно: оно
          держится на привычках, а не только на удачных обстоятельствах.
questions:
  - id: q1
    text: Умею получать удовольствие от жизни.
    scales:
      - scale: total
  - id: q2
    text: Чувствую, что жизнь меня обделила.
    scales:
      - scale: total
        reverse: true
  - id: q3
    text: Вижу, что людям трудно меня понять.
    scales:
      - scale: total
        reverse: true
  - id: q4
    text: Ощущаю, что на меня нападают.
    scales:
      - scale: total
        reverse: true
  - id: q5
    text: Подозреваю, что у людей есть скрытые мотивы.
    scales:
      - scale: total
        reverse: true
  - id: q6
    text: Бываю не в настроении ни для чего.
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Позволяю собой пользоваться.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Стесняюсь звать гостей к себе домой.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Скрываю от других то, что знаю.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Раз в неделю записывайте не «за что я благодарен», а конкретный эпизод, который вам понравился, с деталями: общее
    хуже запоминается и хуже работает.
  - >-
    Проверьте самый простой контур — сон, движение и дневной свет. Ощущение «ничего не хочется» держится на них чаще,
    чем на событиях.
  - >-
    Если такое состояние тянется больше двух недель подряд и мешает спать, работать или общаться, это повод обратиться к
    психологу или врачу, а не разбираться в одиночку.
