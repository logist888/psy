slug: emocionalnaya-vyrazitelnost
version: 1.0.0
title: Тест на эмоциональную выразительность
seoTitle: Тест на выразительность эмоций онлайн — бесплатно, 9 вопросов
description: >-
  Оценивает, насколько открыто вы показываете радость, нежность и тепло к близким. 9 вопросов, около 3 минут. Это
  самоотчётная шкала, а не диагностика.
category: personality
ctaCluster: self
minutes: 2
passport:
  measures: Шкала показывает, насколько открыто вы проявляете тёплые чувства и радость.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт «эмоциональная
    выразительность». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.81 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: эмоциональная выразительность
    high: открыто показывает радость и нежность
    low: держит тёплые чувства при себе
    bands:
      - from: 0
        label: низкая
        text: >-
          Чувства вы держите при себе: радость проживается внутри, а нежность выражается делом, а не словами и
          объятиями. Рядом с вами спокойно, вас не заносит. Цена — близкие иногда не знают, что вы к ним чувствуете, и
          достраивают сами, обычно не в лучшую сторону.
      - from: 40
        label: средняя
        text: >-
          Тепло вы показываете, но выбираете, кому и когда: со своими проще, при посторонних сдержаннее. Это гибко и
          почти всегда уместно. Минус — сдержанность легко превращается в привычку, и замечаешь это, только когда
          близкий просит сказать вслух.
      - from: 70
        label: высокая
        text: >-
          Радость, смех и нежность выходят наружу сразу: вы обнимаете, говорите тёплые слова, смеётесь в голос. С вами
          живо, и люди рядом сами оттаивают. Обратная сторона — в сдержанной среде это читают как несерьёзность, а
          спрятать эмоцию, когда это нужно, вам трудно.
questions:
  - id: q1
    text: Выражаю привязанность прикосновениями.
    scales:
      - scale: total
  - id: q2
    text: Смеюсь в голос, когда смешно.
    scales:
      - scale: total
  - id: q3
    text: Радуюсь по-детски, не сдерживаясь.
    scales:
      - scale: total
  - id: q4
    text: Смеюсь вслух над книгой или фильмом.
    scales:
      - scale: total
  - id: q5
    text: Обнимаю близких друзей.
    scales:
      - scale: total
  - id: q6
    text: Показываю, когда мне хорошо.
    scales:
      - scale: total
  - id: q7
    text: Стесняюсь показать людям, что они мне дороги.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Редко проявляю нежность открыто.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Держу радость в себе.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Раз в день говорите близкому вслух то, что обычно оставляете в голове, и обязательно конкретно: за что именно вы
    благодарны сегодня.
  - >-
    Сверяйтесь с контекстом: там, где вокруг сдержанны, сначала поймайте общий тон, а потом добавляйте своё тепло — так
    вас поймут точнее.
  - 'Если слова даются трудно, начните с тела: пауза, взгляд, рука на плече. Жест проходит там, где фраза застревает.'
