slug: osmotritelnost
version: 1.0.0
title: Тест на осмотрительность
seoTitle: Тест на осмотрительность онлайн — бесплатно, 10 вопросов
description: >-
  Онлайн-тест на осмотрительность по шкале IPIP: 10 утверждений о том, как вы принимаете решения — обдуманно или на
  импульсе. Около 3 минут, это самоотчёт.
category: personality
ctaCluster: self
minutes: 3
passport:
  measures: Шкала измеряет, насколько человек обдумывает шаги заранее и удерживается от импульсивных решений.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт
    «осмотрительность». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.76 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: осмотрительность
    high: взвешиваете шаги и не спешите с решениями
    low: действуете по импульсу и решаете на ходу
    bands:
      - from: 0
        label: низкая
        text: >-
          Вы решаете быстро и часто действуете раньше, чем всё обдумали. Это большой плюс там, где промедление дороже
          ошибки, и жизнь рядом с вами редко бывает скучной. Цена — часть решений придётся переделывать, и это стоит
          заранее закладывать в план.
      - from: 40
        label: средняя
        text: >-
          Важное вы обдумываете, а там, где цена ошибки мала, не тормозите. Обычно получается отличать решения, которые
          можно откатить, от тех, что всерьёз. В спешке или азарте баланс может сдвигаться в сторону импульса.
      - from: 70
        label: высокая
        text: >-
          Вы взвешиваете шаги заранее и редко жалеете о сказанном или сделанном сгоряча. На вас удобно опираться там,
          где ошибка стоит дорого. Цена — часть возможностей уходит, пока вы всё просчитываете, а спонтанность
          приходится разрешать себе отдельно.
questions:
  - id: q1
    text: Избегаю ошибок.
    scales:
      - scale: total
  - id: q2
    text: Тщательно подбираю слова.
    scales:
      - scale: total
  - id: q3
    text: Держусь выбранного пути.
    scales:
      - scale: total
  - id: q4
    text: Бросаюсь в дело, не подумав.
    scales:
      - scale: total
        reverse: true
  - id: q5
    text: Принимаю решения сгоряча.
    scales:
      - scale: total
        reverse: true
  - id: q6
    text: Люблю действовать по настроению.
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Действую впопыхах.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Совершаю безумные поступки.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Действую не раздумывая.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Часто строю планы в последний момент.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Делите решения на обратимые и необратимые. Обратимые можно принимать за минуту — время на обдумывание есть смысл
    тратить только на вторые.
  - >-
    С импульсивными покупками и резкими сообщениями работает пауза в сутки, а не сила воли: отложите отправку или
    добавьте в список желаний и вернитесь завтра.
  - >-
    Если всё просчитано, а решения нет, поставьте дедлайн на сам выбор. После определённого момента новая информация
    почти не меняет исход, а только оттягивает его.
