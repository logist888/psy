slug: emocionalnost
version: 1.0.0
title: Тест на эмоциональность
seoTitle: Тест на эмоциональность онлайн — бесплатно, 10 вопросов
description: >-
  Шкала IPIP из 10 утверждений: насколько ярко вы переживаете чувства и насколько хорошо замечаете эмоции — свои и
  чужие. Занимает около 2 минут.
category: personality
ctaCluster: self
minutes: 3
passport:
  measures: Насколько интенсивно человек переживает эмоции и насколько внимателен к своим и чужим чувствам.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт
    «эмоциональность». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.81 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: эмоциональность
    high: переживает чувства ярко и хорошо их замечает
    low: реагирует ровно и редко даёт волю чувствам
    bands:
      - from: 0
        label: низкая
        text: >-
          Сильные всплески чувств у вас редки, и ситуации, которые выбивают других, вы переносите ровно. Это удобно в
          кризисах и переговорах, но сигнал «мне это не подходит» иногда доходит с опозданием. Близкие порой читают
          такую ровность как безразличие, хотя дело не в нём.
      - from: 40
        label: умеренная
        text: >-
          Вы чувствуете достаточно ярко, чтобы понимать себя и других, но обычно не тонете в переживаниях. Эмоции чаще
          информируют вас, чем управляют вами. Это удобный баланс и для отношений, и для решений.
      - from: 70
        label: высокая
        text: >-
          Вы переживаете всё насыщенно: и радость, и обиду, и чужие чувства. Это даёт чуткость, живой контакт с людьми и
          хорошую внутреннюю навигацию. Цена — быстрая усталость от эмоционально плотных ситуаций и риск принять решение
          на пике волны.
questions:
  - id: q1
    text: Переживаю эмоции очень сильно.
    scales:
      - scale: total
  - id: q2
    text: Чувствую эмоции других людей.
    scales:
      - scale: total
  - id: q3
    text: Загораюсь идеями, которые считаю важными.
    scales:
      - scale: total
  - id: q4
    text: Люблю разбираться в себе и своей жизни.
    scales:
      - scale: total
  - id: q5
    text: Стараюсь понять себя.
    scales:
      - scale: total
  - id: q6
    text: Редко даю волю чувствам.
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Почти не поддаюсь эмоциям.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Редко замечаю, что именно чувствую.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Живу без эмоциональных взлётов и падений.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Не понимаю людей, которые бурно реагируют.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Расширяйте словарь чувств: вместо «плохо» — «обидно», «тревожно», «злюсь». Точное название заметно снижает накал и
    упрощает разговор с другими.
  - >-
    Отделяйте «что я чувствую» от «что я сделаю»: важное решение принимайте не раньше, чем волна спадёт хотя бы
    наполовину.
  - >-
    Если эмоции доходят слабо, ориентируйтесь на тело — сжатые челюсти, ускоренный пульс, пропавший аппетит замечаются
    раньше, чем само чувство.
