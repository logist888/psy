slug: celeustremlennost
version: 1.0.0
title: Тест на целеустремлённость
seoTitle: Тест на целеустремлённость онлайн — бесплатно, 10 вопросов
description: >-
  Онлайн-тест на целеустремлённость по шкале IPIP: 10 утверждений о планке, упорстве и отношении к результату. Около 3
  минут, это самоотчёт, а не оценка способностей.
category: career
ctaCluster: career
minutes: 3
passport:
  measures: Шкала измеряет, насколько человек стремится к высоким результатам и готов вкладывать в работу силы и время.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт
    «целеустремлённость». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.78 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: целеустремлённость
    high: держите высокую планку и вкладываетесь на полную
    low: не гонитесь за достижениями и работаете в спокойном темпе
    bands:
      - from: 0
        label: низкая
        text: >-
          Вы не гонитесь за рекордами и делаете столько, сколько нужно, чтобы дело шло. Это оставляет силы на жизнь вне
          работы и неплохо защищает от выгорания. Цена — там, где интересные задачи и повышения достаются самым
          заметным, вас могут просто не увидеть.
      - from: 40
        label: средняя
        text: >-
          Вы включаетесь в полную силу, когда задача того стоит, и не выкладываетесь ради всего подряд. Начатое обычно
          доводите до нормального результата, не превращая его в подвиг. Планка подвижная и зависит от того, насколько
          дело вам важно.
      - from: 70
        label: высокая
        text: >-
          Вы идёте к цели напрямую и держите высокую планку — и для себя, и для окружающих. Такие люди двигают проекты и
          нередко вытягивают их на себе. Цена — планка не выключается вечером, а другим рядом с вами может быть тесно от
          ваших стандартов.
questions:
  - id: q1
    text: Иду прямо к цели.
    scales:
      - scale: total
  - id: q2
    text: Работаю много и упорно.
    scales:
      - scale: total
  - id: q3
    text: Превращаю планы в действия.
    scales:
      - scale: total
  - id: q4
    text: Берусь за дело с головой.
    scales:
      - scale: total
  - id: q5
    text: Делаю больше, чем от меня ждут.
    scales:
      - scale: total
  - id: q6
    text: Ставлю высокую планку себе и другим.
    scales:
      - scale: total
  - id: q7
    text: Требую качества.
    scales:
      - scale: total
  - id: q8
    text: Не слишком стремлюсь к успеху.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Делаю ровно столько, чтобы от меня отстали.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Вкладываю в работу мало времени и сил.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Для каждой задачи заранее решайте, где здесь «достаточно хорошо», а где действительно нужен максимум. Без этой
    границы максимум расходуется на всё подряд, включая мелочи.
  - >-
    Заведите цели не только по результату, но и по процессу — например три часа сосредоточенной работы в день. Их можно
    выполнить и в плохой день, когда результат зависит не от вас.
  - >-
    Если своя планка кажется низкой, проверьте, не сравниваете ли вы свой средний день с чужим лучшим. В чужих отчётах и
    соцсетях виден только лучший.
