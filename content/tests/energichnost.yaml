slug: energichnost
version: 1.0.0
title: Тест на энергичность
seoTitle: Тест на энергичность онлайн — бесплатно, 10 вопросов
description: >-
  Шкала энергичности IPIP: 10 утверждений о темпе жизни, загруженности и скорости реакции. Занимает около 2 минут,
  результат с расшифровкой сразу.
category: personality
ctaCluster: self
minutes: 3
passport:
  measures: 'В каком темпе вы живёте: насколько вы загружены, быстры и деятельны в обычные дни.'
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт
    «Энергичность». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.71 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: Энергичность
    high: живёте в быстром темпе и всегда в делах
    low: предпочитаете неспешный ритм
    bands:
      - from: 0
        label: низкая
        text: >-
          Вы живёте в неспешном темпе: любите делать всё основательно и не гонитесь за количеством дел. Суета вас скорее
          раздражает, чем бодрит. Такой ритм бережёт ресурс, хотя со стороны иногда читается как медлительность.
      - from: 40
        label: средняя
        text: >-
          Темп средний: бывают загруженные периоды, бывают спокойные, и вы переключаетесь между ними без больших потерь.
          Несколько дел одновременно вы тянете, когда нужно, но не ради самого процесса. Устойчивый вариант.
      - from: 70
        label: высокая
        text: >-
          Вы почти всегда в движении: много дел, быстрые реакции, несколько задач параллельно. Отдыхать в тишине бывает
          труднее, чем работать. Главный риск — не заметить усталость, потому что скорость какое-то время её маскирует.
questions:
  - id: q1
    text: Постоянно чем-то занимаюсь.
    scales:
      - scale: total
  - id: q2
    text: Живу на бегу.
    scales:
      - scale: total
  - id: q3
    text: Успеваю многое в свободное время.
    scales:
      - scale: total
  - id: q4
    text: Справляюсь с несколькими делами одновременно.
    scales:
      - scale: total
  - id: q5
    text: Реагирую быстро.
    scales:
      - scale: total
  - id: q6
    text: Люблю не напрягаться.
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Люблю делать всё не спеша.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Предпочитаю размеренный образ жизни.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Даю событиям идти своим чередом.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: Реагирую медленно.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - 'Планируйте день не списком задач, а слотами времени: у списка нет дна, а календарь показывает реальный предел.'
  - >-
    Держите один пустой вечер в неделю без планов. Для быстрых людей это не отдых, а профилактика: усталость копится
    незаметно.
  - >-
    Если темп низкий и вас это устраивает — не ломайте его. Ускоряться имеет смысл точечно: выберите одно дело, где
    скорость реально что-то меняет, и разгоняйтесь только там.
