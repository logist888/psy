slug: voobrazhenie
version: 1.0.0
title: Тест на воображение
seoTitle: Тест на воображение онлайн — бесплатно, 10 вопросов
description: >-
  Шкала IPIP из 10 утверждений: насколько живо вы фантазируете, мечтаете и уходите в свои мысли. Занимает около 2 минут,
  результат — сразу после ответов.
category: personality
ctaCluster: self
minutes: 3
passport:
  measures: 'Насколько богата внутренняя жизнь человека: фантазии, мечты, образы и склонность размышлять.'
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт «воображение».
    Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.78 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: воображение
    high: живёт богатым внутренним миром и легко фантазирует
    low: мыслит конкретно и держится фактов
    bands:
      - from: 0
        label: сдержанное
        text: >-
          Вы мыслите конкретно и опираетесь на то, что перед глазами: меньше времени уходит на мечты, больше — на
          реальные дела. Это помогает не отрываться от действительности, но идеи в жанре «а что если» приходят реже. Их
          легко добирать снаружи: разговорами, книгами, чужими примерами.
      - from: 40
        label: умеренное
        text: >-
          Вы способны и пофантазировать, и вернуться к делу. Образы приходят, когда есть повод, и обычно не мешают
          сосредоточиться. Такой режим удобен там, где нужны и идеи, и исполнение.
      - from: 70
        label: яркое
        text: >-
          Внутренний мир у вас насыщенный: образы и сценарии приходят сами и часто становятся источником идей. Цена —
          рассеянность и привычка проживать событие в голове вместо реальности. Больше всего пользы, когда часть
          придуманного вы доводите до внешней формы.
questions:
  - id: q1
    text: Обладаю ярким воображением.
    scales:
      - scale: total
  - id: q2
    text: Люблю уноситься в фантазии.
    scales:
      - scale: total
  - id: q3
    text: Обожаю помечтать наяву.
    scales:
      - scale: total
  - id: q4
    text: Люблю уходить в свои мысли.
    scales:
      - scale: total
  - id: q5
    text: Позволяю себе фантазировать вволю.
    scales:
      - scale: total
  - id: q6
    text: Часто обдумываю то, что происходит вокруг.
    scales:
      - scale: total
  - id: q7
    text: Редко витаю в облаках.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Не могу похвастаться воображением.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Редко ухожу в свои мысли.
    scales:
      - scale: total
        reverse: true
  - id: q10
    text: С трудом представляю то, чего не видел.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Держите под рукой заметку для идей: фантазия окупается, только если часть образов переезжает в текст, эскиз или
    план.
  - >-
    Если мысли уносят в неподходящий момент, выделите им время — 15 минут в день на свободное блуждание, и в остальное
    время внимание держится заметно легче.
  - >-
    Обратите внимание, что именно рисует воображение: если чаще катастрофы, чем возможности, это уже не про творчество,
    и разбираться стоит отдельно с тревогой.
