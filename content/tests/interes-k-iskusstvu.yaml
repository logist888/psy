slug: interes-k-iskusstvu
version: 1.0.0
title: Тест на интерес к искусству
seoTitle: Тест на интерес к искусству онлайн — бесплатно, 9 вопросов
description: >-
  Шкала IPIP из 9 утверждений: насколько вас трогают музыка, искусство и красота вокруг. Занимает около 2 минут,
  результат — сразу с пояснением.
category: personality
ctaCluster: self
minutes: 3
passport:
  measures: Насколько человек ценит искусство, музыку и красоту и насколько сильно они на него действуют.
  origin: >-
    Шкала из международного пула пунктов IPIP (International Personality Item Pool), измеряющая конструкт «интерес к
    искусству». Русский перевод выполнен для этого проекта.
  rightsBasis: public_domain
  rightsNote: >-
    Пункты IPIP находятся в общественном достоянии с 1999 года, коммерческое использование разрешено явно. Перевод —
    собственная работа проекта.
  reliability: >-
    У англоязычного оригинала внутренняя согласованность α ≈ 0.84 (данные IPIP). Русский перевод независимой
    психометрической проверки не проходил, поэтому относитесь к результату как к ориентиру, а не к измерению.
  limitations: >-
    Шкала измеряет одну черту и описывает привычный способ вести себя, а не способности и не потолок возможностей.
    Результат зависит от состояния в момент прохождения, а нормы российской выборки не собраны: вы видите процент от
    максимума шкалы, а не сравнение с другими людьми.
instruction: Оцените, насколько каждое утверждение описывает вас. Отвечайте не задумываясь — первое впечатление обычно точнее.
options:
  - text: Совсем не про меня
    value: 0
  - text: Скорее не про меня
    value: 1
  - text: Затрудняюсь
    value: 2
  - text: Скорее про меня
    value: 3
  - text: Точно про меня
    value: 4
scales:
  - id: total
    name: интерес к искусству
    high: остро реагирует на красоту и искусство
    low: ценит вещи скорее за пользу, чем за красоту
    bands:
      - from: 0
        label: низкий
        text: >-
          Искусство занимает в вашей жизни немного места — вещь вы скорее оцените по пользе и удобству. Это экономит
          время и внимание, но лишает простого источника удовольствия и разрядки. Часто дело не в «отсутствии вкуса», а
          в том, что пока не встретился близкий вам жанр.
      - from: 40
        label: умеренный
        text: >-
          Вы замечаете красивое и цените музыку, природу или кино, но не строите вокруг этого жизнь. Искусство для вас
          приятный фон, а не отдельная потребность. Такой уровень легко углубить, когда появится подходящий повод.
      - from: 70
        label: высокий
        text: >-
          Вы остро реагируете на красоту: музыка, форма, свет и природа заметно меняют ваше состояние. Это даёт богатый
          источник впечатлений и часто идей для работы. Обратная сторона — некрасивая, шумная или безликая среда
          утомляет вас сильнее, чем других.
questions:
  - id: q1
    text: Считаю искусство важным.
    scales:
      - scale: total
  - id: q2
    text: Люблю музыку.
    scales:
      - scale: total
  - id: q3
    text: Люблю цветы.
    scales:
      - scale: total
  - id: q4
    text: Любуюсь красотой природы.
    scales:
      - scale: total
  - id: q5
    text: Не люблю искусство.
    scales:
      - scale: total
        reverse: true
  - id: q6
    text: Не люблю стихи.
    scales:
      - scale: total
        reverse: true
  - id: q7
    text: Не получаю удовольствия от походов в музеи.
    scales:
      - scale: total
        reverse: true
  - id: q8
    text: Не люблю концерты.
    scales:
      - scale: total
        reverse: true
  - id: q9
    text: Скучаю на танцевальных выступлениях.
    scales:
      - scale: total
        reverse: true
crisis: []
selfHelp:
  - >-
    Раз в месяц идите на «незнакомое»: жанр, который обычно пропускаете. Вкус растёт от прямого контакта, а не от чтения
    о произведениях.
  - >-
    Смотрите на одну вещь пять минут — картину, здание, кадр — и называйте словами, что именно цепляет; насмотренность
    так набирается быстрее всего.
  - >-
    Если классическое искусство не отзывается, зайдите через прикладное: типографику, дизайн предметов, музыку в
    фильмах, где красота связана с функцией.
