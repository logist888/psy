name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "claude/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно живёт только один деплой; новый пуш отменяет предыдущий.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Те же гейты, что и в CI: контент без правового основания или сломанный
      # скоринг не должны попасть на витрину.
      - run: pnpm validate:content
      - run: pnpm test

      # Путь выводим из имени репозитория, а не из Pages API: сборка не должна
      # падать из-за того, что Pages ещё не включены в настройках репозитория.
      - name: Build static export
        env:
          EXPORT: "1"
          BASE_PATH: /${{ github.event.repository.name }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          # Счётчик задаётся переменной репозитория (Settings → Variables).
          # Пока она пуста, аналитика инертна и баннер согласия не показывается.
          NEXT_PUBLIC_METRIKA_ID: ${{ vars.NEXT_PUBLIC_METRIKA_ID }}
        run: |
          pnpm build
          touch out/.nojekyll

      # Артефакт можно скачать из вкладки Actions даже без включённых Pages.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    # Публикуем только с main. Окружение github-pages разрешает деплой не с
    # любой ветки, и попытка с фиче-ветки отклоняется до запуска шагов — то есть
    # красит PR в красное без единой строчки лога. Проверку сборки это не
    # ослабляет: job build прогоняет все гейты на каждой ветке, а статику из
    # него можно скачать артефактом.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages включаются однократно вручную (Settings → Pages → Source: GitHub
      # Actions) — токен workflow этого сделать не может. Пока не включены,
      # деплой пропускается с понятным сообщением, а не роняет проверки PR.
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          code=$(echo "$body" | tail -n1)
          build_type=$(echo "$body" | sed '$d' | grep -o '"build_type"[^,]*' | cut -d'"' -f4)

          # Источник Pages должен быть "GitHub Actions". Если это ветка, GitHub
          # на каждый пуш в main запускает свою сборку Jekyll — она публикует
          # README вместо приложения и гоняется с этим workflow: побеждает тот,
          # кто финишировал последним, и живой сайт произвольно переключается.
          if [ "$code" = "200" ] && [ "$build_type" != "workflow" ]; then
            echo "::error::Источник GitHub Pages = '$build_type', а должен быть 'workflow'. Сейчас автоматическая сборка Jekyll конкурирует с этим деплоем и произвольно перезаписывает сайт. Исправление: Settings → Pages → Source → GitHub Actions."
            exit 1
          fi

          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### GitHub Pages ещё не включены"
              echo ""
              echo "Сборка прошла, статика собрана и лежит в артефакте \`github-pages\` этого запуска."
              echo "Чтобы сайт открылся по адресу, включите Pages один раз:"
              echo "**Settings → Pages → Source: GitHub Actions**, затем перезапустите этот workflow."
              echo ""
              echo "Для приватного репозитория Pages доступны на платных планах GitHub;"
              echo "на бесплатном — сделайте репозиторий публичным."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - id: deployment
        if: steps.check.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
