name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "claude/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно живёт только один деплой; новый пуш отменяет предыдущий.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Те же гейты, что и в CI: контент без правового основания или сломанный
      # скоринг не должны попасть на витрину.
      - run: pnpm validate:content
      - run: pnpm test

      # Путь выводим из имени репозитория, а не из Pages API: сборка не должна
      # падать из-за того, что Pages ещё не включены в настройках репозитория.
      - name: Build static export
        env:
          EXPORT: "1"
          BASE_PATH: /${{ github.event.repository.name }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          pnpm build
          touch out/.nojekyll

      # Артефакт можно скачать из вкладки Actions даже без включённых Pages.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages включаются однократно вручную (Settings → Pages → Source: GitHub
      # Actions) — токен workflow этого сделать не может. Пока не включены,
      # деплой пропускается с понятным сообщением, а не роняет проверки PR.
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### GitHub Pages ещё не включены"
              echo ""
              echo "Сборка прошла, статика собрана и лежит в артефакте \`github-pages\` этого запуска."
              echo "Чтобы сайт открылся по адресу, включите Pages один раз:"
              echo "**Settings → Pages → Source: GitHub Actions**, затем перезапустите этот workflow."
              echo ""
              echo "Для приватного репозитория Pages доступны на платных планах GitHub;"
              echo "на бесплатном — сделайте репозиторий публичным."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - id: deployment
        if: steps.check.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
