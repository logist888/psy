name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Гейт правового реестра: методика без основания не пройдёт сборку
      - run: pnpm validate:content
      - run: pnpm typecheck
      # Golden-тесты скоринга — блокер релиза при изменении расчёта
      - run: pnpm test
      - run: pnpm build
